<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aggettivi — Italian Flip Card Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3ead8;
    --cream-deep: #e8dcc4;
    --paper: #fbf6ea;
    --ink: #1c1611;
    --ink-soft: #5a4d3f;
    --ink-faded: #8a7a68;
    --terracotta: #a23e2c;
    --olive: #5a6b3a;
    --gold: #b08540;
    --shadow: rgba(28, 22, 17, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse 600px 400px at 15% 10%, rgba(176, 133, 64, 0.10), transparent 60%),
      radial-gradient(ellipse 800px 500px at 85% 90%, rgba(162, 62, 44, 0.06), transparent 60%);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 20px 48px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  .container {
    max-width: 660px;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 14px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 0.95;
    margin: 0;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .stats {
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }

  .stat { text-align: right; }

  .stat-label {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
  }

  .stat-value .sub {
    color: var(--ink-faded);
    font-size: 18px;
    font-weight: 400;
  }

  [data-view="setup"] .stats,
  [data-view="setup"] .progress-bar,
  [data-view="setup"] #controls { display: none; }

  .progress-bar {
    height: 2px;
    background: rgba(28, 22, 17, 0.08);
    margin-bottom: 28px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  /* ===== Setup view ===== */
  .setup-intro {
    text-align: center;
    margin-bottom: 22px;
  }

  .setup-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .setup-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 38px;
    margin: 0 0 10px;
    line-height: 1;
  }

  .setup-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 460px;
    line-height: 1.6;
  }

  .setup-sub em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
  }

  /* ===== Theme picker ===== */
  .theme-row {
    margin-bottom: 22px;
    padding: 14px 0 16px;
    border-top: 1px dashed rgba(28, 22, 17, 0.15);
    border-bottom: 1px dashed rgba(28, 22, 17, 0.15);
  }

  .theme-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-faded);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .theme-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .theme-chip {
    background: transparent;
    border: 1px dashed rgba(28, 22, 17, 0.22);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 5px 12px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    user-select: none;
    -webkit-user-select: none;
    font-weight: 500;
  }

  .theme-chip:hover {
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  .theme-chip.partial {
    border-style: solid;
    border-color: var(--gold);
    color: var(--ink);
    background: rgba(176, 133, 64, 0.08);
  }

  .theme-chip.full {
    border-style: solid;
    border-color: var(--gold);
    background: var(--gold);
    color: var(--cream);
  }

  .theme-chip-count {
    opacity: 0.5;
    margin-left: 5px;
    font-weight: 400;
  }

  .theme-chip.full .theme-chip-count { opacity: 0.7; }
  .theme-chip:focus:not(:focus-visible) { outline: none; }

  .verb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 8px;
    margin-bottom: 22px;
  }

  .verb-chip {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 13px 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s, background 0.15s;
    text-align: left;
    position: relative;
    font-family: inherit;
    color: inherit;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 6px -3px var(--shadow);
    user-select: none;
    -webkit-user-select: none;
  }

  .verb-chip:hover { border-color: var(--ink); }
  .verb-chip:focus:not(:focus-visible) { outline: none; }

  .verb-chip.unselected {
    background: transparent;
    border-style: dashed;
    border-color: rgba(28, 22, 17, 0.22);
    opacity: 0.5;
    box-shadow: none;
  }

  .verb-chip.unselected:hover { opacity: 0.8; border-color: var(--ink-soft); }

  .verb-chip-italian {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    margin-bottom: 5px;
    padding-right: 14px;
  }

  .verb-chip-english {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  .verb-chip-mark {
    position: absolute;
    top: 11px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    font-size: 13px;
    line-height: 1;
    transition: opacity 0.15s;
  }

  .verb-chip.unselected .verb-chip-mark { opacity: 0; }

  .setup-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 12px;
    color: var(--ink-faded);
    flex-wrap: wrap;
    gap: 12px;
  }

  .ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: rgba(28, 22, 17, 0.25);
    padding: 0;
    transition: color 0.15s;
  }

  .ghost:hover { color: var(--ink); text-decoration-color: var(--ink); }

  .divider {
    color: var(--ink-faded);
    margin: 0 6px;
    user-select: none;
  }

  .deck-readout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .deck-readout strong {
    color: var(--ink);
    font-weight: 500;
  }

  /* ===== Persistent stats strip ===== */
  .setup-meta {
    margin-bottom: 22px;
    padding: 11px 16px;
    background: rgba(176, 133, 64, 0.07);
    border-left: 2px solid var(--gold);
    border-radius: 0 3px 3px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .setup-meta.empty { display: none; }

  .setup-meta strong {
    color: var(--ink);
    font-weight: 500;
  }

  .setup-meta .ghost {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  .start-btn {
    width: 100%;
    padding: 18px;
    font-size: 13px;
    letter-spacing: 0.18em;
  }

  .start-btn:disabled {
    background: rgba(28, 22, 17, 0.18);
    color: var(--cream-deep);
    cursor: not-allowed;
  }

  /* ===== Card / game ===== */
  .card {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.12);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 24px 48px -24px var(--shadow),
      0 6px 14px -6px var(--shadow);
    border-radius: 3px;
    padding: 60px 40px 52px;
    margin-bottom: 22px;
    position: relative;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(28, 22, 17, 0.06);
    border-radius: 2px;
    pointer-events: none;
  }

  .card-corner {
    position: absolute;
    top: 18px;
    left: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.12em;
    z-index: 2;
  }

  .card-corner.right { left: auto; right: 22px; }

  .verb-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.14em;
    margin-bottom: 18px;
    text-transform: lowercase;
  }

  .prompt {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-weight: 500;
    text-align: center;
    line-height: 1.05;
    color: var(--ink);
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .pronoun-hint {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-top: 22px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  input.answer {
    flex: 1;
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 16px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input.answer::placeholder {
    color: var(--ink-faded);
    font-style: italic;
  }

  input.answer:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(28, 22, 17, 0.06);
  }

  input.answer:disabled {
    background: rgba(28, 22, 17, 0.03);
    color: var(--ink-soft);
  }

  button.submit {
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 0 26px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, transform 0.05s;
    white-space: nowrap;
  }

  button.submit:hover:not(:disabled) { background: #2a2218; }
  button.submit:active:not(:disabled) { transform: translateY(1px); }

  .feedback {
    min-height: 50px;
    display: flex;
    align-items: center;
    padding: 13px 18px;
    border-radius: 3px;
    font-size: 13px;
    transition: opacity 0.2s;
    line-height: 1.4;
  }

  .feedback.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .feedback.correct {
    background: rgba(90, 107, 58, 0.10);
    color: var(--olive);
    border-left: 3px solid var(--olive);
  }

  .feedback.incorrect {
    background: rgba(162, 62, 44, 0.08);
    color: var(--terracotta);
    border-left: 3px solid var(--terracotta);
  }

  .feedback strong {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-style: italic;
    font-weight: 600;
    margin: 0 4px;
  }

  .feedback-body { width: 100%; }

  .feedback-note {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(162, 62, 44, 0.25);
    font-size: 12px;
    color: var(--ink-soft);
    font-style: normal;
    line-height: 1.5;
    letter-spacing: 0.01em;
  }

  .feedback-note em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
  }

  #controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--ink-faded);
    letter-spacing: 0.04em;
    flex-wrap: wrap;
    gap: 10px;
  }

  .controls-left { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .controls-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .game-trim {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faded);
  }

  .game-trim select {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.2);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 4px 8px;
    border-radius: 3px;
    cursor: pointer;
    outline: none;
  }

  .game-trim select:focus { border-color: var(--ink); }

  kbd {
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 6px;
    background: rgba(28, 22, 17, 0.06);
    border: 1px solid rgba(28, 22, 17, 0.1);
    border-radius: 3px;
    font-size: 10px;
  }

  .complete {
    text-align: center;
    padding: 40px 24px;
  }

  .complete .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .complete h2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 64px;
    margin: 0 0 6px;
    line-height: 1;
  }

  .complete .pct {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 6px;
  }

  .complete .msg {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 auto 28px;
    max-width: 360px;
    line-height: 1.5;
  }

  .complete-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .complete-actions .ghost {
    color: var(--ink-soft);
    font-size: 13px;
  }

  .streak-flag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--terracotta);
    letter-spacing: 0.12em;
  }

  @media (max-width: 520px) {
    .prompt { font-size: 42px; }
    .card { padding: 50px 24px 40px; min-height: 240px; }
    header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .stats { width: 100%; justify-content: flex-start; gap: 32px; }
    .stat { text-align: left; }
    .input-row { flex-direction: column; }
    button.submit { padding: 14px; }
    .setup-title { font-size: 30px; }
    .verb-grid { grid-template-columns: repeat(2, 1fr); }
    .verb-chip-italian { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="container" id="container" data-view="setup">
    <header>
      <div>
        <h1 class="title">Aggettivi</h1>
        <div class="subtitle">Flip Card · Forma del Dizionario</div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Card</div>
          <div class="stat-value"><span id="current">1</span><span class="sub">/<span id="total">100</span></span></div>
        </div>
      </div>
    </header>

    <div class="progress-bar">
      <div class="progress-fill" id="progress" style="width: 0%"></div>
    </div>

    <div id="game-area"></div>

    <div id="controls"></div>
  </div>

<script>
  // ============================================================================
  // Top 50 most common Italian adjectives.
  //
  // The user types the masculine singular (dictionary) form.
  // The "type" field marks the agreement pattern:
  //   "4" — four-form adjective (-o/-a/-i/-e), the largest group
  //   "2" — two-form adjective (-e/-i), no separate masculine/feminine ending
  //   "inv" — invariable, never changes
  //
  // The "note" field appears as a teaching tip on a wrong answer for the
  // handful of adjectives with quirks the dictionary form doesn't reveal.
  // ============================================================================
  const adjData = [
    // Size & shape
    { en: "big",            it: "grande",       type: "2" },
    { en: "small",          it: "piccolo",      type: "4" },
    { en: "tall · high",    it: "alto",         type: "4" },
    { en: "low · short",    it: "basso",        type: "4" },
    { en: "long",           it: "lungo",        type: "4" },
    { en: "short (length)", it: "corto",        type: "4" },
    { en: "big · thick",    it: "grosso",       type: "4" },
    { en: "wide",           it: "largo",        type: "4" },
    { en: "narrow · tight", it: "stretto",      type: "4" },
    { en: "deep",           it: "profondo",     type: "4" },
    { en: "light (weight)", it: "leggero",      type: "4" },
    { en: "heavy",          it: "pesante",      type: "2" },

    // Quality (positive · negative)
    { en: "good",           it: "buono",        type: "4", note: "Before a singular noun, <em>buono</em> shortens like the indefinite article: <em>buon giorno, buon amico, buona sera, buon'amica</em>. The full form <em>buono</em> only stays before s+cons, z, gn, ps: <em>un buono studente</em>." },
    { en: "bad",            it: "cattivo",      type: "4" },
    { en: "beautiful",      it: "bello",        type: "4", note: "Before a noun, <em>bello</em> takes article-like forms: <em>bel ragazzo, bei ragazzi, bell'amico, begli studenti, bella casa</em> — mirroring the definite articles <em>il/i/l'/gli/la</em>." },
    { en: "ugly",           it: "brutto",       type: "4" },
    { en: "true",           it: "vero",         type: "4" },
    { en: "right · fair",   it: "giusto",       type: "4" },
    { en: "wrong",          it: "sbagliato",    type: "4" },
    { en: "sure · safe",    it: "sicuro",       type: "4" },
    { en: "certain",        it: "certo",        type: "4" },

    // Age & order
    { en: "new",            it: "nuovo",        type: "4" },
    { en: "old (thing)",    it: "vecchio",      type: "4" },
    { en: "first",          it: "primo",        type: "4" },
    { en: "last",           it: "ultimo",       type: "4" },
    { en: "young",          it: "giovane",      type: "2" },
    { en: "next",           it: "prossimo",     type: "4" },
    { en: "modern",         it: "moderno",      type: "4" },
    { en: "ancient",        it: "antico",       type: "4" },

    // Sensation (temperature · taste · texture)
    { en: "hot",            it: "caldo",        type: "4" },
    { en: "cold",           it: "freddo",       type: "4" },
    { en: "fast",           it: "veloce",       type: "2" },
    { en: "slow",           it: "lento",        type: "4" },
    { en: "sweet",          it: "dolce",        type: "2" },
    { en: "bitter",         it: "amaro",        type: "4" },
    { en: "salty",          it: "salato",       type: "4" },
    { en: "hard",           it: "duro",         type: "4" },
    { en: "soft",           it: "morbido",      type: "4" },

  // ============================================================================
  // Themes — thematic groupings for the setup picker. Each theme lists the
  // adjective keys (adjData[i].it) it contains. The runtime validator below
  // confirms every listed key exists in adjData and flags dupes.
  // ============================================================================
  const THEMES = [
    { key: 'dimensione',   label: 'Dimensione',    adjs: ['grande','piccolo','alto','basso','lungo','corto','grosso','largo','stretto','profondo','leggero','pesante'] },
    { key: 'qualita',      label: 'Qualità',       adjs: ['buono','cattivo','bello','brutto','vero','giusto','sbagliato','sicuro','certo'] },
    { key: 'ordine',       label: 'Ordine · età',  adjs: ['nuovo','vecchio','giovane','primo','ultimo','prossimo','moderno','antico'] },
    { key: 'sensazione',   label: 'Sensazione',    adjs: ['caldo','freddo','veloce','lento','dolce','amaro','salato','duro','morbido','fresco'] },
    { key: 'abilita',      label: 'Abilità',       adjs: ['forte','debole','facile','difficile'] },
    { key: 'emozioni',     label: 'Emozioni',      adjs: ['felice','triste','stanco','contento','arrabbiato','calmo','nervoso','preoccupato','innamorato'] },
    { key: 'ricchezza',    label: 'Ricchezza',     adjs: ['ricco','povero','caro'] },
    { key: 'stato',        label: 'Stato',         adjs: ['pieno','vuoto','aperto','chiuso','pulito','sporco','libero','occupato','comodo','rotto','sano','malato','vivo','morto'] },
    { key: 'colori',       label: 'Colori',        adjs: ['bianco','nero','rosso','verde','giallo','blu','grigio','rosa','viola','marrone'] },
    { key: 'personalita',  label: 'Personalità',   adjs: ['gentile','simpatico','intelligente','importante','interessante','divertente','noioso','serio','allegro','timido','onesto','generoso','coraggioso'] },
    { key: 'nazionalita',  label: 'Nazionalità',   adjs: ['italiano','francese','inglese','americano','tedesco','spagnolo','cinese','russo'] }
  ];

  // Runtime validator — confirms theme references match adjData, catches dupes
  (function validateData() {
    const known = new Set(adjData.map(a => a.it));
    const missing = [];
    const themeDupes = [];
    const seenInThemes = new Set();
    for (const t of THEMES) {
      for (const a of t.adjs) {
        if (!known.has(a)) missing.push(`${t.key}: ${a}`);
        if (seenInThemes.has(a)) themeDupes.push(a);
        seenInThemes.add(a);
      }
    }
    const dataKeys = adjData.map(a => a.it);
    const dataDupes = dataKeys.filter((v, i) => dataKeys.indexOf(v) !== i);
    const uncategorised = adjData.filter(a => !seenInThemes.has(a.it)).map(a => a.it);
    if (missing.length)      console.warn('THEMES entries missing from adjData:', missing);
    if (themeDupes.length)   console.warn('Adjectives listed in more than one theme:', themeDupes);
    if (dataDupes.length)    console.warn('Duplicate entries in adjData:', dataDupes);
    if (uncategorised.length) console.warn('adjData entries not assigned to any theme:', uncategorised);
  })();

  // ============================================================================
  // Helpers
  // ============================================================================
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function normalize(s) {
    return s
      .toLowerCase()
      .trim()
      .replace(/[\u2018\u2019\u02BC\u02B9´`']/g, '')
      .replace(/[àáâã]/g, 'a')
      .replace(/[èéêë]/g, 'e')
      .replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o')
      .replace(/[ùúûü]/g, 'u')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function typeLabel(t) {
    if (t === '4')   return '4-form · -o,-a,-i,-e';
    if (t === '2')   return '2-form · -e,-i';
    if (t === 'inv') return 'invariable';
    return '';
  }

  function themeState(theme) {
    let selected = 0;
    for (const key of theme.adjs) if (selectedAdjs.has(key)) selected++;
    if (selected === 0) return 'empty';
    if (selected === theme.adjs.length) return 'full';
    return 'partial';
  }

  // For 4-form adjectives ending in -o, the feminine singular is the same
  // stem with -a. 2-form and invariable adjectives have only one singular
  // form, so no alternate to add.
  function acceptedForms(a) {
    const accepted = [a.it];
    if (a.type === '4' && a.it.endsWith('o')) {
      accepted.push(a.it.slice(0, -1) + 'a');
    }
    return accepted;
  }

  function buildDeck() {
    const deck = [];
    for (const a of adjData) {
      if (!selectedAdjs.has(a.it)) continue;
      deck.push({
        english: a.en,
        italian: a.it,
        type: a.type,
        note: a.note || null,
        accepted: acceptedForms(a)
      });
    }
    return deck;
  }

  // ============================================================================
  // Per-adjective performance, persisted to localStorage
  // Shape: { [adjKey]: { seen: n, wrong: n } }
  // ============================================================================
  const STATS_KEY = 'aggettivi-stats-v1';
  let stats = loadStats();

  function loadStats() {
    try {
      const raw = localStorage.getItem(STATS_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveStats() {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }
    catch (e) { /* quota full or disabled — silently ignore */ }
  }

  function recordAnswer(adjKey, isCorrect) {
    const s = stats[adjKey] || { seen: 0, wrong: 0 };
    s.seen += 1;
    if (!isCorrect) s.wrong += 1;
    stats[adjKey] = s;
    saveStats();
  }

  // Return up to `count` adjective keys ordered weakest first. Weakness =
  // error rate (with wrong-count as tie-break). Cards with zero wrong
  // answers don't count as weak; if we don't have enough, we pad with
  // random unseen ones so the button always returns something useful.
  function weakestAdjs(count) {
    const scored = adjData.map(a => {
      const s = stats[a.it] || { seen: 0, wrong: 0 };
      const rate = s.seen > 0 ? s.wrong / s.seen : 0;
      return { it: a.it, rate, wrong: s.wrong, seen: s.seen };
    });
    scored.sort((a, b) => {
      if (b.rate !== a.rate) return b.rate - a.rate;
      return b.wrong - a.wrong;
    });
    const weak = scored.filter(s => s.wrong > 0).slice(0, count);
    if (weak.length < count) {
      const have = new Set(weak.map(w => w.it));
      const padPool = shuffle(adjData.filter(a => !have.has(a.it)));
      for (const a of padPool) {
        if (weak.length >= count) break;
        weak.push({ it: a.it });
      }
    }
    return weak.map(w => w.it);
  }

  // ============================================================================
  // State
  // ============================================================================
  let selectedAdjs = new Set(adjData.map(a => a.it));
  let deck = [];
  let index = 0;
  let score = 0;
  let streak = 0;
  let bestStreak = 0;
  let answered = false;

  // Session-scoped ceiling: once a game starts, this is the pool of cards
  // available for this session. `deck` is a subset (up to full size). Mid-game
  // resize slides between 1 and sessionMaxDeck.length. Play again & Reshuffle
  // replay the current deck subset. Returning to setup clears it.
  let sessionMaxDeck = null;

  // ============================================================================
  // DOM refs
  // ============================================================================
  const container = document.getElementById('container');
  const gameArea = document.getElementById('game-area');
  const controlsEl = document.getElementById('controls');
  const scoreEl = document.getElementById('score');
  const currentEl = document.getElementById('current');

  // ============================================================================
  // Setup view
  // ============================================================================
  function showSetup() {

    // ===== Theme picker =====
    document.getElementById('theme-chips').addEventListener('click', (e) => {
      const btn = e.target.closest('.theme-chip');
      if (!btn) return;
      const theme = THEMES.find(t => t.key === btn.dataset.theme);
      if (!theme) return;
      const state = themeState(theme);
      const shouldFill = state !== 'full'; // empty or partial → fill; full → clear
      for (const key of theme.adjs) {
        if (shouldFill) selectedAdjs.add(key);
        else selectedAdjs.delete(key);
      }
      gameArea.querySelectorAll('.verb-chip').forEach(c => {
        if (selectedAdjs.has(c.dataset.adj)) c.classList.remove('unselected');
        else c.classList.add('unselected');
      });
      updateReadout();
    });

    // ===== Chip selection: click to toggle, click-and-drag to paint =====
    // Strategy: mousedown sets a "paint mode" based on the starting chip's
    // current state (selected → drag deselects, unselected → drag selects),
    // then mouseover on neighbouring chips applies that mode. Single clicks
    // still toggle because mousedown alone is enough to flip the start chip.
    const grid = document.getElementById('verb-grid');
    grid.addEventListener('mousedown', (e) => {
      const chip = e.target.closest('.verb-chip');
      if (!chip) return;
      e.preventDefault(); // no text selection while dragging
      const key = chip.dataset.adj;
      const wasSelected = selectedAdjs.has(key);
      dragMode = wasSelected ? 'deselect' : 'select';
      dragActive = true;
      applyDragToChip(chip, key);
    });
    grid.addEventListener('mouseover', (e) => {
      if (!dragActive) return;
      const chip = e.target.closest('.verb-chip');
      if (!chip) return;
      applyDragToChip(chip, chip.dataset.adj);
    });
    // Keyboard: Enter/Space still toggles a focused chip
    grid.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const chip = e.target.closest('.verb-chip');
      if (!chip) return;
      e.preventDefault();
      const key = chip.dataset.adj;
      if (selectedAdjs.has(key)) {
        selectedAdjs.delete(key);
        chip.classList.add('unselected');
      } else {
        selectedAdjs.add(key);
        chip.classList.remove('unselected');
      }
      updateReadout();
    });

    document.getElementById('select-all').addEventListener('click', () => {
      adjData.forEach(a => selectedAdjs.add(a.it));
      gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.remove('unselected'));
      updateReadout();
    });

    document.getElementById('clear-all').addEventListener('click', () => {
      selectedAdjs.clear();
      gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.add('unselected'));
      updateReadout();
    });

    document.getElementById('random-20').addEventListener('click', () => randomPick(20));
    document.getElementById('random-50').addEventListener('click', () => randomPick(50));
    document.getElementById('weakest-10').addEventListener('click', () => weakestPick(10));
    document.getElementById('weakest-20').addEventListener('click', () => weakestPick(20));

    function randomPick(count) {
      const picks = shuffle(adjData).slice(0, Math.min(count, adjData.length)).map(a => a.it);
      applyPick(picks);
    }

    function weakestPick(count) {
      const picks = weakestAdjs(Math.min(count, adjData.length));
      applyPick(picks);
    }

    function applyPick(keys) {
      selectedAdjs.clear();
      keys.forEach(k => selectedAdjs.add(k));
      gameArea.querySelectorAll('.verb-chip').forEach(c => {
        if (selectedAdjs.has(c.dataset.adj)) c.classList.remove('unselected');
        else c.classList.add('unselected');
      });
      updateReadout();
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    updateReadout();
    renderSetupMeta();
  }

  // Drag state — module-scoped so document-level mouseup can always terminate
  let dragActive = false;
  let dragMode = null;

  function applyDragToChip(chip, key) {
    if (dragMode === 'select') {
      if (selectedAdjs.has(key)) return;
      selectedAdjs.add(key);
      chip.classList.remove('unselected');
    } else {
      if (!selectedAdjs.has(key)) return;
      selectedAdjs.delete(key);
      chip.classList.add('unselected');
    }
    updateReadout();
  }

  // Document-level terminators so a drag always ends even if the mouse
  // leaves the grid or the window
  document.addEventListener('mouseup', () => { dragActive = false; dragMode = null; });
  document.addEventListener('mouseleave', () => { dragActive = false; dragMode = null; });

  function updateReadout() {
    const n = selectedAdjs.size;
    const selCountEl = document.getElementById('selected-count');
    const cardCountEl = document.getElementById('card-count');
    if (selCountEl) selCountEl.textContent = n;
    if (cardCountEl) cardCountEl.textContent = n;
    const start = document.getElementById('start-btn');
    if (start) {
      start.disabled = n === 0;
      start.textContent = n === 0
        ? 'Select at least one adjective'
        : `▶ Start practising · ${n} card${n === 1 ? '' : 's'}`;
    }
    updateThemeChips();
  }

  function updateThemeChips() {
    const chips = document.getElementById('theme-chips');
    if (!chips) return;
    chips.querySelectorAll('.theme-chip').forEach(btn => {
      const theme = THEMES.find(t => t.key === btn.dataset.theme);
      if (!theme) return;
      btn.classList.remove('partial', 'full');
      const state = themeState(theme);
      if (state === 'partial') btn.classList.add('partial');
      else if (state === 'full') btn.classList.add('full');
    });
  }

  function renderSetupMeta() {
    const el = document.getElementById('setup-meta');
    if (!el) return;
    const entries = Object.values(stats);
    const practised = entries.filter(s => s.seen > 0).length;
    const weakCount = entries.filter(s => s.wrong > 0).length;
    if (practised === 0) {
      el.classList.add('empty');
      el.innerHTML = '';
      return;
    }
    el.classList.remove('empty');
    el.innerHTML = `
      <span>↳ <strong>${practised}</strong>/${adjData.length} practised &nbsp;·&nbsp; <strong>${weakCount}</strong> with errors logged</span>
      <button type="button" class="ghost" id="reset-stats">reset progress</button>
    `;
    document.getElementById('reset-stats').addEventListener('click', () => {
      if (confirm('Reset all practice history? This cannot be undone.')) {
        stats = {};
        saveStats();
        renderSetupMeta();
      }
    });
  }

    document.getElementById('reshuffle-btn').addEventListener('click', () => startGame({ reshuffle: true }));
    document.getElementById('change-btn').addEventListener('click', showSetup);
    document.getElementById('game-trim-input').addEventListener('change', handleGameResize);
    refreshTrimDropdown();
  }

  // startGame supports two paths:
  //   - fresh: build sessionMaxDeck from current selection, deck = full copy
  //   - reshuffle: keep sessionMaxDeck, deck stays the same size, just reshuffled
  function startGame(opts = {}) {
    if (selectedAdjs.size === 0) return;
    if (!sessionMaxDeck || !opts.reshuffle) {
      sessionMaxDeck = shuffle(buildDeck());
      deck = sessionMaxDeck.slice();
    } else {
      // Reshuffle the current-sized deck. Preserves which cards are in play.
      deck = shuffle(deck);
    }
    index = 0;
    score = 0;
    streak = 0;
    bestStreak = 0;
    scoreEl.textContent = '0';
    totalEl.textContent = deck.length;
    container.dataset.view = 'game';
    gameArea.innerHTML = cardHTML;
    showGameControls();

    document.getElementById('submit').addEventListener('click', handleSubmit);

    render();
  }

  // Mid-game deck resize — reads the dropdown value. Can shrink (slice) or
  // grow (pull unused cards from sessionMaxDeck and append). Preserves the
  // current index so the card under your hands stays put. If we're already
  // past the new end, wraps up.
  function handleGameResize() {
    const select = document.getElementById('game-trim-input');
    if (!select || !sessionMaxDeck) return;
    const newSize = parseInt(select.value, 10);
    if (!Number.isFinite(newSize) || newSize <= 0 || newSize === deck.length) return;

    if (newSize < deck.length) {
      deck = deck.slice(0, newSize);
    } else if (newSize <= sessionMaxDeck.length) {
      const currentSet = new Set(deck.map(c => c.italian));
      const unused = sessionMaxDeck.filter(c => !currentSet.has(c.italian));
      const toAdd = shuffle(unused).slice(0, newSize - deck.length);
      deck = deck.concat(toAdd);
    } else {
      return;
    }

    totalEl.textContent = deck.length;
    progressEl.style.width = `${Math.min(index / deck.length, 1) * 100}%`;
    refreshTrimDropdown();
    if (index >= deck.length) showComplete();
  }

  // Populate the deck-size dropdown based on the current sessionMaxDeck ceiling.
  // Offers multiples of 5 up to the ceiling, plus the ceiling itself labelled
  // "all (N)", plus the current deck.length if it's not already an option.
  function refreshTrimDropdown() {
    const select = document.getElementById('game-trim-input');
    if (!select || !sessionMaxDeck) return;
    const maxLen = sessionMaxDeck.length;
    const current = deck.length;

    const raw = [];
    for (let n = 5; n < maxLen; n += 5) raw.push(n);
    raw.push(maxLen);
    if (!raw.includes(current)) raw.push(current);
    const sizes = [...new Set(raw)].filter(n => n >= 1 && n <= maxLen).sort((a, b) => a - b);

    select.innerHTML = sizes.map(n => {
      const label = n === maxLen ? `all (${n})` : `${n}`;
      return `<option value="${n}"${n === current ? ' selected' : ''}>${label}</option>`;
    }).join('');
  }

  function render() {
    if (index >= deck.length) {
      showComplete();
      return;
    }
    const card = deck[index];
    document.getElementById('prompt').textContent = card.english;
    document.getElementById('verb-meta').textContent = typeLabel(card.type);
    document.getElementById('cardnum').textContent = String(index + 1).padStart(3, '0');

    const ans = document.getElementById('answer');
    const sub = document.getElementById('submit');
    const fb = document.getElementById('feedback');
    ans.value = '';
    ans.disabled = false;
    sub.textContent = 'Controlla';
    fb.className = 'feedback hidden';
    fb.innerHTML = '';
    answered = false;

    currentEl.textContent = index + 1;
    progressEl.style.width = `${(index / deck.length) * 100}%`;

    document.getElementById('streak-display').textContent = streak >= 3
      ? `🔥 streak ${streak}` : '';

    setTimeout(() => ans.focus(), 30);
  }

  function handleSubmit() {
    if (answered) { index++; render(); return; }

    const ans = document.getElementById('answer');
    const sub = document.getElementById('submit');
    const fb = document.getElementById('feedback');
    const card = deck[index];
    const raw = ans.value;
    const guess = normalize(raw);

    answered = true;
    ans.disabled = true;
    sub.textContent = 'Avanti →';

    // Match against any accepted form (dictionary masc, plus feminine sing
    // for 4-form adjectives). On a hit, echo the specific form they typed
    // rather than the dictionary form.
    const match = card.accepted.find(a => normalize(a) === guess);
    const isCorrect = guess !== '' && !!match;
    recordAnswer(card.italian, isCorrect);

    if (isCorrect) {
      score++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      scoreEl.textContent = score;
      fb.className = 'feedback correct';
      fb.innerHTML = `<div class="feedback-body">✓ Bravo — <strong>${match}</strong></div>`;
    } else {
      streak = 0;
      fb.className = 'feedback incorrect';
      const main = raw.trim() === ''
        ? `Skipped — the answer is <strong>${card.italian}</strong>`
        : `✗ Not quite — the answer is <strong>${card.italian}</strong>`;
      const noteHTML = card.note ? `<div class="feedback-note">${card.note}</div>` : '';
      fb.innerHTML = `<div class="feedback-body">${main}${noteHTML}</div>`;
    }
  }

  function showComplete() {
    progressEl.style.width = '100%';
    const pct = Math.round((score / deck.length) * 100);
    let msg;
    if (pct >= 95)      msg = 'Magnifico! Near-perfect mastery of these adjectives.';
    else if (pct >= 80) msg = 'Bravissimo! These words are clearly sticking.';
    else if (pct >= 65) msg = 'Bene! Solid foundation — another pass will lock it in.';
    else if (pct >= 50) msg = 'Halfway there. The patterns reveal themselves with repetition.';
    else                msg = 'Every round counts. Reshuffle and go again — fluency is built one card at a time.';

    container.dataset.view = 'complete';
    gameArea.innerHTML = `
      <div class="card complete">
        <div class="badge">FINE DELLA SESSIONE</div>
        <h2>${score}<span style="color: var(--ink-faded); font-weight: 400;">/${deck.length}</span></h2>
        <div class="pct">${pct}% &nbsp;·&nbsp; best streak ${bestStreak}</div>
        <p class="msg">${msg}</p>
        <div class="complete-actions">
          <button type="button" class="submit" id="play-again">↻ Play again</button>
          <button type="button" class="ghost" id="back-to-setup">← Change adjectives</button>
        </div>
      </div>
    `;
    controlsEl.innerHTML = '';
    // Play again keeps the same subset (uses reshuffle path)
    document.getElementById('play-again').addEventListener('click', () => startGame({ reshuffle: true }));
    document.getElementById('back-to-setup').addEventListener('click', showSetup);
  }

  // Global Enter handler
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (container.dataset.view !== 'game') return;
    e.preventDefault();
    handleSubmit();
  });

  // Initial mount
  showSetup();
</script>
</body>
</html>
