<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbi Regolari — Italian Flip Card Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3ead8;
    --cream-deep: #e8dcc4;
    --paper: #fbf6ea;
    --ink: #1c1611;
    --ink-soft: #5a4d3f;
    --ink-faded: #8a7a68;
    --terracotta: #a23e2c;
    --olive: #5a6b3a;
    --gold: #b08540;
    --shadow: rgba(28, 22, 17, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse 600px 400px at 15% 10%, rgba(176, 133, 64, 0.10), transparent 60%),
      radial-gradient(ellipse 800px 500px at 85% 90%, rgba(162, 62, 44, 0.06), transparent 60%);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 20px 48px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  .container {
    max-width: 660px;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 14px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 0.95;
    margin: 0;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .stats {
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }

  .stat { text-align: right; }

  .stat-label {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
  }

  .stat-value .sub {
    color: var(--ink-faded);
    font-size: 18px;
    font-weight: 400;
  }

  /* View-based hiding */
  [data-view="setup"] .stats,
  [data-view="setup"] .progress-bar,
  [data-view="setup"] #controls { display: none; }

  .progress-bar {
    height: 2px;
    background: rgba(28, 22, 17, 0.08);
    margin-bottom: 28px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  /* ===== Setup screen ===== */
  .setup-intro {
    text-align: center;
    margin-bottom: 28px;
    padding: 8px 0 4px;
  }

  .setup-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .setup-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 38px;
    margin: 0 0 10px;
    line-height: 1;
  }

  .setup-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 400px;
    line-height: 1.55;
  }

  .verb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 8px;
    margin-bottom: 22px;
  }

  .verb-chip {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 13px 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s, background 0.15s;
    text-align: left;
    position: relative;
    font-family: inherit;
    color: inherit;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 6px -3px var(--shadow);
  }

  .verb-chip:hover { border-color: var(--ink); }

  .verb-chip.unselected {
    background: transparent;
    border-style: dashed;
    border-color: rgba(28, 22, 17, 0.22);
    opacity: 0.5;
    box-shadow: none;
  }

  .verb-chip.unselected:hover { opacity: 0.8; border-color: var(--ink-soft); }

  .verb-chip-italian {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    margin-bottom: 5px;
    padding-right: 14px;
  }

  .verb-chip-english {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  .verb-chip-english .meaning { white-space: nowrap; }

  .verb-chip-mark {
    position: absolute;
    top: 11px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    font-size: 13px;
    line-height: 1;
    transition: opacity 0.15s;
  }

  .verb-chip.unselected .verb-chip-mark { opacity: 0; }

  .setup-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 12px;
    color: var(--ink-faded);
    flex-wrap: wrap;
    gap: 12px;
  }

  .ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: rgba(28, 22, 17, 0.25);
    padding: 0;
    transition: color 0.15s;
  }

  .ghost:hover { color: var(--ink); text-decoration-color: var(--ink); }

  .divider {
    color: var(--ink-faded);
    margin: 0 6px;
    user-select: none;
  }

  .deck-readout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .deck-readout strong {
    color: var(--ink);
    font-weight: 500;
  }

  button.submit.start-btn {
    width: 100%;
    padding: 18px;
    font-size: 13px;
    letter-spacing: 0.18em;
  }

  .start-btn:disabled {
    background: rgba(28, 22, 17, 0.18);
    color: var(--cream-deep);
    cursor: not-allowed;
  }

  .mode-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faded);
    text-align: center;
    margin-bottom: 8px;
  }

  .mode-toggle {
    display: flex;
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.15);
    border-radius: 3px;
    padding: 4px;
    margin: 0 auto 22px;
    max-width: 360px;
    gap: 4px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset;
  }

  .mode-option {
    flex: 1;
    background: transparent;
    border: none;
    padding: 9px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faded);
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, color 0.15s;
  }

  .mode-option:hover { color: var(--ink-soft); }

  .mode-option.active {
    background: var(--ink);
    color: var(--cream);
  }

  .mode-option.active:hover { color: var(--cream); }

  /* ===== Card / game ===== */
  .card {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.12);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 24px 48px -24px var(--shadow),
      0 6px 14px -6px var(--shadow);
    border-radius: 3px;
    padding: 60px 40px 52px;
    margin-bottom: 22px;
    position: relative;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(28, 22, 17, 0.06);
    border-radius: 2px;
    pointer-events: none;
  }

  .card-corner {
    position: absolute;
    top: 18px;
    left: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.12em;
    z-index: 2;
  }

  .card-corner.right { left: auto; right: 22px; }

  .verb-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.14em;
    margin-bottom: 18px;
    text-transform: lowercase;
  }

  .prompt {
    font-family: 'Cormorant Garamond', serif;
    font-size: 60px;
    font-weight: 500;
    text-align: center;
    line-height: 1.05;
    color: var(--ink);
    font-style: italic;
    letter-spacing: -0.01em;
  }

  /* Two-meaning prompts: keep each meaning together, break between them first */
  .prompt .meaning { display: inline-block; }
  .prompt.long { font-size: 46px; line-height: 1.1; }

  .pronoun-hint {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-top: 22px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  input.answer {
    flex: 1;
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 16px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input.answer::placeholder {
    color: var(--ink-faded);
    font-style: italic;
  }

  input.answer:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(28, 22, 17, 0.06);
  }

  input.answer:disabled {
    background: rgba(28, 22, 17, 0.03);
    color: var(--ink-soft);
  }

  button.submit {
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 0 26px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, transform 0.05s;
    white-space: nowrap;
  }

  button.submit:hover:not(:disabled) { background: #2a2218; }
  button.submit:active:not(:disabled) { transform: translateY(1px); }

  .feedback {
    min-height: 50px;
    display: flex;
    align-items: center;
    padding: 13px 18px;
    border-radius: 3px;
    font-size: 13px;
    transition: opacity 0.2s;
    line-height: 1.4;
  }

  .feedback.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .feedback.correct {
    background: rgba(90, 107, 58, 0.10);
    color: var(--olive);
    border-left: 3px solid var(--olive);
  }

  .feedback.incorrect {
    background: rgba(162, 62, 44, 0.08);
    color: var(--terracotta);
    border-left: 3px solid var(--terracotta);
  }

  .feedback strong {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-style: italic;
    font-weight: 600;
    margin: 0 4px;
  }

  .feedback .pron {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-faded);
    margin-left: 4px;
    letter-spacing: 0.02em;
    font-weight: 400;
    opacity: 0.85;
  }

  #controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--ink-faded);
    letter-spacing: 0.04em;
    flex-wrap: wrap;
    gap: 10px;
  }

  .controls-left { display: flex; gap: 14px; align-items: center; }

  kbd {
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 6px;
    background: rgba(28, 22, 17, 0.06);
    border: 1px solid rgba(28, 22, 17, 0.1);
    border-radius: 3px;
    font-size: 10px;
  }

  .complete {
    text-align: center;
    padding: 40px 24px;
  }

  .complete .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .complete h2 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 64px;
    margin: 0 0 6px;
    line-height: 1;
  }

  .complete .pct {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 6px;
  }

  .complete .msg {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 auto 28px;
    max-width: 360px;
    line-height: 1.5;
  }

  .complete-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .complete-actions .ghost {
    color: var(--ink-soft);
    font-size: 13px;
  }

  .streak-flag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--terracotta);
    letter-spacing: 0.12em;
  }

  /* ===== Setup: verb selection + endings reference side by side ===== */
  .container[data-view="setup"] { max-width: 1080px; }

  .setup-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 372px;
    gap: 32px;
    align-items: start;
  }

  .endings {
    position: sticky;
    top: 20px;
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.15);
    border-radius: 3px;
    padding: 22px 20px 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 6px -3px var(--shadow);
  }

  .endings-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 26px;
    line-height: 1;
    margin: 0 0 6px;
  }

  .endings-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 18px;
  }

  .eg {
    display: grid;
    grid-template-columns: 50px repeat(4, minmax(0, 1fr));
    gap: 4px;
    margin-bottom: 18px;
  }

  .eg-s2 { grid-column: span 2; }
  .eg-s3 { grid-column: span 3; }
  .eg-s4 { grid-column: span 4; }

  .eg-class {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 20px;
    line-height: 1;
    text-align: center;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--ink-soft);
  }

  .eg-model {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--ink-faded);
    text-align: center;
    padding: 2px 0 4px;
  }

  .eg-person {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
  }

  .eg-cell {
    background: var(--cream);
    border: 1px solid rgba(28, 22, 17, 0.08);
    border-radius: 2px;
    text-align: center;
    padding: 5px 2px 4px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.1;
  }

  .eg-dash { color: var(--ink-faded); font-weight: 400; }
  .eg-isc { color: var(--gold); }

  .endings-note {
    border-top: 1px solid rgba(28, 22, 17, 0.12);
    padding: 12px 0;
  }

  .en-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .endings-note p {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }

  .en-eg {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
  }

  @media (max-width: 1100px) {
    .container[data-view="setup"] { max-width: 660px; }
    .setup-body { grid-template-columns: 1fr; gap: 28px; }
    .endings { position: static; margin-bottom: 8px; }
  }

  @media (max-width: 520px) {
    .prompt { font-size: 42px; }
    .prompt.long { font-size: 32px; }
    .card { padding: 50px 24px 40px; min-height: 240px; }
    header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .stats { width: 100%; justify-content: flex-start; gap: 32px; }
    .stat { text-align: left; }
    .input-row { flex-direction: column; }
    button.submit { padding: 14px; }
    .setup-title { font-size: 30px; }
    .verb-grid { grid-template-columns: repeat(2, 1fr); }
    .verb-chip-italian { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="container" id="container" data-view="setup">
    <header>
      <div>
        <h1 class="title">Verbi Regolari</h1>
        <div class="subtitle">Flip Card · Presente Indicativo</div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Card</div>
          <div class="stat-value"><span id="current">1</span><span class="sub">/<span id="total">300</span></span></div>
        </div>
      </div>
    </header>

    <div class="progress-bar">
      <div class="progress-fill" id="progress" style="width: 0%"></div>
    </div>

    <div id="game-area"></div>

    <div id="controls"></div>
  </div>

<script>
  // Top 50 most common Italian REGULAR verbs by frequency, present tense (presente indicativo).
  // -ARE (1st conjugation, ~70% of all Italian verbs), then regular -ERE (a small group, since
  // most -ere verbs are irregular), then -IRE split between non-isc (sentire-type) and -isc-
  // (capire-type) sub-patterns.
  const verbData = [
    // ===== -ARE verbs =====
    { it: "parlare", en: "to speak",
      conj: { io: "parlo", tu: "parli", lui: "parla", noi: "parliamo", voi: "parlate", loro: "parlano" },
      prompts: { io: "I speak", tu: "you speak", lui: "he/she speaks", noi: "we speak", voi: "you (pl) speak", loro: "they speak" } },
    { it: "trovare", en: "to find",
      conj: { io: "trovo", tu: "trovi", lui: "trova", noi: "troviamo", voi: "trovate", loro: "trovano" },
      prompts: { io: "I find", tu: "you find", lui: "he/she finds", noi: "we find", voi: "you (pl) find", loro: "they find" } },
    { it: "lavorare", en: "to work",
      conj: { io: "lavoro", tu: "lavori", lui: "lavora", noi: "lavoriamo", voi: "lavorate", loro: "lavorano" },
      prompts: { io: "I work", tu: "you work", lui: "he/she works", noi: "we work", voi: "you (pl) work", loro: "they work" } },
    { it: "pensare", en: "to think",
      conj: { io: "penso", tu: "pensi", lui: "pensa", noi: "pensiamo", voi: "pensate", loro: "pensano" },
      prompts: { io: "I think", tu: "you think", lui: "he/she thinks", noi: "we think", voi: "you (pl) think", loro: "they think" } },
    { it: "portare", en: "to bring / to wear",
      conj: { io: "porto", tu: "porti", lui: "porta", noi: "portiamo", voi: "portate", loro: "portano" },
      prompts: { io: "I bring / wear", tu: "you bring / wear", lui: "he/she brings / wears", noi: "we bring / wear", voi: "you (pl) bring / wear", loro: "they bring / wear" } },
    { it: "guardare", en: "to watch",
      conj: { io: "guardo", tu: "guardi", lui: "guarda", noi: "guardiamo", voi: "guardate", loro: "guardano" },
      prompts: { io: "I watch", tu: "you watch", lui: "he/she watches", noi: "we watch", voi: "you (pl) watch", loro: "they watch" } },

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];

  function normalize(s) {
    return s.toLowerCase().trim()
      .replace(/[àáâã]/g, 'a')
      .replace(/[èéêë]/g, 'e')
      .replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o')
      .replace(/[ùúûü]/g, 'u')
      .replace(/[`'´’]/g, '')

  // ===== English answer variants (for reverse-direction mode) =====
  // Iteratively generates all reasonable phrasings a user might type for a given
  // English prompt. Handles he/she, you (pl), optional (reside)/(music) clarifications,
  // and optional "to" for infinitives.
  // Splits "I leave (behind) / let" into ["I leave (behind)", "I let"], carrying the
  // subject (or infinitive "to") over to alternatives that don't repeat it.
  // " / " with spaces separates meanings; "he/she" (no spaces) is left intact.
  const SUBJECT_RE = /^(you \(pl\)|he\/she|you|they|we|to|i)\s+/;
  function splitAlternatives(expected) {
    const parts = expected.split(' / ');
    if (parts.length === 1) return parts;
    const m = normalize(parts[0]).match(SUBJECT_RE);
    const subject = m ? m[1] : '';
    return parts.map((p, i) =>
      (i === 0 || !subject || SUBJECT_RE.test(normalize(p))) ? p : `${subject} ${p}`);
  }

  function acceptableEnglishAnswers(expected) {
    // Seed with the full answer, a no-space-slash version, and each meaning on its own.
    let variants = new Set([
      normalize(expected),
      normalize(expected.replace(/ \/ /g, '/')),
      ...splitAlternatives(expected).map(normalize)
    ]);
    let grew = true;
    while (grew) {
      grew = false;
      const snapshot = [...variants];
      for (const v of snapshot) {
        // he/she → he, she, she/he, he or she
        if (v.includes('he/she')) {
          for (const sub of ['he', 'she', 'she/he', 'he or she']) {
            const nv = v.replace('he/she', sub);
            if (!variants.has(nv)) { variants.add(nv); grew = true; }
          }
        }
        // you (pl) → you, you all, y'all, yall
        if (v.includes('you (pl)')) {
          for (const sub of ['you', 'you all', 'yall']) {
            const nv = normalize(v.replace('you (pl)', sub));
            if (!variants.has(nv)) { variants.add(nv); grew = true; }
          }
        }
        // Strip parenthetical clarifications like "(reside)", "(music)"
        const stripped = v.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
        if (stripped && stripped !== v && !variants.has(stripped)) {
          variants.add(stripped); grew = true;
        }
        // …or type the bracketed words without brackets: "try (to)" → "try to"
        const unwrapped = v.replace(/\((?!pl\))([^)]*)\)/g, '$1').replace(/\s+/g, ' ').trim();
        if (unwrapped !== v && !variants.has(unwrapped)) {
          variants.add(unwrapped); grew = true;
        }
        // "to X" ↔ "X"
        if (v.startsWith('to ')) {
          const noTo = v.slice(3);
          if (!variants.has(noTo)) { variants.add(noTo); grew = true; }
        }
      }
    }
    return variants;
  }

  // Which pronouns are valid for each person key.
  // lui covers lui/lei/egli/ella; loro covers loro/essi/esse.
  const validPronounsFor = {
    io: ["io"],
    tu: ["tu"],
    lui: ["lui", "lei", "egli", "ella"],
    noi: ["noi"],
    voi: ["voi"],
    loro: ["loro", "essi", "esse"]
  };

  const ALL_PRONOUNS = ["io", "tu", "lui", "lei", "egli", "ella", "noi", "voi", "loro", "essi", "esse"];
  const pronounRegex = new RegExp(`^(${ALL_PRONOUNS.join("|")})\\s+(.+)$`);

  // Returns { correct: bool, reason?: 'wrong-pronoun' }
  // Pronoun is optional — but if typed, it must match the card's person.
  function checkAnswer(rawGuess, card) {
    // Italian → English (reverse) uses variant-based matching for lenient English input.
    if (card.direction === 'it-to-en') {
      const guess = normalize(rawGuess);
      if (!guess) return { correct: false };
      return { correct: acceptableEnglishAnswers(card.answer).has(guess) };
    }
    const guess = normalize(rawGuess);
    const correct = normalize(card.answer);
    // Infinitive mode — no pronoun handling
    if (!card.person) {
      return { correct: guess !== '' && guess === correct };
    }
    const m = guess.match(pronounRegex);
    if (m) {
      const typedPronoun = m[1];
      const verbPart = m[2];
      if (!validPronounsFor[card.person].includes(typedPronoun)) {
        return { correct: false, reason: 'wrong-pronoun' };
      }
      return { correct: verbPart === correct };
    }
    return { correct: guess !== '' && guess === correct };
  }

  // ===== Italian syllabifier and stress marker =====
  // Computes dictionary-style pronunciation like "ri·pè·te·re" for any regular form.

  const ITALIAN_VOWELS = 'aeiou';
  const STRONG_VOWELS = 'aeo';
  const WEAK_VOWELS = 'iu';
  const STRESS_MAP = { a: 'à', e: 'è', i: 'ì', o: 'ò', u: 'ù' };

  function isVowel(c) { return ITALIAN_VOWELS.includes(c); }
  function isStrong(c) { return STRONG_VOWELS.includes(c); }
  function isWeak(c) { return WEAK_VOWELS.includes(c); }

  // Can this consonant cluster start a syllable in Italian?
  function isValidOnset(cluster) {
    const n = cluster.length;
    if (n <= 1) return true;
    if (n === 2) {
      const c1 = cluster[0], c2 = cluster[1];
      if (c1 === c2) return false;                                   // no geminates as onset
      if (c1 === 's' && 'pctdfmnbgvhz'.includes(c2)) return true;    // impure s
      if ('pbtdcgfv'.includes(c1) && 'lr'.includes(c2)) return true; // obstruent + liquid
      if (cluster === 'gn' || cluster === 'gl' || cluster === 'ch' || cluster === 'gh') return true;
      return false;
    }
    if (n === 3) {
      // str, spr, spl, scr, sdr, sfr, sgl, sbr…
      if (cluster[0] === 's' && 'pctdfbg'.includes(cluster[1]) && 'lr'.includes(cluster[2])) return true;
      return false;
    }
    return false;
  }

  // Split a run of 3+ vowels into syllabic chunks (rightward-greedy diphthong).
  function splitVowelGroup(vg) {
    if (vg.length <= 2) return [vg];
    const chunks = [];
    let rem = vg;
    while (rem.length > 2) {
      const v2 = rem[rem.length - 2], v3 = rem[rem.length - 1];
      if (isWeak(v2) || isWeak(v3)) {
        chunks.unshift(rem.slice(-2));   // last two form a diphthong
        rem = rem.slice(0, -2);
      } else {
        chunks.unshift(rem.slice(-1));   // strong+strong = hiatus, split off last
        rem = rem.slice(0, -1);
      }
    }
    if (rem) chunks.unshift(rem);
    return chunks;
  }

  function syllabify(word) {
    const w = word.toLowerCase();
    if (!w) return [];

    // Segment into V-runs and C-runs.
    const segs = [];
    let i = 0;
    while (i < w.length) {
      const isV = isVowel(w[i]);
      const start = i;
      while (i < w.length && isVowel(w[i]) === isV) i++;
      segs.push({ type: isV ? 'V' : 'C', str: w.slice(start, i) });
    }

    // Expand long vowel runs into diphthong-sized chunks.
    const expanded = [];
    for (const s of segs) {
      if (s.type === 'V') {
        for (const chunk of splitVowelGroup(s.str)) expanded.push({ type: 'V', str: chunk });
      } else {
        expanded.push(s);
      }
    }

    // Build syllables using the maximal-onset principle.
    const sylls = [];
    let cur = '';
    let k = 0;
    if (expanded.length && expanded[0].type === 'C') {
      cur = expanded[0].str;
      k = 1;
    }
    while (k < expanded.length) {
      const s = expanded[k];
      if (s.type === 'V') {
        // If cur already ends in a vowel, we're at a hiatus boundary — push and start fresh.
        if (cur && isVowel(cur[cur.length - 1])) {
          sylls.push(cur);
          cur = '';
        }
        cur += s.str;
      } else {
        const cons = s.str;
        const hasMore = k + 1 < expanded.length;
        if (!hasMore) {
          cur += cons;
        } else {
          // Find the maximal suffix of cons that's a valid onset.
          let onset = 0;
          for (let j = 1; j <= cons.length; j++) {
            if (isValidOnset(cons.slice(-j))) onset = j;
            else break;
          }
          if (onset === 0) {
            cur += cons;
            sylls.push(cur);
            cur = '';
          } else {
            cur += cons.slice(0, cons.length - onset);
            sylls.push(cur);
            cur = cons.slice(-onset);
          }
        }
      }
      k++;
    }
    if (cur) sylls.push(cur);
    return sylls;
  }

  // Add a grave accent to the stressed vowel of a syllable.
  // For diphthongs: mark the first strong vowel; else the last vowel.
  function markStressInSyllable(syl) {
    const vidx = [];
    for (let i = 0; i < syl.length; i++) if (isVowel(syl[i])) vidx.push(i);
    if (!vidx.length) return syl;
    let idx;
    if (vidx.length === 1) {
      idx = vidx[0];
    } else {
      const strong = vidx.filter(i => isStrong(syl[i]));
      idx = strong.length ? strong[0] : vidx[vidx.length - 1];
    }
    const marked = STRESS_MAP[syl[idx]] || syl[idx];
    return syl.slice(0, idx) + marked + syl.slice(idx + 1);
  }

  // Pronounce a form. Person is null for infinitives.
  // opts.isInfinitive + opts.isSdrucciola choose stress for the infinitive.
  function pronounceForm(form, person, opts) {
    opts = opts || {};
    const sylls = syllabify(form);
    const n = sylls.length;
    if (n === 0) return form;

    let stressIdx;
    if (opts.isInfinitive) {
      stressIdx = (opts.isSdrucciola && n >= 3) ? n - 3 : Math.max(0, n - 2);
    } else if (person === 'loro' && n >= 3) {
      stressIdx = n - 3; // antepenultimate (sdrucciola pattern for 3rd plural)
    } else {
      stressIdx = Math.max(0, n - 2); // penultimate
    }

    sylls[stressIdx] = markStressInSyllable(sylls[stressIdx]);
    return sylls.join('·');
  }

  // ===== Per-verb performance tracking (localStorage) =====
  // Ranks verbs by weakness for the "Weakest 10" quick-pick.

  const STATS_KEY = 'verbi-regolari-stats';

  function loadStats() {
    try {
      const raw = localStorage.getItem(STATS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveStats(stats) {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) { /* quota / private mode: ignore */ }
  }

  function updateStats(verbIt, isCorrect) {
    const stats = loadStats();
    if (!stats[verbIt]) stats[verbIt] = { attempts: 0, wrongs: 0 };
    stats[verbIt].attempts++;
    if (!isCorrect) stats[verbIt].wrongs++;
    saveStats(stats);
  }

  // Weakness score: wrongs / (attempts + 2). The +2 smoothing damps small samples so
  // a 1/1 miss doesn't outrank a well-attested 15/20 struggle.
  function pickWeakest(n) {
    const stats = loadStats();
    const scored = verbData.map(v => {
      const s = stats[v.it] || { attempts: 0, wrongs: 0 };
      return { verb: v.it, score: s.wrongs / (s.attempts + 2), wrongs: s.wrongs };
    });
    scored.sort((a, b) => (b.score - a.score) || (b.wrongs - a.wrongs) || (Math.random() - 0.5));

    // Take verbs with any wrongs first; pad with random from the rest if needed.
    let chosen = scored.filter(s => s.wrongs > 0).slice(0, n).map(s => s.verb);
    if (chosen.length < n) {
      const chosenSet = new Set(chosen);
      const rest = shuffle(verbData.map(v => v.it).filter(it => !chosenSet.has(it)));
      chosen = chosen.concat(rest.slice(0, n - chosen.length));
    }
    return new Set(chosen);
  }

  function buildDeck() {
    const deck = [];
    const reverse = direction === 'it-to-en';
    for (const v of verbData) {
      if (!selectedVerbs.has(v.it)) continue;
      if (mode === 'infinitives') {
        const isEre = v.it.endsWith('ere');
        const pron = (v.pronMap && v.pronMap.it) || pronounceForm(v.it, null, { isInfinitive: true, isSdrucciola: isEre && !v.piana });
        deck.push({
          italian: v.it,
          english: v.en,
          person: null,
          pronounLabel: '',
          prompt: reverse ? v.it : v.en,
          answer: reverse ? v.en : v.it,
          pron: pron,
          direction: direction
        });
      } else {
        for (const p of personOrder) {
          const pron = (v.pronMap && v.pronMap[p]) || pronounceForm(v.conj[p], p);
          deck.push({
            italian: v.it,
            english: v.en,
            person: p,
            pronounLabel: personLabel[p],
            prompt: reverse ? v.conj[p] : v.prompts[p],
            answer: reverse ? v.prompts[p] : v.conj[p],
            pron: pron,
            direction: direction
          });
        }
      }
    }
    return deck;
  }
  // ===== State =====
  let selectedVerbs = new Set(); // start empty — user picks or uses a quick action
  let mode = 'conjugations'; // 'conjugations' | 'infinitives'
  let direction = 'en-to-it'; // 'en-to-it' | 'it-to-en'
  let deck = [];
  let index = 0;
  let score = 0;
  let streak = 0;
  let bestStreak = 0;
  let answered = false;

  // ===== DOM refs =====
  const container = document.getElementById('container');
  const gameArea = document.getElementById('game-area');
  const controlsEl = document.getElementById('controls');
  const scoreEl = document.getElementById('score');
  const currentEl = document.getElementById('current');
  const totalEl = document.getElementById('total');
  const progressEl = document.getElementById('progress');

  // ===== Setup view =====
  function showSetup() {
    container.dataset.view = 'setup';
    gameArea.innerHTML = `
      <div class="setup-intro">
        <div class="setup-eyebrow">Step 01 · Build your deck</div>
        <h2 class="setup-title">Choose your verbs</h2>
        <p class="setup-sub">Tap verbs to include them, or grab a random set with the quick picks below. Then pick a practice mode — full conjugations or just the infinitive form.</p>
      </div>

      <div class="mode-label">Practice mode</div>
      <div class="mode-toggle" id="mode-toggle">
        <button type="button" class="mode-option${mode === 'conjugations' ? ' active' : ''}" data-mode="conjugations">Conjugations</button>
        <button type="button" class="mode-option${mode === 'infinitives' ? ' active' : ''}" data-mode="infinitives">Infinitives only</button>
      </div>

      <div class="mode-label">Direction</div>
      <div class="mode-toggle" id="direction-toggle">
        <button type="button" class="mode-option${direction === 'en-to-it' ? ' active' : ''}" data-direction="en-to-it">English → Italian</button>
        <button type="button" class="mode-option${direction === 'it-to-en' ? ' active' : ''}" data-direction="it-to-en">Italian → English</button>
      </div>

      <div class="setup-body">
      <div class="setup-main">
      <div class="verb-grid" id="verb-grid">
        ${verbData.map(v => `
          <button type="button" class="verb-chip${selectedVerbs.has(v.it) ? '' : ' unselected'}" data-verb="${v.it}">
            <div class="verb-chip-mark">●</div>
            <div class="verb-chip-italian">${v.it}</div>
            <div class="verb-chip-english">${v.en.split(' / ').map(m => `<span class="meaning">${m}</span>`).join('&nbsp;/ ')}</div>
          </button>
        `).join('')}
      </div>

      <div class="setup-controls">
        <div>
          <button type="button" class="ghost" id="random-20">Random 20</button>
          <span class="divider">·</span>
          <button type="button" class="ghost" id="random-50">Random 50</button>
          <span class="divider">·</span>
          <button type="button" class="ghost" id="weakest-10">Weakest 10</button>
          <span class="divider">·</span>
          <button type="button" class="ghost" id="select-all">Select all</button>
          <span class="divider">·</span>
          <button type="button" class="ghost" id="clear-all">Clear all</button>
        </div>
        <div class="deck-readout">
          <strong id="selected-count">${selectedVerbs.size}</strong> verbs &nbsp;·&nbsp; <strong id="card-count">${selectedVerbs.size * 6}</strong> cards
        </div>
      </div>

      <button type="button" class="submit start-btn" id="start-btn">▶ Start practising</button>
      </div>

      <aside class="endings" aria-label="Regular verb endings, present tense">
        <h3 class="endings-title">Le desinenze</h3>
        <div class="endings-sub">Regular endings · presente</div>

        <div class="eg">
          <div></div>
          <div class="eg-class">-are</div>
          <div class="eg-class">-ere</div>
          <div class="eg-class eg-s2">-ire</div>

          <div></div>
          <div class="eg-model">parlare</div>
          <div class="eg-model">vendere</div>
          <div class="eg-model">dormire</div>
          <div class="eg-model">capire</div>

          <div class="eg-person">io</div>
          <div class="eg-cell eg-s3"><span class="eg-dash">-</span>o</div>
          <div class="eg-cell"><span class="eg-dash">-</span><span class="eg-isc">isc</span>o</div>

          <div class="eg-person">tu</div>
          <div class="eg-cell eg-s3"><span class="eg-dash">-</span>i</div>
          <div class="eg-cell"><span class="eg-dash">-</span><span class="eg-isc">isc</span>i</div>

          <div class="eg-person">lui/lei</div>
          <div class="eg-cell"><span class="eg-dash">-</span>a</div>
          <div class="eg-cell eg-s2"><span class="eg-dash">-</span>e</div>
          <div class="eg-cell"><span class="eg-dash">-</span><span class="eg-isc">isc</span>e</div>

          <div class="eg-person">noi</div>
          <div class="eg-cell eg-s4"><span class="eg-dash">-</span>iamo</div>

          <div class="eg-person">voi</div>
          <div class="eg-cell"><span class="eg-dash">-</span>ate</div>
          <div class="eg-cell"><span class="eg-dash">-</span>ete</div>
          <div class="eg-cell eg-s2"><span class="eg-dash">-</span>ite</div>

          <div class="eg-person">loro</div>
          <div class="eg-cell"><span class="eg-dash">-</span>ano</div>
          <div class="eg-cell eg-s2"><span class="eg-dash">-</span>ono</div>
          <div class="eg-cell"><span class="eg-dash">-</span><span class="eg-isc">isc</span>ono</div>
        </div>

        <div class="endings-note">
          <div class="en-label">Stress</div>
          <p>Falls on the stem for io, tu, lui and loro — the same four forms that take <span class="eg-isc">-isc-</span>. Noi and voi stress the ending.</p>
          <div class="en-eg">pàr·lo · pàr·la·no · par·lià·mo</div>
        </div>

        <div class="endings-note">
          <div class="en-label">-care · -gare</div>
          <p>Add an <i>h</i> before <i>i</i> to keep the hard sound.</p>
          <div class="en-eg">giochi, giochiamo · paghi, paghiamo</div>
        </div>

        <div class="endings-note">
          <div class="en-label">-iare</div>
          <p>The stem's <i>i</i> merges with the ending's <i>i</i>.</p>
          <div class="en-eg">mangi, mangiamo · studi, studiamo</div>
        </div>
      </aside>
      </div>
    `;

    gameArea.querySelectorAll('.verb-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const v = chip.dataset.verb;
        if (selectedVerbs.has(v)) {
          selectedVerbs.delete(v);
          chip.classList.add('unselected');
        } else {
          selectedVerbs.add(v);
          chip.classList.remove('unselected');
        }
        updateReadout();
      });
    });

    gameArea.querySelectorAll('#mode-toggle .mode-option').forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        gameArea.querySelectorAll('#mode-toggle .mode-option').forEach(b => {
          b.classList.toggle('active', b.dataset.mode === mode);
        });
        updateReadout();
      });
    });

    gameArea.querySelectorAll('#direction-toggle .mode-option').forEach(btn => {
      btn.addEventListener('click', () => {
        direction = btn.dataset.direction;
        gameArea.querySelectorAll('#direction-toggle .mode-option').forEach(b => {
          b.classList.toggle('active', b.dataset.direction === direction);
        });
      });
    });

    document.getElementById('select-all').addEventListener('click', () => {
      verbData.forEach(v => selectedVerbs.add(v.it));
      gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.remove('unselected'));
      updateReadout();
    });

    document.getElementById('clear-all').addEventListener('click', () => {
      selectedVerbs.clear();
      gameArea.querySelectorAll('.verb-chip').forEach(c => c.classList.add('unselected'));
      updateReadout();
    });

    // Pick N random verbs from the full pool, replacing the current selection.
    function pickRandom(n) {
      const pool = verbData.map(v => v.it);
      const shuffled = shuffle(pool);
      const chosen = new Set(shuffled.slice(0, Math.min(n, pool.length)));
      selectedVerbs = chosen;
      gameArea.querySelectorAll('.verb-chip').forEach(c => {
        c.classList.toggle('unselected', !chosen.has(c.dataset.verb));
      });
      updateReadout();
    }

    document.getElementById('random-20').addEventListener('click', () => pickRandom(20));
    document.getElementById('random-50').addEventListener('click', () => pickRandom(50));

    document.getElementById('weakest-10').addEventListener('click', () => {
      const chosen = pickWeakest(10);
      selectedVerbs = chosen;
      gameArea.querySelectorAll('.verb-chip').forEach(c => {
        c.classList.toggle('unselected', !chosen.has(c.dataset.verb));
      });
      updateReadout();
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    updateReadout();
  }

  function updateReadout() {
    const n = selectedVerbs.size;
    const cardsPerVerb = mode === 'infinitives' ? 1 : 6;
    const totalCards = n * cardsPerVerb;
    document.getElementById('selected-count').textContent = n;
    document.getElementById('card-count').textContent = totalCards;
    const start = document.getElementById('start-btn');
    start.disabled = n === 0;
    start.textContent = n === 0 ? 'Select at least one verb' : `▶ Start practising · ${totalCards} cards`;
  }

  // ===== Game view =====
  const cardHTML = `
    <div class="card">
      <div class="card-corner streak-flag" id="streak-display"></div>
      <div class="card-corner right">№ <span id="cardnum">001</span></div>
      <div class="verb-meta" id="verb-meta"></div>
      <div class="prompt" id="prompt"></div>
      <div class="pronoun-hint" id="pronoun-hint"></div>
    </div>
    <div class="input-row">
      <input type="text" class="answer" id="answer" placeholder="type the italian conjugation…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="submit" id="submit">Controlla</button>
    </div>
    <div class="feedback hidden" id="feedback"></div>
  `;

  function showGameControls() {
    controlsEl.innerHTML = `
      <div class="controls-left">
        <button type="button" class="ghost" id="reshuffle-btn">↻ Reshuffle</button>
        <button type="button" class="ghost" id="change-btn">← Change verbs</button>
      </div>
      <span><kbd>Enter</kbd> submits · then again for next</span>
    `;
    document.getElementById('reshuffle-btn').addEventListener('click', () => startGame());
    document.getElementById('change-btn').addEventListener('click', showSetup);
  }

  function startGame() {
    if (selectedVerbs.size === 0) return;
    deck = shuffle(buildDeck());
    index = 0;
    score = 0;
    streak = 0;
    bestStreak = 0;
    scoreEl.textContent = '0';
    totalEl.textContent = deck.length;
    container.dataset.view = 'game';
    gameArea.innerHTML = cardHTML;
    showGameControls();

    document.getElementById('submit').addEventListener('click', handleSubmit);

    render();
  }

  function render() {
    if (index >= deck.length) {
      showComplete();
      return;
    }
    const card = deck[index];
    const verbMetaEl = document.getElementById('verb-meta');
    const pronounHintEl = document.getElementById('pronoun-hint');
    const promptEl = document.getElementById('prompt');
    promptEl.innerHTML = card.prompt.split(' / ')
      .map(m => `<span class="meaning">${m.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`)
      .join('&nbsp;/ ');
    promptEl.classList.toggle('long', card.prompt.length > 20);
    if (card.person && card.direction !== 'it-to-en') {
      verbMetaEl.textContent = card.english;
      verbMetaEl.style.display = '';
      pronounHintEl.textContent = card.pronounLabel;
      pronounHintEl.style.display = '';
    } else {
      verbMetaEl.style.display = 'none';
      pronounHintEl.style.display = 'none';
    }
    document.getElementById('cardnum').textContent = String(index + 1).padStart(3, '0');

    const ans = document.getElementById('answer');
    const sub = document.getElementById('submit');
    const fb = document.getElementById('feedback');
    ans.value = '';
    ans.disabled = false;
    sub.textContent = 'Controlla';
    fb.className = 'feedback hidden';
    fb.innerHTML = '';
    answered = false;

    currentEl.textContent = index + 1;
    progressEl.style.width = `${(index / deck.length) * 100}%`;

    document.getElementById('streak-display').textContent = streak >= 3 ? `🔥 streak ${streak}` : '';

    setTimeout(() => ans.focus(), 30);
  }

  function handleSubmit() {
    if (answered) { index++; render(); return; }

    const ans = document.getElementById('answer');
    const sub = document.getElementById('submit');
    const fb = document.getElementById('feedback');
    const card = deck[index];
    const raw = ans.value;
    const result = checkAnswer(raw, card);

    answered = true;
    ans.disabled = true;
    sub.textContent = 'Avanti →';

    // Track weakness — skips are neutral (could be distraction rather than not-knowing).
    if (raw.trim() !== '') updateStats(card.italian, result.correct);

    if (result.correct) {
      score++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      scoreEl.textContent = score;
      fb.className = 'feedback correct';
      fb.innerHTML = `✓ Corretto — <strong>${card.answer}</strong> <span class="pron">${card.pron}</span>`;
    } else {
      streak = 0;
      fb.className = 'feedback incorrect';
      if (raw.trim() === '') {
        fb.innerHTML = `Skipped — the answer is <strong>${card.answer}</strong> <span class="pron">${card.pron}</span>`;
      } else if (result.reason === 'wrong-pronoun') {
        fb.innerHTML = `✗ Wrong pronoun — should be <strong>${card.pronounLabel} ${card.answer}</strong> <span class="pron">${card.pron}</span>`;
      } else {
        fb.innerHTML = `✗ Not quite — the answer is <strong>${card.answer}</strong> <span class="pron">${card.pron}</span>`;
      }
    }
  }

  function showComplete() {
    progressEl.style.width = '100%';
    const pct = Math.round((score / deck.length) * 100);
    let msg;
    if (pct >= 95) msg = 'Magnifico! Near-perfect mastery of these regulars.';
    else if (pct >= 80) msg = 'Bravissimo! These verbs are clearly sticking.';
    else if (pct >= 65) msg = 'Bene! Solid foundation — another pass will lock it in.';
    else if (pct >= 50) msg = 'Halfway there. The patterns reveal themselves with repetition.';
    else msg = 'Every round counts. Reshuffle and go again — fluency is built one card at a time.';

    container.dataset.view = 'complete';
    gameArea.innerHTML = `
      <div class="card complete">
        <div class="badge">FINE DELLA SESSIONE</div>
        <h2>${score}<span style="color: var(--ink-faded); font-weight: 400;">/${deck.length}</span></h2>
        <div class="pct">${pct}% &nbsp;·&nbsp; best streak ${bestStreak}</div>
        <p class="msg">${msg}</p>
        <div class="complete-actions">
          <button type="button" class="submit" id="play-again">↻ Play again</button>
          <button type="button" class="ghost" id="back-to-setup">← Change verbs</button>
        </div>
      </div>
    `;
    controlsEl.innerHTML = '';
    document.getElementById('play-again').addEventListener('click', startGame);
    document.getElementById('back-to-setup').addEventListener('click', showSetup);
  }

  // Global Enter handler — works whether input is focused, disabled, or focus is elsewhere
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (container.dataset.view !== 'game') return;
    e.preventDefault();
    handleSubmit();
  });

  // Initial mount
  showSetup();
</script>
</body>
</html>
