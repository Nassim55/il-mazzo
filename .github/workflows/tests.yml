# Tests every push. Work from Claude Code on the web arrives on claude/... branches:
# once its tests pass it's merged into main automatically, and main is published to
# GitHub Pages. A push to main (from Claude Code on a laptop) is tested and published.
# Nothing that fails a test reaches main or the live site.
# The sync API (worker/) deploys to Cloudflare from main too, once the repository has
# the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ALLOWED_EMAILS secrets and the
# D1_DATABASE_ID and GOOGLE_CLIENT_ID variables; until then that job notes what's missing.
# (ALLOWED_EMAILS is a secret so the email never appears in this public repo's logs.)
name: tests

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      tested:
        description: 'A commit that already passed its tests on its branch (set by promote after a fast-forward): publish it without testing again'
        required: false
        default: ''

permissions:
  contents: write   # promote: push the merge to main
  actions: write    # promote: start the main run that publishes
  pages: write      # deploy
  id-token: write   # deploy

jobs:
  # The suites run side by side, one per core (tests/run-all.js). A newer push to the same branch
  # cancels tests still running for an older one; publishing that has started always finishes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Already tested
        if: inputs.tested != '' && inputs.tested == github.sha
        run: echo "::notice::${{ github.sha }} passed its tests on its branch and main fast-forwarded to it — publishing without testing it again."
      - uses: actions/checkout@v4
        if: inputs.tested != github.sha
      - uses: actions/setup-node@v4
        if: inputs.tested != github.sha
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.tested != github.sha
      - run: npm test
        if: inputs.tested != github.sha

  promote:
    needs: test
    if: startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    concurrency:
      group: promote-to-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the tested branch into main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-edit -m "Merge ${GITHUB_REF_NAME} (tests passed)" "${GITHUB_SHA}"
          git push origin main
          # main simply moved up to the tested commit: nothing new to test on main
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then echo "tested=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"; fi
      # A push made by this workflow doesn't start a new run on its own, so start one on
      # main explicitly. After a fast-forward, main is exactly the commit that just passed:
      # that run publishes it straight away. After a real merge, it tests the merge first.
      - name: Test and publish main
        run: |
          if [ -n "$TESTED" ]; then gh workflow run tests.yml --ref main -f tested="$TESTED"; else gh workflow run tests.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ steps.merge.outputs.tested }}

  deploy:
    needs: test
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: mkdir _site && cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-sync:
    needs: test
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: sync-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare settings
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ vars.D1_DATABASE_ID }}
          CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$DB_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$EMAILS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sync API not deployed: it needs the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ALLOWED_EMAILS secrets and the D1_DATABASE_ID and GOOGLE_CLIENT_ID variables (Settings → Secrets and variables → Actions)."
          fi
      - name: Point the Worker at the database and the Google client
        if: steps.cf.outputs.ready == 'true'
        env:
          DB_ID: ${{ vars.D1_DATABASE_ID }}
          CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          sed -i "s/D1_DATABASE_ID_PLACEHOLDER/${DB_ID}/" worker/wrangler.toml
          sed -i "s/GOOGLE_CLIENT_ID_PLACEHOLDER/${CLIENT_ID}/" worker/wrangler.toml
      # Database changes first, so the new code never runs against an old schema
      - name: Apply database migrations
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.151.1'
          command: d1 migrations apply il-mazzo --remote
      - name: Deploy the sync API
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.151.1'
          command: deploy
          secrets: |
            ALLOWED_EMAILS
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
