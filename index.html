<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Mazzo — Italian Flip Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3ead8;
    --cream-deep: #e8dcc4;
    --paper: #fbf6ea;
    --ink: #1c1611;
    --ink-soft: #5a4d3f;
    --ink-faded: #8a7a68;
    --terracotta: #a23e2c;
    --olive: #5a6b3a;
    --gold: #b08540;
    --shadow: rgba(28, 22, 17, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse 600px 400px at 15% 10%, rgba(176, 133, 64, 0.10), transparent 60%),
      radial-gradient(ellipse 800px 500px at 85% 90%, rgba(162, 62, 44, 0.06), transparent 60%);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 20px 48px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  .container {
    max-width: 660px;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 14px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 0.95;
    margin: 0;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .stats {
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }

  .stat { text-align: right; }

  .stat-label {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
  }

  .stat-value .sub {
    color: var(--ink-faded);
    font-size: 18px;
    font-weight: 400;
  }

  .progress-bar {
    height: 2px;
    background: rgba(28, 22, 17, 0.08);
    margin-bottom: 28px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  /* ===== Setup view ===== */
  .setup-intro {
    text-align: center;
    margin-bottom: 28px;
  }

  .setup-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .setup-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 38px;
    margin: 0 0 10px;
    line-height: 1;
  }

  .setup-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 400px;
    line-height: 1.55;
  }

  /* Heading for the noun grid, which now sits below the Start button */
  .noun-grid-head {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px dashed rgba(28, 22, 17, 0.15);
  }

  .verb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 8px;
    margin-bottom: 22px;
  }

  /* ===== Theme picker ===== */
  .theme-row {
    margin-bottom: 22px;
    padding: 14px 0 16px;
    border-top: 1px dashed rgba(28, 22, 17, 0.15);
    border-bottom: 1px dashed rgba(28, 22, 17, 0.15);
  }

  .theme-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-faded);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .theme-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .theme-chip {
    background: transparent;
    border: 1px dashed rgba(28, 22, 17, 0.22);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 5px 12px 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    user-select: none;
    -webkit-user-select: none;
    font-weight: 500;
  }

  .theme-chip:hover {
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  .theme-chip.partial {
    border-style: solid;
    border-color: var(--gold);
    color: var(--ink);
    background: rgba(176, 133, 64, 0.08);
  }

  .theme-chip.full {
    border-style: solid;
    border-color: var(--gold);
    background: var(--gold);
    color: var(--cream);
  }

  .theme-chip-count {
    opacity: 0.5;
    margin-left: 5px;
    font-weight: 400;
  }

  .theme-chip.full .theme-chip-count { opacity: 0.7; }
  .theme-chip:focus:not(:focus-visible) { outline: none; }

  .verb-chip {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 13px 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s, background 0.15s;
    text-align: left;
    position: relative;
    font-family: inherit;
    color: inherit;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 6px -3px var(--shadow);
    user-select: none;
    -webkit-user-select: none;
  }

  .verb-chip:focus:not(:focus-visible) { outline: none; }

  .verb-chip:hover { border-color: var(--ink); }

  .verb-chip.unselected {
    background: transparent;
    border-style: dashed;
    border-color: rgba(28, 22, 17, 0.22);
    opacity: 0.5;
    box-shadow: none;
  }

  .verb-chip.unselected:hover { opacity: 0.8; border-color: var(--ink-soft); }

  .verb-chip-italian {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    margin-bottom: 5px;
    padding-right: 14px;
  }

  .verb-chip-english {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  .verb-chip-mark {
    position: absolute;
    top: 11px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    font-size: 13px;
    line-height: 1;
    transition: opacity 0.15s;
  }

  .verb-chip.unselected .verb-chip-mark { opacity: 0; }

  /* Shaded by your record: the colour comes in --shade; a tile left out keeps its shade
     (the dashed border and the fading say it's out) */
  .verb-chip.shaded,
  .verb-chip.unselected.shaded { background: var(--shade); }
  .verb-chip.shaded .verb-chip-english { color: var(--ink-soft); }   /* still readable on the deepest shades */
  .shade-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-faded); }
  .shade-key-bar { width: 120px; height: 10px; border-radius: 5px; border: 1px solid rgba(28, 22, 17, 0.12); }
  .shade-key-note { flex-basis: 100%; font-size: 10px; }

  .setup-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 12px;
    color: var(--ink-faded);
    flex-wrap: wrap;
    gap: 12px;
  }

  .ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: rgba(28, 22, 17, 0.25);
    padding: 0;
    transition: color 0.15s;
  }

  .ghost:hover { color: var(--ink); text-decoration-color: var(--ink); }

  .divider {
    color: var(--ink-faded);
    margin: 0 6px;
    user-select: none;
  }

  .deck-readout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .deck-readout strong {
    color: var(--ink);
    font-weight: 500;
  }

  /* Voice settings, under the progress strip */
  .audio-row {
    margin: -12px 0 22px;
    padding: 9px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    line-height: 1.5;
  }
  .audio-row:empty { display: none; }
  .audio-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .audio-row input[type="checkbox"] { accent-color: var(--ink); margin: 0; }
  .audio-row select {
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    background: var(--cream);
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    padding: 3px 6px;
    max-width: 180px;
  }
  .audio-row .ghost { font-size: 11px; }

  /* 🔊 buttons */
  .speak-btn {
    margin-left: 8px;
    padding: 1px 7px 2px;
    font-size: 14px;
    line-height: 1.3;
    background: transparent;
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 12px;
    cursor: pointer;
    vertical-align: 2px;
  }
  .speak-btn:hover { background: rgba(28, 22, 17, 0.06); }
  .fb-meaning { margin-left: 10px; font-style: italic; color: var(--ink-soft); }
  .fb-meaning::before { content: '— '; }
  .card-speak {
    position: absolute;
    bottom: 16px;
    right: 20px;
    padding: 4px 10px;
    font-size: 16px;
    background: transparent;
    border: 1px solid rgba(28, 22, 17, 0.15);
    border-radius: 14px;
    cursor: pointer;
  }
  .card-speak:hover { background: rgba(28, 22, 17, 0.05); }
  .listen-btn {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px 30px 14px;
    background: transparent;
    border: 1px solid rgba(28, 22, 17, 0.15);
    border-radius: 18px;
    cursor: pointer;
    font: inherit;
  }
  .listen-btn:hover { background: rgba(28, 22, 17, 0.04); }
  .listen-icon { font-size: 54px; line-height: 1; font-style: normal; }
  .listen-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-style: normal;
    color: var(--ink-faded);
  }

  .setup-meta {
    margin-bottom: 22px;
    padding: 11px 16px;
    background: rgba(176, 133, 64, 0.07);
    border-left: 2px solid var(--gold);
    border-radius: 0 3px 3px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .setup-meta.empty { display: none; }

  .setup-meta strong {
    color: var(--ink);
    font-weight: 500;
  }

  .setup-meta .meta-actions {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .setup-meta .meta-sep { color: var(--ink-faded); }

  .setup-meta .ghost {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  .deck-cap {
    margin-bottom: 14px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-faded);
  }

  .deck-cap input {
    width: 64px;
    margin: 0 4px;
    padding: 5px 8px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--paper);
    text-align: center;
    -moz-appearance: textfield;
  }

  .deck-cap input::-webkit-inner-spin-button,
  .deck-cap input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .deck-cap input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(28, 22, 17, 0.06);
  }

  .deck-cap input::placeholder {
    color: var(--ink-faded);
    font-style: italic;
  }

  /* ===== Translation direction toggle (game controls) ===== */
  .direction-toggle {
    display: inline-flex;
    border: 1px solid rgba(28, 22, 17, 0.18);
    border-radius: 3px;
    overflow: hidden;
  }

  .direction-toggle button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 4px 9px;
    background: var(--paper);
    color: var(--ink-soft);
    border: none;
    cursor: pointer;
  }

  .direction-toggle button + button {
    border-left: 1px solid rgba(28, 22, 17, 0.18);
  }

  .direction-toggle button.active {
    background: var(--ink);
    color: var(--paper);
    cursor: default;
  }

  .direction-toggle button:not(.active):hover { color: var(--ink); }

  .override-btn {
    display: block;
    margin-top: 10px;
    font-size: 12px;
  }

  /* ===== Hand-pick modal ===== */
  .hand-pick-btn {
    font-style: italic;
  }

  .focus-modal {
    position: fixed;
    inset: 0;
    background: rgba(28, 22, 17, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .focus-modal[hidden] { display: none; }

  .focus-panel {
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(28, 22, 17, 0.35);
    width: 100%;
    max-width: 640px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(28, 22, 17, 0.15);
  }

  .focus-header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid rgba(28, 22, 17, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .focus-header h3 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 24px;
    color: var(--ink);
  }

  .focus-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink-faded);
    padding: 4px 8px;
    line-height: 1;
    font-family: inherit;
  }

  .focus-close:hover { color: var(--ink); }

  .focus-toolbar {
    padding: 14px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(28, 22, 17, 0.08);
    background: rgba(28, 22, 17, 0.015);
  }

  .focus-toolbar input[type=search] {
    flex: 1;
    min-width: 140px;
    padding: 6px 10px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
  }

  .focus-toolbar input[type=search]:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(28, 22, 17, 0.06);
  }

  .focus-toolbar select {
    padding: 6px 24px 6px 10px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    background-color: var(--paper);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%235a4d3f'/></svg>");
    background-repeat: no-repeat;
    background-position: right 7px center;
  }

  .focus-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    min-height: 240px;
  }

  .focus-item {
    display: grid;
    grid-template-columns: auto 1.1fr 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 9px 24px;
    cursor: pointer;
    border-bottom: 1px solid rgba(28, 22, 17, 0.04);
  }

  .focus-item:hover { background: rgba(28, 22, 17, 0.035); }

  .focus-item input[type=checkbox] {
    cursor: pointer;
    width: 15px;
    height: 15px;
    accent-color: var(--olive, #5a6a3a);
    margin: 0;
  }

  .focus-en {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .focus-it {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
  }

  .focus-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    text-align: right;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .focus-rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.02em;
    text-align: right;
    min-width: 34px;
  }

  .focus-top {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .focus-top input {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
    text-align: center;
    color: var(--ink);
    background: var(--paper);
    -moz-appearance: textfield;
  }

  .focus-top input::-webkit-inner-spin-button,
  .focus-top input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .focus-top input:focus,
  .deck-cap select:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(28, 22, 17, 0.06);
  }

  .deck-cap select {
    margin-left: 4px;
    padding: 5px 24px 5px 8px;
    border: 1px solid rgba(28, 22, 17, 0.22);
    border-radius: 3px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    background-color: var(--paper);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%235a4d3f'/></svg>");
    background-repeat: no-repeat;
    background-position: right 7px center;
  }

  .focus-empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--ink-faded);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
  }

  .focus-footer {
    padding: 14px 24px;
    border-top: 1px solid rgba(28, 22, 17, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: rgba(28, 22, 17, 0.02);
  }

  .focus-count-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .focus-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .focus-apply-btn {
    padding: 8px 18px;
    font-size: 12px;
    letter-spacing: 0.08em;
    width: auto;
  }

  .start-btn {
    width: 100%;
    padding: 18px;
    font-size: 13px;
    letter-spacing: 0.18em;
  }

  /* Long labels (e.g. the disabled hint) wrap on narrow screens instead of
     pushing the page sideways */
  /* Specificity fix (from the verb game): plain .start-btn loses to button.submit,
     which squashed the button's padding */

  /* ===== Card / game ===== */
  .card {
    background: var(--paper);
    border: 1px solid rgba(28, 22, 17, 0.12);
    box-shadow:

      0 24px 48px -24px var(--shadow),
      0 6px 14px -6px var(--shadow);

    padding: 60px 40px 52px;
    margin-bottom: 22px;

    min-height: 280px;

    flex-direction: column;
    justify-content: center;
    align-items: center;

  .card::after {
    content: '';

    inset: 6px;
    border: 1px solid rgba(28, 22, 17, 0.06);
    border-radius: 2px;
    pointer-events: none;

  .card-corner {
    position: absolute;
    top: 18px;
    left: 22px;

  .prompt {

    font-size: 17px;

  button.submit {

  button.submit:hover:not(:disabled) { background: #2a2218; }

  button.submit.secondary:hover:not(:disabled) { background: rgba(28, 22, 17, 0.07); }
  button.skip-btn[hidden] { display: none; }

  .game-trim {
    display: inline-flex;

    align-items: center;
    gap: 6px 16px;
    max-width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .trim-slider { display: inline-flex; align-items: center; gap: 8px; }
  .trim-name { white-space: nowrap; }
  .trim-value { min-width: 6ch; color: var(--ink); font-variant-numeric: tabular-nums; }
  .trim-slider input[type="range"] { --fill: 50%; --fill-color: var(--ink); -webkit-appearance: none; appearance: none; width: 120px; height: 20px; margin: 0; background: transparent; cursor: pointer; }
  .trim-slider.is-focus input[type="range"] { --fill-color: var(--terracotta); }
  .trim-slider input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fill-color) var(--fill), rgba(28, 22, 17, 0.15) var(--fill)); }
  .trim-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5.5px; border-radius: 50%; background: var(--paper); border: 2px solid var(--fill-color); box-shadow: 0 1px 3px rgba(28, 22, 17, 0.25); }
  .trim-slider input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(28, 22, 17, 0.15); }
  .trim-slider input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fill-color); }
  .trim-slider input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--fill-color); }
  .trim-slider input[type="range"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 3px; }
  @media (max-width: 520px) { .trim-slider input[type="range"] { width: 96px; } .trim-name { min-width: 9ch; } }

  kbd {
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 6px;
    background: rgba(28, 22, 17, 0.06);
    border: 1px solid rgba(28, 22, 17, 0.1);
    border-radius: 3px;
    font-size: 10px;
  }

  .complete {
    text-align: center;
    padding: 40px 24px;
  }

  .complete .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;

  .complete h2 {

  /* The completion screen's main button gets its own height (the shared button

  .complete-actions .ghost {

  /* The cards missed this round, above "Practise the ones I missed" */
  .missed { margin: 0 auto 24px; max-width: 560px; }
  .missed-head {
    font-family: 'JetBrains Mono', monospace;

  .missed-more {

    font-family: 'JetBrains Mono', monospace;

  @media (max-width: 520px) {

  /* ===== Verbs (ported from verbi-regolari.html) ===== */
  .mode-label {

  /* Top of the setup screen: Ripasso del giorno and the section switcher */
  .setup-top { margin-bottom: 26px; }
  .container:not([data-view="setup"]) .setup-top { display: none; }
  .setup-top-inner { display: grid; gap: 14px; }
  /* Five equal columns: auto-sized 1fr columns all grow to the widest label */
  .mode-toggle.subject-toggle {

  /* Ripasso del giorno: today's spaced-repetition review, across all sections */
  .ripasso {

    padding: 12px 16px;
    background: var(--cream);
    border: 1px solid rgba(176, 133, 64, 0.35);
    border-left: 3px solid var(--gold);

  .ripasso-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 22px; color: var(--ink); }
  .ripasso-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.03em; }
  .ripasso-text strong { color: var(--ink); font-size: 13px; }
  .ripasso-parts { color: var(--ink-faded); margin-left: 6px; }

  .ripasso-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ripasso-dirs { display: inline-flex; border: 1px solid rgba(28, 22, 17, 0.18); border-radius: 3px; overflow: hidden; }
  .ripasso-dirs button {

  .ripasso-dirs button.active { background: var(--ink); color: var(--cream); }
  button.submit.ripasso-start { padding: 10px 16px; font-size: 11px; }
  .card-section {
    top: auto;
    bottom: 16px;
    font-family: 'JetBrains Mono', monospace;

  .container[data-kind="phrase"] .verb-chip-italian { font-size: 19px; line-height: 1.15; }
  .container[data-kind="phrase"] .prompt { font-size: 50px; line-height: 1.1; }
  .container[data-kind="phrase"] .prompt.long { font-size: 38px; }

  /* Tu / Lei table in the phrases panel */
  .eg.eg-tulei { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .eg.eg-tulei .eg-cell { font-size: 15px; padding: 6px 2px 5px; }
  .eg.eg-tulei .eg-class { font-size: 18px; }

  .eg.eg-agree { grid-template-columns: 62px repeat(3, minmax(0, 1fr)); }

  .eg-words { grid-template-columns: 44px repeat(4, minmax(0, 1fr)); }
  .eg-words .eg-class { font-size: 17px; }
  .eg-words .eg-cell { font-size: 15px; padding: 6px 1px 5px; }

  .container[data-kind="verb"] .prompt { font-size: 60px; }
  .container[data-kind="verb"] .prompt.long { font-size: 46px; line-height: 1.1; }
  /* Every section's setup page has the same width, so switching sections never
     moves the top bar; sections without a side panel keep their content centred */
  .container[data-view="setup"] { max-width: 1080px; }
  .container[data-side="0"][data-view="setup"] #game-area { max-width: 660px; margin: 0 auto; }
  .container[data-view="setup"] .stats,

  .eg {

    grid-template-columns: 50px repeat(4, minmax(0, 1fr));
    gap: 4px;
    margin-bottom: 18px;
    position: relative;   /* anchors the dotted guides */
    z-index: 0;           /* own stacking context, so guides can sit behind cells */
  }

  /* Dotted section guides: absolutely positioned in their grid column, so they
     never disturb the cell layout; centred in the 4px gap before the column.
     They run over the boxes; .eg-txt lifts each ending above them. */
  .eg-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -2.5px;

    border-left: 1px dotted rgba(28, 22, 17, 0.3);

  .eg-txt {

    z-index: 2;

  .rw-practise span { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: none; font-weight: 400; opacity: 0.75; margin-top: 2px; }
  .rw-add-all { background: none; border: 1px solid var(--ink); border-radius: 3px; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; color: var(--ink); }
  .rw-add-all:hover:not(:disabled) { border-color: var(--terracotta); color: var(--terracotta); }
  .rw-add-all:disabled { border-color: rgba(90, 107, 58, 0.5); color: var(--olive); cursor: default; }

  .quiz-q { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--paper); border: 1px solid rgba(28, 22, 17, 0.1); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; transition: border-color 0.3s; }
  .quiz-q.is-right { border-color: rgba(90, 107, 58, 0.55); }
  .quiz-q.is-wrong { border-color: rgba(162, 62, 44, 0.45); }
  .quiz-num { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-style: italic; color: var(--gold); line-height: 1; }
  .quiz-text { font-family: 'Cormorant Garamond', serif; font-size: 21px; margin: 0 0 10px; line-height: 1.3; }
  .quiz-kind { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--terracotta); margin-left: 6px; vertical-align: middle; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .quiz-opt { background: var(--cream); border: 1px solid rgba(28, 22, 17, 0.15); border-radius: 3px; padding: 8px 12px; font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--ink); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .quiz-opt:hover:not(:disabled) { border-color: var(--terracotta); }
  .quiz-opt:disabled { cursor: default; opacity: 0.55; }
  .quiz-opt.is-correct { background: rgba(90, 107, 58, 0.16); border-color: var(--olive); opacity: 1; }
  .quiz-opt.is-chosen { background: rgba(162, 62, 44, 0.12); border-color: var(--terracotta); opacity: 1; text-decoration: line-through; }
  .quiz-fb { margin: 10px 0 0; font-size: 14px; color: var(--ink-soft); font-style: italic; }
  .quiz-q.is-right .quiz-fb { color: var(--olive); }
  .quiz-find-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 3px; padding: 8px 14px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer; }
  .quiz-find-btn:hover { background: var(--terracotta); }
  .reader-end { max-width: 640px; margin: 10px auto 0; }
  .end-card { display: flex; align-items: center; gap: 26px; background: var(--paper); border: 1px solid rgba(162, 62, 44, 0.3); border-radius: 4px; padding: 22px 24px; margin-top: 18px; }
  .end-text h3 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 28px; margin: 0 0 6px; }
  .end-text p { margin: 0; color: var(--ink-soft); line-height: 1.5; }
  .end-note { text-align: center; color: var(--ink-faded); font-style: italic; }
  .reader-foot { max-width: 640px; margin: 34px auto 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* The pictures' small movements */
  .story-art .twinkle { animation: art-twinkle 3.4s ease-in-out infinite; }
  @keyframes art-twinkle { 50% { opacity: 0.25; } }
  .art-c1 .rain { animation: art-rain 0.55s linear infinite; }
  @keyframes art-rain { to { transform: translate(-6px, 48px); } }
  .art-c1 .lamp-glow { animation: art-glow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes art-glow { 50% { opacity: 0.72; transform: scale(0.94); } }
  .art-c1 .window-lit { animation: art-twinkle 7s ease-in-out infinite; }
  .art-c2 .sun-glow { animation: art-glow 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .art-c2 .sway { animation: art-sway 3.6s ease-in-out infinite alternate; }
  @keyframes art-sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .art-c3 .steam { animation: art-steam 3.3s ease-out infinite; opacity: 0; }
  @keyframes art-steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-26px); } }
  .art-c3 .mote { animation: art-mote 9s ease-in-out infinite; opacity: 0; }
  @keyframes art-mote { 0%, 100% { opacity: 0; transform: translate(0, 0); } 40% { opacity: 0.9; } 70% { opacity: 0.5; transform: translate(14px, -10px); } }
  .art-c3 .flame { animation: art-flame 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
  @keyframes art-flame { to { transform: scaleY(0.82) skewX(-4deg); opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) {
    .story-art *, .map-route, .map-pin .pin-pulse, .story-stamp.is-landing, .w.is-found, .w.is-miss { animation: none !important; }
  }

  @media (max-width: 600px) {
    .story-title { font-size: 40px; }
    .reader-title { font-size: 38px; }
    .reader-text { font-size: 20px; }
    .rd-sent { grid-template-columns: 22px minmax(0, 1fr) 26px; gap: 4px; }
    .rd-play, .rd-en-btn { opacity: 0.7; }
    .word-pop { position: fixed; left: 0 !important; right: 0; bottom: 0; top: auto !important; width: auto !important; max-height: 70vh; overflow-y: auto; border-radius: 12px 12px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
    .end-card { flex-direction: column; text-align: center; gap: 14px; }
    .story-stamp { width: 96px; height: 96px; }
    .map-pin .pin-label { font-size: 18px; }
    /* The map at a readable size, panned sideways like a real one */
    .story-map { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-left: -4px; margin-right: -4px; padding: 0 4px 6px; }
    .story-map-svg { min-width: 660px; }
  }

  /* ===== Sign-in (once per device) ===== */
  .signin-gate { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(243, 234, 216, 0.97); }
  .signin-card { width: 100%; max-width: 420px; background: var(--paper); border: 1px solid rgba(28, 22, 17, 0.14); border-top: 3px solid var(--terracotta); border-radius: 6px; box-shadow: 0 20px 60px rgba(28, 22, 17, 0.18); padding: 34px 32px 26px; text-align: center; }
  .signin-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
  .signin-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 46px; line-height: 1.05; margin: 8px 0 12px; color: var(--ink); }
  .signin-text { font-size: 15px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 22px; }
  .signin-button { display: flex; justify-content: center; min-height: 44px; }
  .signin-msg { min-height: 1.2em; margin: 14px 0 0; font-size: 13.5px; color: var(--terracotta); }

  /* ===== Verbs: which persons to practise ===== */
  .person-picker { margin: 0 auto 4px; max-width: 360px; }
  .person-picker[hidden] { display: none; }
  .person-label { display: flex; justify-content: center; align-items: baseline; gap: 12px; }
  .person-quick { font-size: 11px; letter-spacing: 0.04em; text-transform: none; }
  .person-quick .ghost { font-size: 11px; }
  .person-quick .ghost.active { color: var(--ink); text-decoration-color: var(--terracotta); }
  /* Singular on the top row, plural below — the shape of a conjugation table */
  .person-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 4px; }
  .person-chip { background: var(--paper); border: 1px dashed rgba(28, 22, 17, 0.3); border-radius: 3px; padding: 8px 4px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: var(--ink-faded); cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .person-chip:hover { border-color: var(--terracotta); color: var(--ink); }
  .person-chip.active { background: var(--ink); border-style: solid; border-color: var(--ink); color: var(--paper); }
  .person-hint { min-height: 1em; margin: 2px 0 10px; font-size: 12.5px; color: var(--terracotta); text-align: center; }

  /* ===== Scrittura: what was missing or wrong ===== */
  .sent-diff { margin-top: 10px; display: grid; gap: 5px; font-size: 15px; }
  .sent-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .sent-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faded); }
  .sent-words { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--ink); line-height: 1.4; }
  .sent-wrong { color: var(--terracotta); text-decoration-thickness: 1.5px; }
  .sent-missing { background: rgba(90, 107, 58, 0.18); color: var(--olive); font-weight: 600; padding: 0 3px; border-radius: 2px; }

  /* Scrittura: the natural English, under a word-for-word prompt */
  .natural-en { margin: 6px auto 2px; max-width: 90%; text-align: center; font-family: 'DM Sans', sans-serif; font-size: 14.5px; line-height: 1.4; color: var(--ink-faded); }
  .natural-en[hidden] { display: none; }
  .natural-label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }

  .sent-why { margin-top: 4px; }
  .sent-why-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; line-height: 1.5; color: var(--ink-soft); }
  .sent-why-list li { padding-left: 22px; position: relative; }
  .sent-why-list li::before { content: '→'; position: absolute; left: 0; color: var(--gold); }
  .sent-why-list em { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--ink); }
  .sent-why-list em.why-hit { font-weight: 600; color: var(--olive); background: rgba(107, 124, 63, 0.14); padding: 0 3px; border-radius: 2px; }

  /* Scrittura: the kinds of sentence */
  .type-toggle .mode-option { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; padding-left: 22px; padding-right: 22px; }
  .type-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }
  .type-toggle { width: fit-content; max-width: 100%; margin-left: auto; margin-right: auto; box-sizing: border-box; }
  .type-toggle .mode-option { flex: 1 1 auto; min-width: 0; }
  @media (max-width: 520px) { .type-toggle .mode-option { padding-left: 10px; padding-right: 10px; letter-spacing: 0.06em; font-size: 12px; } }
  #type-hint:empty, #number-hint:empty { display: none; }
  .type-key { margin: 12px auto 22px; max-width: 600px; text-align: center; font-family: 'DM Sans', sans-serif; font-size: 13.5px; line-height: 1.55; color: var(--ink-faded); }
  .type-key em { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--ink-soft); }
  .literal-label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }

  /* Preposizioni: the + in gold (a fusion drill's pieces, after answering); grouped chips; the table */
  .mech-plus { color: var(--gold); margin: 0 0.1em; }
  .literal-gap { margin-top: 8px; }
  .theme-chips.grouped { display: grid; gap: 10px; }
  .theme-group { display: grid; grid-template-columns: 128px minmax(0, 1fr); align-items: start; gap: 8px; }
  .theme-group-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .theme-group-btn { flex: 0 0 auto; min-width: 128px; text-align: left; background: none; border: none; padding: 4px 6px 4px 0; cursor: pointer;
                     font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: var(--terracotta); }
  .theme-group-btn:hover, .theme-group-btn.full { text-decoration: underline; text-underline-offset: 4px; }
  .theme-group-btn.partial { text-decoration: underline dotted; text-underline-offset: 4px; }
  .eg-prep { grid-template-columns: 30px repeat(5, minmax(0, 1fr)); }
  .eg-prep .eg-class { font-size: 17px; }
  .eg-prep .eg-cell { font-size: 14px; padding: 5px 1px 4px; }
  .eg-prep .eg-person { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  @media (max-width: 640px) { .theme-group { grid-template-columns: 1fr; gap: 4px; } .theme-group-btn { padding-bottom: 0; } }

  /* In a round: the section's chart, on demand — a drawer beside the card, a sheet on a phone */
  .chart-overlay { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; background: rgba(28, 22, 17, 0.28); }
  .chart-overlay[hidden] { display: none; }
  .chart-sheet { position: relative; width: min(420px, 100%); height: 100%; overflow-y: auto; box-sizing: border-box; padding: 46px 18px 28px;
                 background: var(--cream); box-shadow: -10px 0 30px rgba(28, 22, 17, 0.18); animation: chart-in 0.18s ease-out; }
  .chart-close { position: absolute; top: 6px; right: 10px; z-index: 1; background: none; border: none; cursor: pointer; padding: 4px 9px;
                 font-size: 28px; line-height: 1; color: var(--ink-soft); }
  .chart-close:hover { color: var(--terracotta); }
  .chart-body .endings { position: static; margin: 0; }
  @keyframes chart-in { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes chart-up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-width: 640px) {
    .chart-overlay { align-items: flex-end; justify-content: center; }
    .chart-sheet { width: 100%; height: auto; max-height: 86vh; border-radius: 12px 12px 0 0; animation-name: chart-up; }
  }
  @media (prefers-reduced-motion: reduce) { .chart-sheet { animation: none; } }

  /* After a miss: type the right answer to go on */
  .answer.retype { border-color: var(--terracotta); }
  .answer.retype-miss { animation: retype-shake 0.3s ease; }
  @keyframes retype-shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .answer.retype-miss { animation: none; } }
  .retype-hint { margin-bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--terracotta); }

  /* Parla: say the answer */
  .answer-wrap { position: relative; flex: 1; display: flex; min-width: 0; }
  .answer-wrap input.answer { flex: 1; min-width: 0; }
  .answer-wrap.has-mic input.answer { padding-right: 56px; }
  button.mic-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%;
                   background: transparent; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
  button.mic-btn:hover { background: rgba(28, 22, 17, 0.07); color: var(--ink); }
  button.mic-btn[hidden] { display: none; }
  .mic-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mic-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button.mic-btn.listening { color: var(--terracotta); background: rgba(160, 82, 45, 0.1); animation: mic-pulse 1.2s ease-in-out infinite; }
  @keyframes mic-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(160, 82, 45, 0.35); } 50% { box-shadow: 0 0 0 7px rgba(160, 82, 45, 0); } }
  @media (prefers-reduced-motion: reduce) { button.mic-btn.listening { animation: none; } }
  input.answer.interim { color: var(--ink-faded); font-style: italic; }
  .speak-hint { margin: -4px 0 14px; font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: var(--ink-soft); }
  .speak-hint:empty { display: none; }
  .said-aloud { margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--olive); }

  /* Dialoghi: the scenes, and a scene's three steps */
  .container[data-subject="dialoghi"][data-view="setup"] #game-area { max-width: none; }
  .container[data-view="dialogue"] { max-width: 860px; }
  .container[data-view="dialogue"] .stats,
  .container[data-view="dialogue"] .progress-bar,
  .container[data-view="dialogue"] #controls { display: none; }
  .dlg-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-top: 28px; }
  .dlg-card { display: flex; flex-direction: column; gap: 6px; padding: 22px 22px 18px; background: var(--paper); border: 1px solid rgba(28, 22, 17, 0.12); border-radius: 4px;
              box-shadow: 0 1px 0 rgba(28, 22, 17, 0.04), 0 14px 30px -20px rgba(28, 22, 17, 0.3); }
  .dlg-card.is-heard { border-color: rgba(90, 107, 58, 0.35); }
  .dlg-card-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faded); }
  .dlg-card-title { margin: 2px 0 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 32px; line-height: 1.1; color: var(--ink); }
  .dlg-card-en { margin: 0; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink-soft); }
  .dlg-cast { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; }
  .dlg-cast.spk-a, .spk-a .dlg-speaker { color: var(--gold); }
  .dlg-cast.spk-b, .spk-b .dlg-speaker { color: var(--ink-soft); }
  .dlg-card-steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .dlg-step { padding: 4px 8px; border: 1px dashed rgba(28, 22, 17, 0.22); border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: var(--ink-faded); }
  .dlg-step.is-done { border-style: solid; border-color: rgba(90, 107, 58, 0.45); background: rgba(90, 107, 58, 0.08); color: var(--olive); }
  .dlg-open { align-self: flex-start; margin-top: 8px; }
  .dlg-back { margin: 0 0 18px; padding: 0 0 1px; background: none; border: none; border-bottom: 1px solid rgba(28, 22, 17, 0.25); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink-soft); cursor: pointer; }
  .dlg-back:hover { color: var(--ink); border-color: var(--ink); }
  .dlg-title { margin: 6px 0 4px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 48px; line-height: 1.05; color: var(--ink); }
  .dlg-sub { margin: 0; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink-soft); }
  .dlg-sec { margin-top: 34px; padding-top: 22px; border-top: 1px solid rgba(28, 22, 17, 0.12); }
  .dlg-sec-title { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 30px; color: var(--ink); }
  .dlg-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 1px solid var(--gold); border-radius: 50%;
             font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 13px; color: var(--gold); }
  .dlg-help { margin: 0 0 16px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; line-height: 1.5; color: var(--ink-soft); }
  .dlg-player { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 10px; }
  .dlg-play { padding: 13px 20px; background: var(--ink); color: var(--cream); border: none; border-radius: 3px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .dlg-play.active { background: var(--terracotta); }
  .mode-toggle.dlg-speed { margin: 0; }
  .dlg-heard { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--olive); }
  .dlg-heard[hidden] { display: none; }
  .dlg-toggles { display: flex; flex-wrap: wrap; gap: 16px; margin: 6px 0 14px; }
  .dlg-lines { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .dlg-line { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 4px 16px; align-items: baseline; padding: 12px 16px; background: var(--paper);
              border: 1px solid rgba(28, 22, 17, 0.1); border-radius: 4px; cursor: pointer; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s; }
  .dlg-line.spk-b { margin-left: 8%; background: var(--cream); }
  .dlg-line:hover { border-color: rgba(176, 133, 64, 0.5); }
  .dlg-line:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .dlg-line.is-speaking { border-color: var(--gold); background: rgba(176, 133, 64, 0.12); box-shadow: inset 3px 0 0 var(--gold); }
  .dlg-speaker { padding-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; }
  .dlg-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .dlg-it { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 23px; line-height: 1.3; color: var(--ink); }
  .dlg-en { font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.4; color: var(--ink-soft); }

    { en: "the development", it: "lo sviluppo", noun: "sviluppo", g: "m", note: "Literally an unwrapping: <em>sviluppare</em> is <em>s-</em> (undo) + <em>viluppo</em> (a bundle or wrapping), so it first meant to unwrap or unroll, then to unfold, then to grow gradually, like a bud opening. Photography keeps the old picture: <em>sviluppare un rullino</em> is to develop a film. English 'develop' (de- + velop, unwrap) and 'envelop' (en- + velop, wrap in) are close cousins from French, matching Italian <em>sviluppare</em> and <em>avviluppare</em>. A software developer is <em>uno sviluppatore</em>. The <em>s-</em> prefix reverses many verbs: <em>piegare</em> (fold) → <em>spiegare</em> (unfold, explain), <em>coprire</em> → <em>scoprire</em> (uncover). And because it puts <em>s</em> before a consonant, these nouns take <em>lo</em>. One trap: an envelope for a letter is <em>la busta</em>, not <em>inviluppo</em>." },

    { en: "the mind", it: "la mente", noun: "mente", g: "f", note: "Latin <em>mens</em>, whose form <em>mente</em> meant 'with a … mind'. That is where Italian adverbs in <em>-mente</em> come from: <em>chiaramente</em> was once 'with a clear mind', <em>lentamente</em> 'with a slow mind'. The phrase hardened into a suffix, just as it did in French <em>-ment</em> and Spanish <em>-mente</em>." },

    { en: "the parent", it: "il genitore", noun: "genitore", g: "m", note: "A classic false friend: <em>i genitori</em> are your parents, while relatives are <em>i parenti</em>. Both come from Latin, <em>genitor</em> (begetter) and <em>parens</em> (parent). Italian kept the first for mother and father and let the second widen to the whole family." },
    { en: "the attention", it: "l'attenzione", noun: "attenzione", g: "f" },
    { en: "the theme/essay", it: "il tema", noun: "tema", g: "m", note: "Masculine despite the <em>-a</em>, like <em>il programma</em>, <em>il problema</em> and <em>il clima</em>: Greek <em>-ma</em> nouns take <em>il</em>, and the plural is <em>i temi</em>. At school <em>il tema</em> is also the essay you write." },

    { en: "the occasion/opportunity", it: "l'occasione", noun: "occasione", g: "f", note: "Also a bargain: <em>un'occasione</em> in a shop window is a good deal, the opportunity to buy cheaply. <em>Cogliere l'occasione</em> means to seize the moment." },
    { en: "the province", it: "la provincia", noun: "provincia", g: "f", note: "Latin <em>provincia</em> was a territory outside Italy run by a Roman governor. The first one beyond the Alps, in southern Gaul, was known simply as 'the Province', and the name stuck: that's Provence. Today Italy's <em>province</em> sit between the regions and the <em>comuni</em>." },

    { en: "the beef", it: "il manzo", noun: "manzo", g: "m", note: "<em>Manzo</em> is beef, and the young bullock it comes from: from Latin <em>mansuetus</em>, 'tame'. Veal is <em>vitello</em>, pork <em>maiale</em>." },
    { en: "the lamb", it: "l'agnello", noun: "agnello", g: "m", note: "Both the animal and its meat. From Latin <em>agnellus</em>, 'little lamb' (<em>agnus</em>, as in <em>Agnus Dei</em>)." },
    { en: "the veal", it: "il vitello", noun: "vitello", g: "m", note: "The calf and its meat. From Latin <em>vitellus</em>, 'little calf' — English <em>veal</em> came from the same word through French." },
    { en: "the sausage", it: "la salsiccia", noun: "salsiccia", g: "f", note: "From Late Latin <em>salsicia</em>, from <em>salsus</em>, 'salted' — the root of <em>salsa</em> and of English <em>sausage</em>." },

    { en: "the tuna", it: "il tonno", noun: "tonno", g: "m", note: "From Greek <em>thynnos</em>, through Latin <em>thunnus</em> — the old English <em>tunny</em> is the same word." },
    { en: "the salmon", it: "il salmone", noun: "salmone", g: "m" },
    { en: "the prawn", it: "il gambero", noun: "gambero", g: "m", note: "Prawns and shrimps alike are <em>gamberi</em>; a small one is a <em>gamberetto</em>." },

    { en: "the steak", it: "la bistecca", noun: "bistecca", g: "f", note: "From English <em>beefsteak</em>, borrowed in the 1800s and made Italian. The famous one is the <em>bistecca alla fiorentina</em>." },
    { en: "the bean", it: "il fagiolo", noun: "fagiolo", g: "m", note: "Mostly in the plural: <em>i fagioli</em>. From Latin <em>phaseolus</em>, a small bean." },
    { en: "the chickpea", it: "il cece", noun: "cece", g: "m", note: "Latin <em>cicer</em> — the source of English <em>chickpea</em> (through French <em>chiche</em>), and of Cicero's name. Mostly plural: <em>i ceci</em>." },
    { en: "the lentil", it: "la lenticchia", noun: "lenticchia", g: "f", note: "From Latin <em>lenticula</em>, 'little lentil' — and because a lens is lentil-shaped, Latin <em>lens</em> gave English <em>lens</em>." },
    { en: "the pea", it: "il pisello", noun: "pisello", g: "m", note: "Mostly plural: <em>i piselli</em>. From Latin <em>pisum</em>, like English <em>pea</em> (once <em>pease</em>)." },
    { en: "the carrot", it: "la carota", noun: "carota", g: "f" },
    { en: "the lettuce", it: "la lattuga", noun: "lattuga", g: "f", note: "From Latin <em>lactuca</em>, from <em>lac</em>, milk — for the milky sap in its stem." },
    { en: "the spinach", it: "gli spinaci", noun: "spinaci", g: "m", note: "Always plural: <em>gli spinaci</em>. From Arabic <em>isfānākh</em>, a Persian word, through medieval Latin." },
    { en: "the pepper (vegetable)", it: "il peperone", noun: "peperone", g: "m", note: "The big pepper: <em>pepe</em>, the spice, + <em>-one</em>, big. A hot little one is a <em>peperoncino</em>." },
    { en: "the courgette", it: "la zucchina", noun: "zucchina", g: "f", note: "Also <em>lo zucchino</em>: a little <em>zucca</em>, pumpkin. American English took the plural, <em>zucchini</em>." },
    { en: "the aubergine", it: "la melanzana", noun: "melanzana", g: "f", note: "From Arabic <em>bāḏinjān</em> (a Persian word), reshaped to sound like <em>mela</em>, apple — some explained it as <em>mela insana</em>, 'unhealthy apple'." },
    { en: "the cucumber", it: "il cetriolo", noun: "cetriolo", g: "m" },
    { en: "the cabbage", it: "il cavolo", noun: "cavolo", g: "m", note: "From Latin <em>caulis</em>, the stem. <em>Che cavolo!</em> — 'what the cabbage!' — is a polite way to swear." },
    { en: "the broccoli", it: "il broccolo", noun: "broccolo", g: "m", note: "A little shoot, from <em>brocco</em>, a sprout. English took the plural: <em>broccoli</em>." },
    { en: "the celery", it: "il sedano", noun: "sedano", g: "m", note: "From Greek <em>selinon</em> — which also named Selinunte, the Greek city in Sicily, after its wild celery." },

    { en: "the vegetables", it: "la verdura", noun: "verdura", g: "f", note: "One word for all of them: <em>la verdura</em>, from <em>verde</em>, green. <em>Frutta e verdura</em>: fruit and veg." },
    { en: "the olive", it: "l'oliva", noun: "oliva", g: "f", note: "The fruit; the tree is <em>l'olivo</em> (or <em>l'ulivo</em>)." },
    { en: "the basil", it: "il basilico", noun: "basilico", g: "m", note: "From Greek <em>basilikon</em>, 'royal' — the king of herbs." },
    { en: "the parsley", it: "il prezzemolo", noun: "prezzemolo", g: "m", note: "From Latin <em>petroselinum</em>, 'rock celery', like English <em>parsley</em>. <em>Essere come il prezzemolo</em>: to turn up everywhere." },
    { en: "the melon", it: "il melone", noun: "melone", g: "m" },

    { en: "the pear", it: "la pera", noun: "pera", g: "f" },

    { en: "the floor structure (between storeys)", it: "il solaio", noun: "solaio", g: "m", note: "The beams and boards (or slab) between two storeys — and in many places the attic above. From Latin <em>solarium</em>, a sunny terrace on a roof, from <em>sol</em>, the sun." },

    { en: "the step (of a stair)", it: "il gradino", noun: "gradino", g: "m", note: "A little <em>grado</em>, from Latin <em>gradus</em>, a step — as in 'gradual' and 'degree'." },

    { en: "the lime (for building)", it: "la calce", noun: "calce", g: "f", note: "From Latin <em>calx</em>, limestone — as in 'chalk', 'calcium' and 'calculate' (a <em>calculus</em> was a pebble for counting). NHL is <em>calce idraulica naturale</em>." },

    { en: "the utility bill", it: "la bolletta", noun: "bolletta", g: "f", note: "<em>La bolletta della luce</em>, of the gas, of the water. A little <em>bolla</em>, a seal (Latin <em>bulla</em>), like English 'bill'. In a restaurant the bill is <em>il conto</em>." },
    { en: "the takeover (of a supply)", it: "il subentro", noun: "subentro", g: "m", note: "Taking over an existing supply in your own name, on a meter that's already there; a brand-new connection is <em>un nuovo allacciamento</em>. From <em>subentrare</em>, to step into someone's place." },
