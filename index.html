  // ----- Signing in with Google: once per device -----
  // Shown only when the server can be reached and says which Google client to use;
  // offline, the app just works from this device's copy and offers sign-in later.
  async function signinOffer(message = '') {
    if (syncKey()) return;
    let r = null;
    try { r = await syncRequest('GET', '/v1/config'); } catch (e) { /* offline */ }
    if (r && r.status === 404 && !syncKey()) { syncLegacyStart(); return; }
    if (!r || r.status !== 200 || !r.data || !r.data.googleClientId || syncKey()) return;
    renderSigninGate(r.data.googleClientId, message);
  }
  // The live server predates sign-in: sync with the old built-in key, as before. A
  // device's first sync merges its progress in, ignoring resets made before joining.
  function syncLegacyStart() {
    syncState.legacy = true;
    const meta = syncMeta();
    if (!meta.joined) {
      syncSaveMeta({ ...meta, epochs: {} });
      try { localStorage.removeItem(SYNC_BASE_KEY); } catch (e) { /* ignore */ }
    }
    syncNow();
  }
  function syncSignedOut() {
    syncState.legacy = false;   // the server now expects a sign-in
    const meta = syncMeta();
    delete meta.session; delete meta.email;
    syncSaveMeta(meta);
    syncSetStatus('signed-out');
    signinOffer('Please sign in again.');
  }
  function loadGoogleSignIn() {
    if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = GIS_SRC;
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('google sign-in'));
      document.head.appendChild(s);
    });
  }
  function signinMessage(text) {
    const el = document.getElementById('signin-msg');
    if (el) el.textContent = text;
  }
  function renderSigninGate(clientId, message = '') {
    let gate = document.getElementById('signin-gate');
    if (!gate) {
      gate = document.createElement('div');
      gate.id = 'signin-gate';
      gate.className = 'signin-gate';
      document.body.appendChild(gate);
    }
    gate.innerHTML = `
      <div class="signin-card" role="dialog" aria-modal="true" aria-labelledby="signin-title">
        <div class="signin-eyebrow">Il Mazzo</div>
        <h2 class="signin-title" id="signin-title">Bentornato</h2>
        <p class="signin-text">Sign in with Google to keep your progress on every device.</p>
        <div class="signin-button" id="signin-button"></div>
        <p class="signin-msg" id="signin-msg" aria-live="polite">${storyEsc(message)}</p>
      </div>`;
    loadGoogleSignIn().then(() => {
      google.accounts.id.initialize({ client_id: clientId, callback: signinWithGoogle, auto_select: true, cancel_on_tap_outside: false });
      google.accounts.id.renderButton(document.getElementById('signin-button'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 260 });
      google.accounts.id.prompt();
    }).catch(() => signinMessage("Couldn't load Google sign-in — check your connection and reload."));
  }
  function closeSigninGate() {
    const gate = document.getElementById('signin-gate');
    if (gate) gate.remove();
  }
  async function signinWithGoogle(response) {
    signinMessage('Signing in…');
    let r = null;
    try { r = await syncRequest('POST', '/v1/session', null, { credential: response && response.credential, legacyKey: SYNC_LEGACY_KEY }); } catch (e) { /* offline */ }
    if (!r) { signinMessage("Couldn't reach the server — check your connection and try again."); return false; }
    if (r.status === 403) { signinMessage('This Il Mazzo is private.'); return false; }
    if (r.status !== 200 || !r.data || !r.data.token) { signinMessage("Sign-in didn't work — please try again."); return false; }
    // A first sign-in on this device: its progress is merged in (keeping the larger
    // counts, so a shared backup isn't counted twice), and earlier resets don't count
    const meta = syncMeta();
    delete meta.key; delete meta.joined;
    syncSaveMeta({ ...meta, session: r.data.token, email: r.data.email, epochs: {} });
    try { localStorage.removeItem(SYNC_BASE_KEY); } catch (e) { /* ignore */ }
    syncDirty = true;
    closeSigninGate();
    await syncNow();
    return true;
  }

  // Validates the file, asks before overwriting, then reloads everything
  function restoreFromText(text) {
    let payload = null;
    try { payload = JSON.parse(text); } catch (e) { /* not JSON */ }
    if (!payload || payload.app !== BACKUP_APP || !payload.data || typeof payload.data !== 'object') {
      alert("That file isn't an Il Mazzo backup.");
      return false;
    }
    const known = new Set(storageKeys());
    const valid = (k, v) => {
      if (!known.has(k) || typeof v !== 'string') return false;
      if (k === SUBJECT_KEY) return !!SUBJECTS[v];
      if (k === RIPASSO_DIR_KEY) return !!DIR_LABELS[v];
      try { const o = JSON.parse(v); return !!o && typeof o === 'object'; } catch (e) { return false; }
    };
    const entries = Object.entries(payload.data).filter(([k, v]) => valid(k, v));
    if (!entries.length) {
      alert('That backup has nothing in it to restore.');
      return false;
    }
    const when = payload.savedAt ? new Date(payload.savedAt).toLocaleString() : 'an earlier session';
    if (!confirm(`Restore the progress and associations saved on ${when}? This replaces what's saved here now.`)) return false;
    try {
      for (const k of known) localStorage.removeItem(k);
      for (const [k, v] of entries) localStorage.setItem(k, v);
    } catch (e) {
      alert('Your browser blocked saving the restored data.');
      return false;
    }
    // A restore replaces everything, so it wins over other devices at the next sync
    syncMarkReset([...syncedKeys().keys()]);
    let saved = null;
    try { saved = localStorage.getItem(SUBJECT_KEY); } catch (e) { /* ignore */ }
    applySubject(SUBJECTS[saved] ? saved : subject);
    showSetup();
    return true;
  }

  // ===== Game view =====
  const cardHTML = `
    <div class="card">
      <div class="card-corner streak-flag" id="streak-display"></div>
      <div class="card-corner right">№ <span id="cardnum">001</span></div>
      <div class="card-corner card-section" id="card-section"></div>
      <div class="verb-meta" id="verb-meta" style="display: none"></div>
      <div class="prompt" id="prompt"></div>
      <div class="natural-en" id="natural-en" hidden></div>
      <div class="pronoun-hint" id="pronoun-hint">+ articolo</div>
      <button type="button" class="card-speak" id="card-speak" aria-label="Hear the Italian" title="Hear the Italian" hidden>🔊</button>
    </div>
    <div class="input-row">
      <div class="answer-wrap" id="answer-wrap">
        <input type="text" class="answer" id="answer" placeholder="type the italian with article…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="mic-btn" id="mic-btn" aria-pressed="false" aria-label="Parla — say the answer in Italian" title="Parla — say it in Italian (⇧ Enter)" hidden><svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg><span class="mic-label">Parla</span></button>
      </div>
      <button type="button" class="submit" id="submit">Controlla</button>
      <button type="button" class="submit secondary skip-btn" id="skip-btn" title="Show the answer — it counts as wrong, then type it out">Salta</button>
    </div>
    <div class="speak-hint" id="speak-hint" aria-live="polite"></div>
    <div class="feedback hidden" id="feedback"></div>
  `;

  function showGameControls() {
    controlsEl.innerHTML = `
      <div class="controls-left">
        <button type="button" class="ghost" id="reshuffle-btn">↻ Reshuffle</button>
        <button type="button" class="ghost" id="change-btn">${reviewMode ? '← Back to setup' : `← Change ${SUBJECTS[subject].itemWords}`}</button>
        <div class="game-trim" id="game-trim"></div>
        ${reviewMode ? '' : '<button type="button" class="ghost" id="game-focus-btn">→ Focus…</button>'}
        <button type="button" class="ghost chart-btn" id="chart-btn" hidden></button>
        <span class="direction-toggle" role="group" aria-label="Translation direction"${reviewMode ? ' hidden' : ''}>
          <button type="button" data-dir="en-it" class="${direction === 'en-it' ? 'active' : ''}" aria-pressed="${direction === 'en-it'}">EN → IT</button>
          <button type="button" data-dir="it-en" class="${direction === 'it-en' ? 'active' : ''}" aria-pressed="${direction === 'it-en'}">IT → EN</button>
          <button type="button" data-dir="listen" class="${direction === 'listen' ? 'active' : ''}" aria-pressed="${direction === 'listen'}" title="Hear the Italian and type it">🔊 Listen</button>
        </span>
      </div>
      <span><kbd>Enter</kbd> submits · then again for next<span id="mic-help" hidden> · <kbd>⇧ Enter</kbd> or the microphone to say it</span></span>
    `;
    document.getElementById('reshuffle-btn').addEventListener('click', () => startGame());
    document.getElementById('change-btn').addEventListener('click', showSetup);
    document.getElementById('chart-btn').addEventListener('click', openChart);
    updateChartBtn();
    const focusBtn = document.getElementById('game-focus-btn');
    if (focusBtn) focusBtn.addEventListener('click', () => openFocusModal('game'));
    controlsEl.querySelectorAll('.direction-toggle button').forEach(btn => {
      btn.addEventListener('click', () => setDirection(btn.dataset.dir));
    });
    refreshDeckSliders();
  }

  // Mid-game deck resize — reads the dropdown value. Can shrink (slice) or
  // grow up to the whole session pool. Growing pulls unused cards from the
  // focus set first, then from the rest of the setup selection. Preserves index
  // so the current card stays put. If we're already past the new end, wraps up.
  // ===== Deck size: sliders =====
  // One slider for the deck size, from 1 to the whole session pool. After "Practise
  // the ones I missed" (or a mid-game Focus) the deck has two groups — those cards and
  // the rest of the pool — so there are two sliders, one per group. Growing adds the
  // group's unplayed cards (the rest in the session's pick order: random, or the most
  // common next); shrinking trims from the end of the play order. With two sliders a
  // group can't drop below the cards already played from it, and the deck never empties.
  function trimFill(input) {
    const min = +input.min, max = +input.max, v = +input.value;
    input.style.setProperty('--fill', `${max > min ? ((v - min) / (max - min)) * 100 : 100}%`);
  }
  function trimSliderHTML(id, name, value, min, max, cls = '') {
    return `<label class="trim-slider${cls}">
      <span class="trim-name">${name}</span>
      <input type="range" id="${id}" min="${min}" max="${max}" step="1" value="${value}" aria-valuetext="${value} of ${max}">
      <output class="trim-value" id="${id}-value" for="${id}">${value} / ${max}</output>
    </label>`;
  }
  function refreshDeckSliders() {
    const box = document.getElementById('game-trim');
    if (!box || !sessionPool) return;
    const P = sessionPool.length;
    if (!sessionFocused) {
      box.innerHTML = trimSliderHTML('game-trim-input', 'Deck size', deck.length, 1, P);
    } else {
      const focusKeys = new Set(sessionMaxDeck.map(c => c.key));
      const F = sessionMaxDeck.length, R = P - F;
      const inFocus = deck.filter(c => focusKeys.has(c.key)).length;
      const playedFocus = deck.slice(0, index).filter(c => focusKeys.has(c.key)).length;
      const playedRest = Math.min(index, deck.length) - playedFocus;
      box.innerHTML = trimSliderHTML('game-trim-focus', sessionIsReview ? 'Missed' : 'Focus', inFocus, playedFocus, F, ' is-focus')
        + (R > 0 ? trimSliderHTML('game-trim-rest', 'The rest', deck.length - inFocus, playedRest, R) : '');
    }
    box.querySelectorAll('input[type="range"]').forEach(input => {
      trimFill(input);
      input.addEventListener('input', () => {
        trimFill(input);
        document.getElementById(`${input.id}-value`).textContent = `${input.value} / ${input.max}`;
        input.setAttribute('aria-valuetext', `${input.value} of ${input.max}`);
      });
      input.addEventListener('change', () => (input.id === 'game-trim-input' ? handleGameResize() : handleGameResizeParts(input)));
    });
  }
  function afterResize(currentKey) {
    totalEl.textContent = deck.length;
    progressEl.style.width = `${Math.min(index / deck.length, 1) * 100}%`;
    refreshDeckSliders();
    if (index >= deck.length) showComplete();
    else if (deck[index].key !== currentKey) render();   // the card on screen left the deck
  }

  function handleGameResize() {
    const input = document.getElementById('game-trim-input');
    if (!input || !sessionPool) return;
    const newSize = parseInt(input.value, 10);
    if (!Number.isFinite(newSize) || newSize <= 0 || newSize === deck.length) return;
    const currentKey = deck[index] && deck[index].key;
    if (newSize < deck.length) {
      deck = deck.slice(0, newSize);
    } else if (newSize <= sessionPool.length) {
      const inDeck = new Set(deck.map(c => c.key));
      const inFocus = new Set(sessionMaxDeck.map(c => c.key));
      const focusLeftovers = shuffle(sessionMaxDeck.filter(c => !inDeck.has(c.key)));
      const others = sessionPool.filter(c => !inDeck.has(c.key) && !inFocus.has(c.key));
      // In a 'most common' session, growing brings in the next most common cards
      const restOfPool = sessionPickMode === 'frequent'
        ? others.sort((a, b) => compareFrequency(a.noun, b.noun))
        : shuffle(others);
      const toAdd = focusLeftovers.concat(restOfPool).slice(0, newSize - deck.length);
      deck = deck.concat(shuffle(toAdd)); // new cards arrive in random play order
    } else {
      return; // beyond the pool
    }
    afterResize(currentKey);
  }

  // Two groups: the missed (or Focus) cards, and the rest of the pool
  function handleGameResizeParts(changed) {
    const focusEl = document.getElementById('game-trim-focus'), restEl = document.getElementById('game-trim-rest');
    if (!focusEl || !sessionPool) return;
    let fWant = +focusEl.value, rWant = restEl ? +restEl.value : 0;
    if (fWant + rWant === 0) {   // never an empty deck: put back one card in the group just moved
      if (changed === restEl) rWant = 1; else fWant = 1;
    }
    resizeDeckParts(fWant, rWant);
  }
  function resizeDeckParts(fWant, rWant) {
    const focusKeys = new Set(sessionMaxDeck.map(c => c.key));
    const isFocus = c => focusKeys.has(c.key);
    const currentKey = deck[index] && deck[index].key;
    // Shrink each group from the end of the play order, never touching played cards
    const drop = new Set();
    for (const [want, inGroup] of [[fWant, isFocus], [rWant, c => !isFocus(c)]]) {
      const positions = deck.map((c, i) => i).filter(i => inGroup(deck[i]));
      for (let k = positions.length - 1; k >= Math.max(want, 0) && positions[k] >= index; k--) drop.add(positions[k]);
    }
    const kept = deck.filter((c, i) => !drop.has(i));
    // Grow each group from its unplayed cards
    const inDeck = new Set(kept.map(c => c.key));
    const haveF = kept.filter(isFocus).length, haveR = kept.length - haveF;
    const addF = shuffle(sessionMaxDeck.filter(c => !inDeck.has(c.key))).slice(0, Math.max(0, fWant - haveF));
    const others = sessionPool.filter(c => !inDeck.has(c.key) && !isFocus(c));
    const ordered = sessionPickMode === 'frequent' ? others.sort((a, b) => compareFrequency(a.noun, b.noun)) : shuffle(others);
    const addR = ordered.slice(0, Math.max(0, rWant - haveR));
    deck = kept.concat(shuffle(addF.concat(addR)));
    afterResize(currentKey);
  }

  // Shuffle a round's cards; in Preposizioni each item's cards stay together, in their
  // order (del libro, then dei libri), and a deck cut to size never splits a pair
  function shuffleDeck(cards) {
    if (SUBJECTS[subject].inOrder) return [...cards];   // a scene's lines, in the scene's order
    if (!SUBJECTS[subject].keepPairs) return shuffle(cards);
    const groups = [];
    for (const c of cards) {
      const last = groups[groups.length - 1];
      if (last && last[0].noun === c.noun) last.push(c); else groups.push([c]);
    }
    return shuffle(groups).flat();
  }
  function takeCards(cards, n) {
    let k = Math.min(n, cards.length);
    if (SUBJECTS[subject].keepPairs) while (k > 0 && k < cards.length && cards[k].noun === cards[k - 1].noun) k++;
    return cards.slice(0, k);
  }
  function startGame() {
    if (sessionMaxDeck && sessionMaxDeck.length > 0) {
      // Play again / Reshuffle — replay the current active subset in new order
      deck = shuffleDeck(deck);
    } else {
      // Fresh entry from setup — the pool is the selection (or the whole deck
      // when nothing is selected but a number is set); the number only decides
      // how many of those cards start in play
      if (playableKeys().size === 0) return;
      sessionPool = buildDeck();
      const cap = effectiveDeckSize();
      if (capMode === 'frequent' && cap < sessionPool.length) {
        // The N most common nouns of the selection, played in random order
        const byRank = [...sessionPool].sort((a, b) => compareFrequency(a.noun, b.noun));
        sessionMaxDeck = shuffleDeck(takeCards(byRank, cap));
        sessionPickMode = 'frequent';
      } else {
        sessionMaxDeck = takeCards(shuffleDeck(sessionPool), cap);
        sessionPickMode = 'random';
      }
      sessionFocused = false;
      sessionIsReview = false;
      deck = [...sessionMaxDeck];
    }
    roundMissed = new Map();
    index = 0;
    score = 0;
    streak = 0;
    bestStreak = 0;
    scoreEl.textContent = '0';
    totalEl.textContent = deck.length;
    container.dataset.view = 'game';
    gameArea.innerHTML = cardHTML;
    showGameControls();

    document.getElementById('submit').addEventListener('click', handleSubmit);
    document.getElementById('skip-btn').addEventListener('click', () => handleSubmit(true));
    document.getElementById('mic-btn').addEventListener('click', startListening);

    render();
  }

  function render() {
    if (index >= deck.length) {
      stopListening();
      showComplete();
      return;
    }
    setTimeout(updateMicBtn, 0);   // once this card is drawn
    const natLine = document.getElementById('natural-en');
    if (natLine) { natLine.hidden = true; natLine.innerHTML = ''; }
    mustRetype = false;
    stopListening();
    speakHint('');
    const skipReset = document.getElementById('skip-btn');
    if (skipReset) skipReset.hidden = false;
    const ansReset = document.getElementById('answer');
    if (ansReset) {
      ansReset.classList.remove('retype', 'retype-miss');
      if (ansReset.dataset.normalPlaceholder) { ansReset.placeholder = ansReset.dataset.normalPlaceholder; delete ansReset.dataset.normalPlaceholder; }
    }
    const card = deck[index];
    if (card.subject) setCardContext(card.subject);   // mixed review: this card's section
    const itToEn = direction === 'it-en';
    const promptEl = document.getElementById('prompt');
    const sectionEl = document.getElementById('card-section');
    if (sectionEl) sectionEl.textContent = card.subject ? SUBJECTS[card.subject].title : '';
    const hintEl = document.getElementById('pronoun-hint');
    const metaEl = document.getElementById('verb-meta');
    const ans = document.getElementById('answer');
    if (isVerbSubject()) {
      // As in the verb game: keep each meaning of a two-meaning prompt together,
      // show the verb's meaning and the person only for EN → IT conjugations
      const text = itToEn ? card.italian : card.english;
      promptEl.innerHTML = text.split(' / ').map(m => `<span class="meaning">${escapeHTML(m)}</span>`).join('&nbsp;/ ');
      promptEl.classList.toggle('long', text.length > 20);
      const showPerson = !!card.person && !itToEn;
      metaEl.textContent = showPerson ? card.verbMeaning : '';
      metaEl.style.display = showPerson ? '' : 'none';
      hintEl.textContent = showPerson ? card.pronounLabel : '';
      hintEl.style.display = showPerson ? '' : 'none';
      ans.placeholder = itToEn ? 'type the english meaning…'
        : (card.person ? 'type the italian conjugation…' : 'type the italian infinitive…');
    } else if (isPhraseSubject()) {
      const shown = itToEn ? card.italian : card.english;
      promptEl.textContent = shown;
      promptEl.classList.toggle('long', shown.length > 18);
      // A word-for-word sentence that reads oddly: its natural English underneath
      // (English → Italian only — the other ways round it would give the answer away)
      const natEl = document.getElementById('natural-en');
      const showNatural = !!card.natural && direction === 'en-it';
      natEl.hidden = !showNatural;
      natEl.innerHTML = showNatural ? `<span class="natural-label">in natural English</span> ${escapeHTML(card.natural)}` : '';
      metaEl.style.display = 'none';
      hintEl.style.display = '';
      hintEl.textContent = itToEn ? '→ in inglese' : (card.mech ? '+ preposizione articolata' : '+ frase');   // a fusion drill: join them
      ans.placeholder = itToEn ? 'type the english meaning…' : 'type the italian phrase…';
    } else if (isAdjSubject()) {
      // As in the adjectives game: the agreement type sits above the English, and
      // in All forms mode the hint names the gender and number to give
      promptEl.textContent = itToEn ? card.italian : card.english;
      promptEl.classList.remove('long');
      metaEl.textContent = itToEn ? '' : typeLabel(card.type);
      metaEl.style.display = itToEn ? 'none' : '';
      hintEl.style.display = '';
      hintEl.textContent = itToEn ? '→ in inglese' : (card.cue || '+ aggettivo');
      ans.placeholder = itToEn ? 'type the english meaning…' : 'type the italian adjective…';
    } else {
      promptEl.textContent = itToEn ? card.italian : card.english;
      promptEl.classList.remove('long');
      metaEl.style.display = 'none';
      hintEl.style.display = '';
      hintEl.textContent = itToEn ? '→ in inglese' : '+ articolo';
      ans.placeholder = itToEn ? 'type the english meaning…' : 'type the italian with article…';
    }
    document.getElementById('cardnum').textContent = String(index + 1).padStart(3, '0');

    // Hearing it: with an Italian prompt you can listen before answering; in
    // listening mode the Italian is only heard, never shown, until you answer
    const cardSpeak = document.getElementById('card-speak');
    cardSpeak.hidden = !(direction === 'it-en' && chosenVoice());
    cardSpeak.onclick = () => { speak(sayText(card)); ans.focus(); };
    if (direction === 'listen') {
      promptEl.classList.remove('long');
      promptEl.innerHTML = '<button type="button" class="listen-btn" id="listen-btn" aria-label="Play the Italian again"><span class="listen-icon">🔊</span><span class="listen-label">ascolta di nuovo</span></button>';
      metaEl.style.display = 'none';
      hintEl.style.display = '';
      hintEl.textContent = 'type what you hear';
      ans.placeholder = 'type the italian you hear…';
      document.getElementById('listen-btn').addEventListener('click', () => { speak(sayText(card)); ans.focus(); });
      if (!speak(sayText(card))) hintEl.textContent = 'no Italian voice found — see the voice settings on the setup screen';
    }

    const sub = document.getElementById('submit');
    const fb = document.getElementById('feedback');
    ans.value = '';
    ans.disabled = false;
    sub.textContent = 'Controlla';
    fb.className = 'feedback hidden';
    fb.innerHTML = '';
    answered = false;

    currentEl.textContent = index + 1;
    progressEl.style.width = `${(index / deck.length) * 100}%`;

    document.getElementById('streak-display').textContent = streak >= 3 ? `🔥 streak ${streak}` : '';

    setTimeout(() => ans.focus(), 30);
  }

  // ===== Parla: say the answer =====
  // Wherever the answer is Italian (English → Italian; Listen, where repeating what you
  // hear is shadowing), and for the retype after a miss. The recogniser returns several
  // guesses: if any is right, it's a right answer (checked as leniently as typing). If
  // none is, nothing is marked — what was heard stays in the box, to say again, fix, or
  // check. Only where the browser can listen (Chrome, Edge, Safari).
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let rec = null, listening = false, micBlocked = false, saidAloud = false;
  function micAvailable() {
    return !!SpeechRec && !micBlocked && direction !== 'it-en' && container.dataset.view === 'game' && !!deck[index] && (!answered || mustRetype);
  }
  function updateMicBtn() {
    const b = document.getElementById('mic-btn');
    if (!b) return;
    b.hidden = !micAvailable();
    b.classList.toggle('listening', listening);
    b.setAttribute('aria-pressed', String(listening));
    b.setAttribute('aria-label', listening ? 'Listening — press to stop' : 'Parla — say the answer in Italian');
    const wrap = document.getElementById('answer-wrap');
    if (wrap) wrap.classList.toggle('has-mic', !b.hidden);
    const help = document.getElementById('mic-help');
    if (help) help.hidden = !SpeechRec || micBlocked || direction === 'it-en';
  }
  function speakHint(text) {
    const h = document.getElementById('speak-hint');
    if (h) h.textContent = text || '';
  }
  // While listening the page itself is Italian: a recogniser that ignores its own lang
  // falls back to the page's (the page is otherwise English)
  let pageLang = null;
  function italianPage(on) {
    const html = document.documentElement;
    if (on) { if (pageLang === null) pageLang = html.lang; html.lang = 'it-IT'; }
    else if (pageLang !== null) { html.lang = pageLang; pageLang = null; }
  }
  function stopListening() {
    italianPage(false);
    if (listening && /^Listening/.test((document.getElementById('speak-hint') || {}).textContent || '')) speakHint('');
    if (rec) {
      rec.onresult = rec.onerror = rec.onend = null;
      try { rec.abort(); } catch (e) { /* already stopped */ }
      rec = null;
    }
    listening = false;
    const ans = document.getElementById('answer');
    if (ans) ans.classList.remove('interim');
    updateMicBtn();
  }
  // Chrome can now recognise speech on the device, from downloaded language packs, and
  // left to choose it may use a pack in the wrong language (English). So where the
  // browser can say, Parla asks for Italian on the device; if Italian isn't installed
  // but can be, it starts the download and listens online, in Italian, meanwhile.
  let localItalian = null;   // null until asked: 'available' | 'downloadable' | 'downloading' | 'unavailable'
  async function askLocalItalian() {
    if (!SpeechRec || typeof SpeechRec.available !== 'function') return 'unavailable';
    try { return await SpeechRec.available({ langs: ['it-IT'], processLocally: true }); } catch (e) { return 'unavailable'; }
  }
  let askingLocal = false;
  async function startListening() {
    if (listening) { stopListening(); return; }   // pressed again: stop
    if (!micAvailable() || askingLocal) return;   // (a second press while the first is still asking)
    if (localItalian === null) {
      askingLocal = true;
      try { localItalian = await askLocalItalian(); } finally { askingLocal = false; }
      if (localItalian === 'downloadable' && typeof SpeechRec.install === 'function') {
        localItalian = 'downloading';   // a one-off, in the background; online until it's done
        SpeechRec.install({ langs: ['it-IT'], processLocally: true }).then(done => { localItalian = done ? 'available' : 'unavailable'; }, () => { localItalian = 'unavailable'; });
      }
      if (!micAvailable() || listening) return;   // the card moved on while we asked
    }
    listenNow(localItalian === 'available');
  }
  function listenNow(onDevice) {
    try { if (window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.cancel(); } catch (e) { /* no speech */ }   // never hear itself
    const ans = document.getElementById('answer');
    const me = rec = new SpeechRec();   // each listening acts only on its own events (a late end can't stop the next)
    rec.lang = 'it-IT';
    if (onDevice && 'processLocally' in rec) rec.processLocally = true;   // Italian, on the device
    try { console.info(`[Parla] listening in it-IT, ${rec.processLocally === true ? 'on the device' : 'online'} (Italian on the device: ${localItalian})`); } catch (e) { /* no console */ }
    rec.interimResults = true;
    rec.maxAlternatives = 5;
    rec.continuous = false;
    listening = true;
    italianPage(true);
    speakHint('Listening — say it in Italian…');
    updateMicBtn();
    rec.onresult = e => {
      if (rec !== me) return;
      const res = e.results[e.results.length - 1];
      const alts = Array.from({ length: res.length }, (_, k) => String(res[k].transcript || '').trim()).filter(Boolean);
      if (!res.isFinal) { if (alts[0]) { ans.value = alts[0]; ans.classList.add('interim'); speakHint(''); } return; }
      ans.classList.remove('interim');
      rec = null;          // a final result ends this listening
      listening = false;
      italianPage(false);
      updateMicBtn();
      heard(alts);
    };
    rec.onerror = e => {
      if (rec !== me) return;
      rec = null;
      listening = false;
      italianPage(false);
      if (onDevice && (e.error === 'language-not-supported' || e.error === 'service-not-allowed')) {
        localItalian = 'unavailable';
        listenNow(false);
        return;
      }
      ans.classList.remove('interim');
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        micBlocked = true;
        speakHint('The microphone is blocked — allow it for this site to use Parla.');
      } else if (e.error === 'no-speech') speakHint("Didn't catch anything — press Parla and try again.");
      else if (e.error === 'network') speakHint('Listening needs an internet connection.');
      else if (e.error !== 'aborted') speakHint("Couldn't listen just now — try again.");
      updateMicBtn();
    };
    rec.onend = () => {
      if (rec !== me) return;
      rec = null;
      listening = false;
      italianPage(false);
      ans.classList.remove('interim');
      if (/^Listening/.test(document.getElementById('speak-hint').textContent)) speakHint('');
      updateMicBtn();
    };
    try { rec.start(); } catch (e) { listening = false; rec = null; italianPage(false); updateMicBtn(); }
  }
  function heard(alts) {
    const ans = document.getElementById('answer'), card = deck[index];
    if (!card) return;
    if (!alts.length) { speakHint("Didn't catch anything — press Parla and try again."); return; }
    const right = alts.find(a => checkCard(a, card, direction === 'it-en').correct);
    if (right) {
      ans.value = right;
      speakHint('');
      saidAloud = true;
      handleSubmit();   // a right answer (or, in a retype, on to the next card)
      saidAloud = false;
      return;
    }
    ans.value = alts[0];
    if (soundsEnglish(alts)) speakHint(`Heard “${alts[0]}” — that came back in English: your browser is listening in English, not Italian. ${isSafari()
      ? 'In Safari, add Italian under System Settings → Keyboard → Dictation → Languages, then reload.'
      : "In Chrome, add Italian under Settings → Languages (so Chrome can listen in Italian on your computer), then reload."}`);
    else speakHint(`Heard “${alts[0]}” — say it again, fix it, or press ${mustRetype ? 'Riscrivi' : 'Controlla'} to check it.`);
    ans.focus();
  }
  // Not one word the Italian deck knows, in any guess, and an everyday English word among
  // them: the recogniser is listening in English (heard "Young John" for il giorno)
  const ENGLISH_TELLS = new Set(['the', 'and', 'of', 'is', 'are', 'you', 'your', 'i', 'my', 'he', 'she', 'we', 'they', 'it', 'this', 'that', 'what', 'with', 'for', 'at', 'be',
    'was', 'have', 'has', 'do', 'does', 'not', 'young', 'john', 'girl', 'boy', 'go', 'yes', 'hello', 'hi', 'oh', 'okay', 'ok', 'all', 'can', 'just', 'like', 'know', 'me', 'him', 'her']);
  const isSafari = () => /Safari\//.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Edg|Android/.test(navigator.userAgent);
  function soundsEnglish(alts) {
    const words = alts.flatMap(a => a.toLowerCase().split(/[^a-zà-ÿ']+/).filter(Boolean));
    const italian = alts.some(a => sentenceSegments(a).some(sg => sg.ref));
    return !italian && words.some(w => ENGLISH_TELLS.has(w));
  }

  // The one checker, for an answer and for its retype (it records nothing)
  function checkCard(raw, card, itToEn) {
    return isVerbSubject() ? checkVerbAnswer(raw, card, itToEn)
      : isAdjSubject() ? checkAdjAnswer(raw, card, itToEn)
      : isPhraseSubject() ? checkPhraseAnswer(raw, card, itToEn)
      : (itToEn ? checkEnglish(raw, card) : checkAnswer(raw, card));
  }
  // After a miss, the right answer has to be typed before the next card — practice
  // only: it changes neither the score nor the card's history or review schedule
  let mustRetype = false;
  function retypeCheck() {
    const ans = document.getElementById('answer'), hint = document.getElementById('retype-hint');
    if (ans.value.trim() && checkCard(ans.value, deck[index], direction === 'it-en').correct) {
      mustRetype = false;
      index++;
      render();
      return;
    }
    ans.classList.remove('retype-miss');
    void ans.offsetWidth;   // restart the shake
    ans.classList.add('retype-miss');
    if (hint) hint.textContent = ans.value.trim() ? 'Not quite — type it as shown, then Enter.' : 'Type the answer to go on.';
    ans.focus();
  }
  function endRetype() {   // the card turned out right (I was right — count it)
    mustRetype = false;
    const ans = document.getElementById('answer'), hint = document.getElementById('retype-hint');
    if (ans) { ans.disabled = true; ans.classList.remove('retype', 'retype-miss'); }
    if (hint) hint.remove();
    document.getElementById('submit').textContent = 'Avanti →';
    updateMicBtn();
  }

  // Nothing typed — most often an Enter by accident: the box shakes and asks for an
  // answer, and nothing is counted (an empty answer is never marked wrong)
  function askForAnswer(ans) {
    if (!ans.dataset.normalPlaceholder) ans.dataset.normalPlaceholder = ans.placeholder;
    ans.placeholder = 'type your answer first…';
    ans.classList.remove('retype-miss');
    void ans.offsetWidth;   // restart the shake
    ans.classList.add('retype-miss');
    ans.focus();
  }

  // What a skip shows, before the answer is typed out
  function skipMessage(card, itToEn) {
    if (itToEn) return `Skipped — <strong>${card.italian}</strong> means <strong>${card.english}</strong>`;
    if (isVerbSubject()) return `Skipped — the answer is <strong>${card.italian}</strong> <span class="pron">${card.pron}</span>`;
    if (SUBJECTS[subject].sentences) return `Skipped — the ${SUBJECTS[subject].itemWord} is <strong>${card.italian}</strong>`;
    if (isPhraseSubject()) return `Skipped — the phrase is <strong>${card.italian}</strong>`;
    if (isAdjSubject()) return `Skipped — the answer is <strong>${card.italian}</strong>${card.cue ? ` (${card.cue})` : ''}`;
    return `Skipped — the answer is <strong>${card.italian}</strong>`;
  }

  // skip === true only from Salta (as a click handler this gets the click event)
  function handleSubmit(skip) {
    const skipped = skip === true;
    if (skipped && answered) return;
    if (answered && mustRetype) { retypeCheck(); return; }
    if (answered) { index++; render(); return; }
    if (!skipped && !document.getElementById('answer').value.trim()) { askForAnswer(document.getElementById('answer')); return; }

    const ans = document.getElementById('answer');
    const sub = document.getElementById('submit');
    const fb = document.getElementById('feedback');
    const card = deck[index];
    const raw = skipped ? '' : ans.value;
    const itToEn = direction === 'it-en';
    const result = skipped ? { correct: false } : checkCard(raw, card, itToEn);
    const skipBtn = document.getElementById('skip-btn');
    if (skipBtn) skipBtn.hidden = true;   // until the next card
    const prevStreak = streak;

    answered = true;
    ans.disabled = true;
    sub.textContent = 'Avanti →';

    // A typed answer or a skip (Salta) — both count; an empty Enter never gets here
    recordAnswer(card.noun, result.correct);
    if (result.correct) roundMissed.delete(card.key); else roundMissed.set(card.key, card);

    // Teaching notes now show on every answer, right or wrong, so the history
    // behind a word isn't missed when it keeps being answered correctly
    const noteHTML = card.note ? `<div class="feedback-note">${card.note}</div>` : '';
    const assocHTML = `<div class="assoc" id="assoc"></div>`;
    // In listening mode the meaning is new information, so show it with the answer
    const meaningHTML = direction === 'listen' ? `<span class="fb-meaning">${escapeHTML(card.english)}</span>` : '';

    if (result.correct) {
      score++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      scoreEl.textContent = score;
      fb.className = 'feedback correct';
      const pronHTML = isVerbSubject() ? ` <span class="pron">${card.pron}</span>` : '';
      // Adjectives keep their own "Bravo" and echo the form you typed (piccolo or piccola)
      const shown = isAdjSubject() && !itToEn ? result.match : (itToEn ? card.english : card.italian);
      fb.innerHTML = `<div class="feedback-body">${isAdjSubject() ? '✓ Bravo' : '✓ Corretto'} — <strong>${shown}</strong>${pronHTML}${speakBtnHTML()}${meaningHTML}${noteHTML}${assocHTML}</div>`;
    } else {
      streak = 0;
      fb.className = 'feedback incorrect';
      let main;
      if (skipped) {
        main = skipMessage(card, itToEn);
      } else if (isVerbSubject()) {
        const answer = itToEn ? card.english : card.italian;
        const pron = ` <span class="pron">${card.pron}</span>`;
        if (result.reason === 'wrong-pronoun') main = `✗ Wrong pronoun — should be <strong>${card.pronounLabel} ${answer}</strong>${pron}`;
        else main = `✗ Not quite — the answer is <strong>${answer}</strong>${pron}`;
      } else if (SUBJECTS[subject].sentences && !itToEn) {
        main = `✗ Not quite — the ${SUBJECTS[subject].itemWord} is <strong>${card.italian}</strong>${sentenceDiffHTML(raw, card)}`;
      } else if (isPhraseSubject() && !itToEn) {
        main = `✗ Not quite — the phrase is <strong>${card.italian}</strong>`;
      } else if (isAdjSubject() && !itToEn) {
        const cue = card.cue ? ` (${card.cue})` : '';
        main = `✗ Not quite — the answer is <strong>${card.italian}</strong>${cue}`;
      } else if (itToEn) {
        main = `✗ Not quite — <strong>${card.italian}</strong> means <strong>${card.english}</strong>`;
      } else if (result.reason === 'missing-article') {
        main = `✗ Don't forget the article — <strong>${card.italian}</strong>`;
      } else if (result.reason === 'wrong-article') {
        const genderWord = card.gender === 'f' ? 'feminine' : 'masculine';
        main = `✗ Wrong article — <strong>${card.noun}</strong> is ${genderWord}: <strong>${card.italian}</strong>`;
      } else {
        main = `✗ Not quite — the answer is <strong>${card.italian}</strong>`;
      }
      // English has many near-synonyms (woods/forest), so in IT→EN mode a typed
      // answer can be overruled by the player
      const showOverride = itToEn && !skipped;   // a skip wasn't an answer to overrule
      const overrideHTML = showOverride
        ? `<button type="button" class="ghost override-btn" id="override-btn">✓ I was right — count it</button>`
        : '';
      fb.innerHTML = `<div class="feedback-body">${main}${speakBtnHTML()}${meaningHTML}${overrideHTML}${noteHTML}${assocHTML}</div>`;
      if (showOverride) {
        document.getElementById('override-btn').addEventListener('click', () => acceptOverride(card, prevStreak));
      }
    }
    renderAssociation(card);
    wireSpeakBtn(card);
    if (audioPrefs.auto) speak(sayText(card));
    if (result.correct && saidAloud) fb.querySelector('.feedback-body').insertAdjacentHTML('afterbegin', '<div class="said-aloud">🎙 Said aloud</div>');
    if (!result.correct) {   // type it right before the next card
      mustRetype = true;
      ans.disabled = false;
      ans.value = '';
      if (!ans.dataset.normalPlaceholder) ans.dataset.normalPlaceholder = ans.placeholder;
      ans.placeholder = 'now type the right answer…';
      ans.classList.add('retype');
      sub.textContent = 'Riscrivi →';
      fb.querySelector('.feedback-body').insertAdjacentHTML('afterbegin', `<div class="retype-hint" id="retype-hint">Type it above to go on — it won't change your score.</div>`);
      setTimeout(() => ans.focus(), 30);
    }
    speakHint('');
    updateMicBtn();
  }

  // ===== Association display & inline editor (inside the feedback box) =====
  let assocCard = null;

  function renderAssociation(card, editing = false) {
    const box = document.getElementById('assoc');
    if (!box) return;
    assocCard = card;
    const text = associations[card.noun] || '';
    if (editing) {
      box.innerHTML = `
        <span class="assoc-label">Associazione</span>
        <div class="assoc-edit-row">
          <input type="text" id="assoc-input" maxlength="200" autocomplete="off" spellcheck="false" placeholder="a word, image or phrase that helps you remember…">
          <button type="button" class="ghost" id="assoc-save">Save</button>
          <button type="button" class="ghost" id="assoc-cancel">Cancel</button>
        </div>`;
      const input = document.getElementById('assoc-input');
      input.value = text;
      document.getElementById('assoc-save').addEventListener('click', saveAssociation);
      document.getElementById('assoc-cancel').addEventListener('click', cancelAssociationEdit);
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else if (text) {
      box.innerHTML = `<span class="assoc-label">Associazione</span><span class="assoc-text">${escapeHTML(text)}</span><button type="button" class="ghost assoc-action" id="assoc-edit">edit</button>`;
      document.getElementById('assoc-edit').addEventListener('click', () => renderAssociation(card, true));
    } else {
      box.innerHTML = `<button type="button" class="ghost assoc-action" id="assoc-edit">+ Add a word association</button>`;
      document.getElementById('assoc-edit').addEventListener('click', () => renderAssociation(card, true));
    }
  }

  function saveAssociation() {
    const input = document.getElementById('assoc-input');
    if (!input || !assocCard) return;
    const text = input.value.trim();
    if (text) associations[assocCard.noun] = text;
    else delete associations[assocCard.noun]; // saving an empty box removes it
    saveAssociations();
    renderAssociation(assocCard);
    focusSubmit();
  }

  function cancelAssociationEdit() {
    if (assocCard) renderAssociation(assocCard);
    focusSubmit();
  }

  // After editing, put focus back on the submit button so Enter moves on
  function focusSubmit() {
    const sub = document.getElementById('submit');
    if (sub) sub.focus();
  }

  // Player overrules a wrong IT→EN verdict: undo the logged error, restore the
  // streak and score as if the answer had been accepted
  function acceptOverride(card, prevStreak) {
    roundMissed.delete(card.key);
    if (srsUndoLast(subject, direction, card.noun)) srsAnswer(subject, direction, card.noun, true);
    const s = stats[card.noun];
    if (s && s.wrong > 0) { s.wrong -= 1; saveStats(); }
    score++;
    streak = prevStreak + 1;
    bestStreak = Math.max(bestStreak, streak);
    scoreEl.textContent = score;
    const fb = document.getElementById('feedback');
    fb.className = 'feedback correct';
    const noteHTML = card.note ? `<div class="feedback-note">${card.note}</div>` : '';
    const pronHTML = isVerbSubject() ? ` <span class="pron">${card.pron}</span>` : '';
    fb.innerHTML = `<div class="feedback-body">✓ Counted as correct — <strong>${card.english}</strong>${pronHTML}${speakBtnHTML()}${noteHTML}<div class="assoc" id="assoc"></div></div>`;
    renderAssociation(card);
    wireSpeakBtn(card);
    endRetype();
    focusSubmit(); // Enter now moves on
  }

  // Replay just the cards missed in the round that finished. Like a mid-game Focus,
  // it's a filter on the session: the pool stays the full original set (so Deck size
  // can grow back out and Focus lists everything, missed cards ticked), and the
  // missed cards become the set in play. Going back to setup ends it.
  function practiseMissed(cards) {
    if (!cards || !cards.length) return;
    sessionMaxDeck = cards.slice();   // these are the pool's own card objects
    sessionFocused = true;
    sessionIsReview = true;
    deck = cards.slice();
    startGame();   // the session is set, so this shuffles these cards and starts
  }

  // Switch translation direction: same deck, reshuffled, from card one
  function setDirection(dir) {
    if (dir === direction) return;
    direction = dir;
    stats = loadStats();
    startGame();
  }

  function showComplete() {
    progressEl.style.width = '100%';
    const pct = Math.round((score / deck.length) * 100);
    let msg;
    if (direction === 'listen') {
      if (pct >= 95)      msg = 'Magnifico! Your ear for Italian is sharp.';
      else if (pct >= 80) msg = 'Bravissimo! You\'re hearing it clearly.';
      else if (pct >= 65) msg = 'Bene! Listen again and the rest will click.';
      else if (pct >= 50) msg = 'Halfway there. Listening gets easier with every round.';
      else                msg = 'Every round counts. Play it again — orecchio allenato!';
    }
    else if (direction === 'it-en') {
      if (pct >= 95) msg = 'Magnifico! You recognise nearly every one of these.';
      else if (pct >= 80) msg = 'Bravissimo! These meanings are clearly sticking.';
      else if (pct >= 65) msg = 'Bene! Solid recognition — another pass will lock it in.';
      else if (pct >= 50) msg = 'Halfway there. Recognition comes with repetition — keep going.';
      else msg = 'Every round counts. Reshuffle and go again — fluency is built one card at a time.';
    }
    else if (isPhraseSubject()) {
      if (pct >= 95)      msg = 'Perfetto! You could hold your own in any bar in Italy.';
      else if (pct >= 80) msg = 'Bravissimo! These are becoming second nature.';
      else if (pct >= 65) msg = 'Bene! Say them out loud as you go — another round will fix them.';
      else if (pct >= 50) msg = 'Halfway there. Phrases stick fastest when you use them for real.';
      else                msg = 'Every round counts. Reshuffle and go again — dai!';
    }
    else if (isAdjSubject()) {
      if (pct >= 95)      msg = 'Magnifico! Near-perfect mastery of these adjectives.';
      else if (pct >= 80) msg = 'Bravissimo! These words are clearly sticking.';
      else if (pct >= 65) msg = 'Bene! Solid foundation — another pass will lock it in.';
      else if (pct >= 50) msg = 'Halfway there. The patterns reveal themselves with repetition.';
      else                msg = 'Every round counts. Reshuffle and go again — fluency is built one card at a time.';
    }
    else if (isVerbSubject()) {
      if (pct >= 95) msg = `Magnifico! Near-perfect mastery of these ${SUBJECTS[subject].doneWord}.`;
      else if (pct >= 80) msg = 'Bravissimo! These verbs are clearly sticking.';
      else if (pct >= 65) msg = 'Bene! Solid foundation — another pass will lock it in.';
      else if (pct >= 50) msg = 'Halfway there. The patterns reveal themselves with repetition.';
      else msg = 'Every round counts. Reshuffle and go again — fluency is built one card at a time.';
    }
    else if (pct >= 95) msg = 'Magnifico! Near-perfect mastery of these articles.';
    else if (pct >= 80) msg = 'Bravissimo! The genders are clearly sticking.';
    else if (pct >= 65) msg = 'Bene! Solid foundation — another pass will lock it in.';
    else if (pct >= 50) msg = 'Halfway there. Italian gender comes with repetition — keep going.';
    else msg = 'Every round counts. Reshuffle and go again — fluency is built one card at a time.';

    // The cards missed this round, in the order they came up
    const missed = deck.filter(c => roundMissed.has(c.key));
    if (sessionIsReview && missed.length === 0) msg = 'Tutto giusto! Every card you missed is now right.';
    if (reviewMode && !sessionIsReview) {
      msg = missed.length === 0 ? 'Fatto! Every card in today\'s review was right — they\'ll be back in a few days.'
        : 'Fatto! The ones you missed will be back tomorrow; the rest are scheduled further out.';
    }
    const missedLabel = c => c.person ? `${c.pronounLabel.split(' / ')[0]} ${c.italian}` : c.italian;
    const MAX_SHOWN = 12;
    const missedHTML = missed.length ? `
        <div class="missed">
          <div class="missed-head">Missed this round</div>
          <div class="missed-list">${missed.slice(0, MAX_SHOWN).map(c => `<span class="missed-item">${escapeHTML(missedLabel(c))}</span>`).join('')}${missed.length > MAX_SHOWN ? `<span class="missed-more">+ ${missed.length - MAX_SHOWN} more</span>` : ''}</div>
        </div>` : '';
    const practiseLabel = missed.length === 1 ? 'the one I missed' : `the ${missed.length} I missed`;

    container.dataset.view = 'complete';
    gameArea.innerHTML = `
      <div class="card complete">
        <div class="badge">${sessionIsReview || reviewMode ? 'FINE DEL RIPASSO' : 'FINE DELLA SESSIONE'}</div>
        <h2>${score}<span style="color: var(--ink-faded); font-weight: 400;">/${deck.length}</span></h2>
        <div class="pct">${pct}% &nbsp;·&nbsp; best streak ${bestStreak}</div>
        <p class="msg">${msg}</p>
        ${missedHTML}
        <div class="complete-actions">
          <button type="button" class="submit" id="play-again">↻ Play ${missed.length ? `all ${deck.length} ` : ''}again</button>
          ${missed.length ? `<button type="button" class="submit secondary" id="practise-missed">↻ Practise ${practiseLabel}</button>` : ''}
          <button type="button" class="ghost" id="back-to-setup">${reviewMode ? '← Back to setup' : `← Change ${SUBJECTS[subject].itemWords}`}</button>
        </div>
      </div>
    `;
    controlsEl.innerHTML = '';
    if (missed.length) document.getElementById('practise-missed').addEventListener('click', () => practiseMissed(missed));
    document.getElementById('play-again').addEventListener('click', startGame);
    document.getElementById('back-to-setup').addEventListener('click', showSetup);
  }

  // Global Enter handler — works whether input is focused, disabled, or focus is elsewhere
  document.addEventListener('keydown', (e) => {
    // While typing an association, Enter saves it and Escape cancels —
    // neither should submit or advance the card
    if (e.target && e.target.id === 'assoc-input') {
      if (e.key === 'Enter') { e.preventDefault(); saveAssociation(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancelAssociationEdit(); }
      return;
    }
    // While the focus modal is open it owns the keyboard: Escape closes it,
    // Enter in the top-N box applies it, and Enter never submits the card behind
    const modal = document.getElementById('focus-modal');
    if (modal && !modal.hidden) {
      if (e.key === 'Escape') modal.hidden = true;
      else if (e.key === 'Enter' && e.target && e.target.id === 'focus-top-input') {
        e.preventDefault();
        applyFocusTop();
      }
      return;
    }
    const chart = document.getElementById('chart-overlay');
    if (chart && !chart.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeChart(); }
      return;
    }
    if (container.dataset.view === 'passive') return;   // A spasso: nothing to submit
    if (e.key === 'Enter' && e.shiftKey && container.dataset.view === 'game' && (listening || micAvailable())) {   // ⇧ Enter: say it (again to stop)
      e.preventDefault();
      startListening();
      return;
    }
    if (e.key !== 'Enter') return;
    if (container.dataset.view === 'complete') {   // the summary: Enter plays the round again, like its main button
      if (e.target && e.target.closest && e.target.closest('button')) return;   // a focused button keeps its Enter
      e.preventDefault();
      const again = document.getElementById('play-again');
      if (again) again.click();
      return;
    }
    if (container.dataset.view !== 'game') return;
    // If focus is on the deck-size select, let the browser handle it normally
    if (e.target && e.target.closest && e.target.closest('.game-trim')) return;
    e.preventDefault();
    handleSubmit();
  });

  // ===== Hand-pick / focus modal — module-scope so both setup and mid-game can use it =====
  let focusChecked = new Set();
  let focusContext = 'setup'; // 'setup' | 'game'

  // Returns the source pool of noun keys for the focus modal, based on context
  function focusSourceKeys() {
    if (focusContext === 'setup') {
      // Nothing selected yet → offer the whole deck to pick from
      return selectedNouns.size ? selectedNouns : new Set(nounData.map(n => n.noun));
    }
    if (focusContext === 'game' && sessionPool) {
      // Mid-game the list offers the whole setup selection, not just the
      // cards currently in play — so you can bring excluded cards back in
      return new Set(sessionPool.map(c => c.noun));
    }
    return new Set();
  }

  function openFocusModal(context) {
    const modal = document.getElementById('focus-modal');
    if (!modal) return;
    focusContext = context;
    const source = focusSourceKeys();
    let defaultSort = 'weakness';
    if (context === 'game') {
      // Pre-check what's in play right now; everything else is available to add
      focusChecked = new Set(deck.map(c => c.noun));
      if (focusChecked.size < source.size) defaultSort = 'checked';
    } else {
      focusChecked = new Set(source); // setup: start with all cards checked
    }
    document.getElementById('focus-search').value = '';
    document.getElementById('focus-top-input').value = '';
    document.getElementById('focus-sort').value = defaultSort;
    populateFocusList();
    modal.hidden = false;
    setTimeout(() => document.getElementById('focus-search').focus(), 0);
  }

  function closeFocusModal() {
    const modal = document.getElementById('focus-modal');
    if (modal) modal.hidden = true;
  }

  function populateFocusList() {
    const list = document.getElementById('focus-list');
    if (!list) return;
    const search = document.getElementById('focus-search').value.toLowerCase().trim();
    const sortMode = document.getElementById('focus-sort').value;
    const source = focusSourceKeys();

    let items = nounData.filter(n => source.has(n.noun));

    if (search) {
      items = items.filter(n =>
        n.noun.toLowerCase().includes(search) ||
        n.en.toLowerCase().includes(search) ||
        n.it.toLowerCase().includes(search)
      );
    }

    items.sort((a, b) => {
      if (sortMode === 'alpha') return a.noun.localeCompare(b.noun);
      if (sortMode === 'frequency') return compareFrequency(a.noun, b.noun);
      if (sortMode === 'checked') {
        // Checked cards first, then weakest within each group
        const ca = focusChecked.has(a.noun) ? 0 : 1;
        const cb = focusChecked.has(b.noun) ? 0 : 1;
        if (ca !== cb) return ca - cb;
        return compareWeakness(a.noun, b.noun);
      }
      if (sortMode === 'weakness') return compareWeakness(a.noun, b.noun);
      if (sortMode === 'unseen') {
        const sa = stats[a.noun]?.seen ?? 0;
        const sb = stats[b.noun]?.seen ?? 0;
        if (sa !== sb) return sa - sb;
        return a.noun.localeCompare(b.noun);
      }
      return 0;
    });

    if (items.length === 0) {
      const msg = source.size === 0
        ? (focusContext === 'setup'
            ? 'Nothing selected yet. Close this and pick a theme or click Select all first.'
            : 'No cards available in this game.')
        : `No matches for "${search}".`;
      list.innerHTML = `<div class="focus-empty">${msg}</div>`;
    } else {
      list.innerHTML = items.map(n => {
        const stat = stats[n.noun] || { seen: 0, wrong: 0 };
        let statText;
        if (stat.seen === 0) statText = 'mai visto';
        else if (stat.wrong === 0) statText = `${stat.seen} ✓`;
        else statText = `${stat.wrong}/${stat.seen} err · ${Math.round(stat.wrong / stat.seen * 100)}%`;
        const checked = focusChecked.has(n.noun) ? ' checked' : '';
        return `<label class="focus-item"><input type="checkbox" data-noun="${n.noun}"${checked}/><span class="focus-en">${n.en}</span><span class="focus-it">${n.it}</span><span class="focus-rank" title="Frequency rank among the deck's nouns">#${Number.isFinite(rankOf(n.noun)) ? rankOf(n.noun) : '–'}</span><span class="focus-stat">${statText}</span></label>`;
      }).join('');
    }

    updateFocusCount();
  }

  // Check exactly the N most common cards in the modal's pool (selection in
  // setup, session pool in game) and show them in frequency order
  function applyFocusTop() {
    const n = parseInt(document.getElementById('focus-top-input').value, 10);
    if (!Number.isFinite(n) || n <= 0) return;
    const ranked = [...focusSourceKeys()].sort(compareFrequency);
    focusChecked = new Set(ranked.slice(0, n));
    document.getElementById('focus-search').value = '';
    document.getElementById('focus-sort').value = 'frequency';
    populateFocusList();
  }

  function updateFocusCount() {
    const source = focusSourceKeys();
    document.getElementById('focus-count').textContent = focusChecked.size;
    document.getElementById('focus-total').textContent = source.size;
  }

  function applyFocus() {
    if (focusChecked.size === 0) {
      // Refuse to apply an empty selection — that would leave nothing to play
      return;
    }
    if (focusContext === 'setup') {
      selectedNouns = new Set(focusChecked);
      gameArea.querySelectorAll('.verb-chip').forEach(chip => {
        if (selectedNouns.has(chip.dataset.noun)) chip.classList.remove('unselected');
        else chip.classList.add('unselected');
      });
      updateReadout();
    } else if (focusContext === 'game') {
      // Rebuild the game around the picked cards. The pool is left untouched,
      // so excluded cards stay available to Focus and Deck size later.
      // sessionPool already holds render-ready card objects (english/italian/…).
      const pickedCards = sessionPool.filter(c => focusChecked.has(c.noun));
      sessionMaxDeck = pickedCards;
      sessionFocused = true;
      sessionIsReview = false;   // your own pick, no longer just the missed cards
      deck = shuffle(pickedCards);
      index = 0;
      score = 0;
      streak = 0;
      bestStreak = 0;
      scoreEl.textContent = '0';
      totalEl.textContent = deck.length;
      // Reset the input, feedback, and render the first card
      gameArea.innerHTML = cardHTML;
      showGameControls();
      document.getElementById('submit').addEventListener('click', handleSubmit);
    document.getElementById('skip-btn').addEventListener('click', () => handleSubmit(true));
    document.getElementById('mic-btn').addEventListener('click', startListening);
      render();
    }
    closeFocusModal();
  }

  // Inject modal HTML into container once, wire listeners once
  container.insertAdjacentHTML('beforeend', `
    <div class="focus-modal" id="focus-modal" hidden>
      <div class="focus-panel" role="dialog" aria-label="Focus on specific cards">
        <div class="focus-header">
          <h3>Focus on specific cards</h3>
          <button type="button" class="focus-close" id="focus-close" aria-label="Close">✕</button>
        </div>
        <div class="focus-toolbar">
          <input type="search" id="focus-search" placeholder="Search…" autocomplete="off" />
          <select id="focus-sort">
            <option value="checked">Checked first</option>
            <option value="weakness">Weakest first</option>
            <option value="alpha">A–Z</option>
            <option value="unseen">Unseen first</option>
            <option value="frequency">Most common first</option>
          </select>
          <button type="button" class="ghost" id="focus-all-btn">Check all shown</button>
          <button type="button" class="ghost" id="focus-none-btn">Uncheck all shown</button>
          <div class="focus-top">
            ↳ Check only the
            <input type="number" id="focus-top-input" min="1" placeholder="20" inputmode="numeric" autocomplete="off" />
            most common
            <button type="button" class="ghost" id="focus-top-btn">Check</button>
          </div>
        </div>
        <div class="focus-list" id="focus-list"></div>
        <div class="focus-footer">
          <span class="focus-count-label"><strong id="focus-count">0</strong> selected of <span id="focus-total">0</span></span>
          <div class="focus-actions">
            <button type="button" class="ghost" id="focus-cancel">Cancel</button>
            <button type="button" class="submit focus-apply-btn" id="focus-apply">Apply</button>
          </div>
        </div>
      </div>
    </div>
  `);

  document.getElementById('focus-close').addEventListener('click', closeFocusModal);
  document.getElementById('focus-top-btn').addEventListener('click', applyFocusTop);
  document.getElementById('focus-cancel').addEventListener('click', closeFocusModal);
  document.getElementById('focus-apply').addEventListener('click', applyFocus);
  document.getElementById('focus-search').addEventListener('input', populateFocusList);
  document.getElementById('focus-sort').addEventListener('change', populateFocusList);
  document.getElementById('focus-all-btn').addEventListener('click', () => {
    document.querySelectorAll('#focus-list input[type=checkbox]').forEach(cb => {
      focusChecked.add(cb.dataset.noun);
      cb.checked = true;
    });
    updateFocusCount();
  });
  document.getElementById('focus-none-btn').addEventListener('click', () => {
    document.querySelectorAll('#focus-list input[type=checkbox]').forEach(cb => {
      focusChecked.delete(cb.dataset.noun);
      cb.checked = false;
    });
    updateFocusCount();
  });
  document.getElementById('focus-list').addEventListener('change', (e) => {
    const cb = e.target;
    if (cb.type !== 'checkbox' || !cb.dataset.noun) return;
    if (cb.checked) focusChecked.add(cb.dataset.noun);
    else focusChecked.delete(cb.dataset.noun);
    updateFocusCount();
  });
  document.getElementById('focus-modal').addEventListener('click', (e) => {
    if (e.target.id === 'focus-modal') closeFocusModal();
  });

  // Initial mount: reopen whichever subject was used last
  let initialSubject = 'nouns';
  try {
    const saved = localStorage.getItem(SUBJECT_KEY);
    if (SUBJECTS[saved]) initialSubject = saved;
  } catch (e) { /* storage unavailable */ }
  applySubject(initialSubject);
  showSetup();
  syncStart();
</script>
</body>
</html>
