  function rankOf(noun) { return frequencyRank[noun] ?? Infinity; }

  // The setup grid's order: sections with chipOrder 'frequency' (the verbs) show the
  // most common first; the others keep their own grouping. Display order only.
  function gridItems() {
    if (SUBJECTS[subject].chipOrder !== 'frequency') return nounData;
    return nounData.slice().sort((a, b) => rankOf(a.noun) - rankOf(b.noun));
  }
  function compareFrequency(a, b) { return (rankOf(a) - rankOf(b)) || a.localeCompare(b); }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Normalize: lowercase, strip accents, turn apostrophes into spaces (so "l'amico"
  // and "l amico" both compare equal), collapse whitespace.
  function normalize(s) {
    return s.toLowerCase().trim()
      .replace(/[àáâã]/g, 'a')
      .replace(/[èéêë]/g, 'e')
      .replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o')
      .replace(/[ùúûü]/g, 'u')
      .replace(/[`'´’]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Italian definite articles (singular + plural — covers all the wrong guesses
  // a learner might plausibly type). After normalize() the apostrophe in "l'"
  // is gone, so the bare "l" form covers it.
  const ARTICLES = ["il", "lo", "la", "l", "i", "gli", "le", "un", "uno", "una"];

  // Returns { correct, reason? } where reason is 'missing-article' or 'wrong-article'
  function checkAnswer(rawGuess, card) {
    const guess = normalize(rawGuess);
    const correct = normalize(card.italian);
    const noun = normalize(card.noun);

    if (guess === '') return { correct: false };
    if (guess === correct) return { correct: true };
    if (guess === noun) return { correct: false, reason: 'missing-article' };

    const parts = guess.split(' ');
    if (parts.length === 2 && ARTICLES.includes(parts[0]) && parts[1] === noun) {
      return { correct: false, reason: 'wrong-article' };
    }
    return { correct: false };
  }

  // ===== Italian → English checking =====
  // Lenient on purpose: "the/a/an" is optional, bracketed qualifiers are ignored,
  // each slash-separated meaning counts ("the rock/cliff" accepts rock or cliff),
  // and punctuation, hyphens and spacing don't matter (band-aid = band aid = bandaid).
  function englishCore(s) {
    return normalize(s)
      .replace(/\([^)]*\)/g, ' ')
      .replace(/[^a-z0-9\/ ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/^(the|a|an) /, '');
  }

  function compactEnglish(s) {
    return s.replace(/[\s\/]/g, '');
  }

  function checkEnglish(rawGuess, card) {
    const guess = englishCore(rawGuess);
    if (guess === '') return { correct: false };
    const core = englishCore(card.english);
    const alternatives = [core, ...core.split('/').map(p => p.trim().replace(/^(the|a|an) /, ''))];
    const g = compactEnglish(guess);
    return { correct: alternatives.some(a => a && compactEnglish(a) === g) };
  }

  // ===== Verb answer checking and pronunciation (ported from the verb game) =====
  // Same logic as verbi-regolari.html; only normalize/checkAnswer were renamed so
  // they don't clash with the noun versions.
  function normalizeVerb(s) {
    return s.toLowerCase().trim()
      .replace(/[àáâã]/g, 'a')
      .replace(/[èéêë]/g, 'e')
      .replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o')
      .replace(/[ùúûü]/g, 'u')
      .replace(/[`'´’]/g, '')
      .replace(/[.!?,;]+$/, '')
      .replace(/\s+/g, ' ');
  }

  // ===== English answer variants (for reverse-direction mode) =====
  // Iteratively generates all reasonable phrasings a user might type for a given
  // English prompt. Handles he/she, you (pl), optional (reside)/(music) clarifications,
  // and optional "to" for infinitives.
  // Splits "I leave (behind) / let" into ["I leave (behind)", "I let"], carrying the
  // subject (or infinitive "to") over to alternatives that don't repeat it.
  // " / " with spaces separates meanings; "he/she" (no spaces) is left intact.
  const SUBJECT_RE = /^(you \(pl\)|he\/she|you|they|we|to|i)\s+/;
  function splitAlternatives(expected) {
    const parts = expected.split(' / ');
    if (parts.length === 1) return parts;
    const m = normalizeVerb(parts[0]).match(SUBJECT_RE);
    const subject = m ? m[1] : '';
    return parts.map((p, i) =>
      (i === 0 || !subject || SUBJECT_RE.test(normalizeVerb(p))) ? p : `${subject} ${p}`);
  }

  function acceptableEnglishAnswers(expected) {
    // Seed with the full answer, a no-space-slash version, and each meaning on its own.
    let variants = new Set([
      normalizeVerb(expected),
      normalizeVerb(expected.replace(/ \/ /g, '/')),
      ...splitAlternatives(expected).map(normalizeVerb)
    ]);
    let grew = true;
    while (grew) {
      grew = false;
      const snapshot = [...variants];
      for (const v of snapshot) {
        // he/she → he, she, she/he, he or she
        if (v.includes('he/she')) {
          for (const sub of ['he', 'she', 'she/he', 'he or she']) {
            const nv = v.replace('he/she', sub);
            if (!variants.has(nv)) { variants.add(nv); grew = true; }
          }
        }
        // you (pl) → you, you all, y'all, yall
        if (v.includes('you (pl)')) {
          for (const sub of ['you', 'you all', 'yall']) {
            const nv = normalizeVerb(v.replace('you (pl)', sub));
            if (!variants.has(nv)) { variants.add(nv); grew = true; }
          }
        }
        // Strip parenthetical clarifications like "(reside)", "(music)"
        const stripped = v.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
        if (stripped && stripped !== v && !variants.has(stripped)) {
          variants.add(stripped); grew = true;
        }
        // …or type the bracketed words without brackets: "try (to)" → "try to"
        const unwrapped = v.replace(/\((?!pl\))([^)]*)\)/g, '$1').replace(/\s+/g, ' ').trim();
        if (unwrapped !== v && !variants.has(unwrapped)) {
          variants.add(unwrapped); grew = true;
        }
        // "to X" ↔ "X"
        if (v.startsWith('to ')) {
          const noTo = v.slice(3);
          if (!variants.has(noTo)) { variants.add(noTo); grew = true; }
        }
      }
    }
    return variants;
  }

  // Which pronouns are valid for each person key.
  // lui covers lui/lei/egli/ella; loro covers loro/essi/esse.
  const validPronounsFor = {
    io: ["io"],
    tu: ["tu"],
    lui: ["lui", "lei", "egli", "ella"],
    noi: ["noi"],
    voi: ["voi"],
    loro: ["loro", "essi", "esse"]
  };

  const ALL_PRONOUNS = ["io", "tu", "lui", "lei", "egli", "ella", "noi", "voi", "loro", "essi", "esse"];
  const pronounRegex = new RegExp(`^(${ALL_PRONOUNS.join("|")})\\s+(.+)$`);

  // Returns { correct: bool, reason?: 'wrong-pronoun' }
  // Pronoun is optional — but if typed, it must match the card's person.
  // (Ported from the verb game's checkAnswer; direction now comes from the engine.)
  // Adjectives (ported): any accepted form counts, and the form you typed is echoed back.
  // Italian → English accepts any of the meanings ('tall · high' → tall or high).
  function checkAdjAnswer(rawGuess, card, itToEn) {
    if (itToEn) return checkEnglish(rawGuess, { english: card.english.replace(/ · /g, '/') });
    const guess = normalizeAdj(rawGuess);
    const match = card.accepted.find(a => normalizeAdj(a) === guess);
    return { correct: guess !== '' && !!match, match };
  }

  function checkVerbAnswer(rawGuess, card, itToEn) {
    // Italian → English (reverse) uses variant-based matching for lenient English input.
    if (itToEn) {
      const guess = normalizeVerb(rawGuess);
      if (!guess) return { correct: false };
      return { correct: acceptableEnglishAnswers(card.english).has(guess) };
    }
    const guess = normalizeVerb(rawGuess);
    const correct = normalizeVerb(card.italian);
    // Infinitive mode — no pronoun handling
    if (!card.person) {
      return { correct: guess !== '' && guess === correct };
    }
    const m = guess.match(pronounRegex);
    if (m) {
      const typedPronoun = m[1];
      const verbPart = m[2];
      if (!validPronounsFor[card.person].includes(typedPronoun)) {
        return { correct: false, reason: 'wrong-pronoun' };
      }
      return { correct: verbPart === correct };
    }
    return { correct: guess !== '' && guess === correct };
  }

  // ===== Italian syllabifier and stress marker =====
  // Computes dictionary-style pronunciation like "ri·pè·te·re" for any regular form.

  const ITALIAN_VOWELS = 'aeiou';
  const STRONG_VOWELS = 'aeo';
  const WEAK_VOWELS = 'iu';
  const STRESS_MAP = { a: 'à', e: 'è', i: 'ì', o: 'ò', u: 'ù' };

  function isVowel(c) { return ITALIAN_VOWELS.includes(c); }
  function isStrong(c) { return STRONG_VOWELS.includes(c); }
  function isWeak(c) { return WEAK_VOWELS.includes(c); }

  // Can this consonant cluster start a syllable in Italian?
  function isValidOnset(cluster) {
    const n = cluster.length;
    if (n <= 1) return true;
    if (n === 2) {
      const c1 = cluster[0], c2 = cluster[1];
      if (c1 === c2) return false;                                   // no geminates as onset
      if (c1 === 's' && 'pctdfmnbgvhz'.includes(c2)) return true;    // impure s
      if ('pbtdcgfv'.includes(c1) && 'lr'.includes(c2)) return true; // obstruent + liquid
      if (cluster === 'gn' || cluster === 'gl' || cluster === 'ch' || cluster === 'gh') return true;
      return false;
    }
    if (n === 3) {
      // str, spr, spl, scr, sdr, sfr, sgl, sbr…
      if (cluster[0] === 's' && 'pctdfbg'.includes(cluster[1]) && 'lr'.includes(cluster[2])) return true;
      return false;
    }
    return false;
  }

  // Split a run of 3+ vowels into syllabic chunks (rightward-greedy diphthong).
  function splitVowelGroup(vg) {
    if (vg.length <= 2) return [vg];
    const chunks = [];
    let rem = vg;
    while (rem.length > 2) {
      const v2 = rem[rem.length - 2], v3 = rem[rem.length - 1];
      if (isWeak(v2) || isWeak(v3)) {
        chunks.unshift(rem.slice(-2));   // last two form a diphthong
        rem = rem.slice(0, -2);
      } else {
        chunks.unshift(rem.slice(-1));   // strong+strong = hiatus, split off last
        rem = rem.slice(0, -1);
      }
    }
    if (rem) chunks.unshift(rem);
    return chunks;
  }

  function syllabify(word) {
    const w = word.toLowerCase();
    if (!w) return [];

    // Segment into V-runs and C-runs.
    const segs = [];
    let i = 0;
    while (i < w.length) {
      const isV = isVowel(w[i]);
      const start = i;
      while (i < w.length && isVowel(w[i]) === isV) i++;
      segs.push({ type: isV ? 'V' : 'C', str: w.slice(start, i) });
    }

    // Expand long vowel runs into diphthong-sized chunks.
    const expanded = [];
    for (const s of segs) {
      if (s.type === 'V') {
        for (const chunk of splitVowelGroup(s.str)) expanded.push({ type: 'V', str: chunk });
      } else {
        expanded.push(s);
      }
    }

    // Build syllables using the maximal-onset principle.
    const sylls = [];
    let cur = '';
    let k = 0;
    if (expanded.length && expanded[0].type === 'C') {
      cur = expanded[0].str;
      k = 1;
    }
    while (k < expanded.length) {
      const s = expanded[k];
      if (s.type === 'V') {
        // If cur already ends in a vowel, we're at a hiatus boundary — push and start fresh.
        if (cur && isVowel(cur[cur.length - 1])) {
          sylls.push(cur);
          cur = '';
        }
        cur += s.str;
      } else {
        const cons = s.str;
        const hasMore = k + 1 < expanded.length;
        if (!hasMore) {
          cur += cons;
        } else {
          // Find the maximal suffix of cons that's a valid onset.
          let onset = 0;
          for (let j = 1; j <= cons.length; j++) {
            if (isValidOnset(cons.slice(-j))) onset = j;
            else break;
          }
          if (onset === 0) {
            cur += cons;
            sylls.push(cur);
            cur = '';
          } else {
            cur += cons.slice(0, cons.length - onset);
            sylls.push(cur);
            cur = cons.slice(-onset);
          }
        }
      }
      k++;
    }
    if (cur) sylls.push(cur);
    return sylls;
  }

  // Add a grave accent to the stressed vowel of a syllable.
  // For diphthongs: mark the first strong vowel; else the last vowel.
  function markStressInSyllable(syl) {
    const vidx = [];
    for (let i = 0; i < syl.length; i++) if (isVowel(syl[i])) vidx.push(i);
    if (!vidx.length) return syl;
    let idx;
    if (vidx.length === 1) {
      idx = vidx[0];
    } else {
      const strong = vidx.filter(i => isStrong(syl[i]));
      idx = strong.length ? strong[0] : vidx[vidx.length - 1];
    }
    const marked = STRESS_MAP[syl[idx]] || syl[idx];
    return syl.slice(0, idx) + marked + syl.slice(idx + 1);
  }

  // Pronounce a form. Person is null for infinitives.
  // opts.isInfinitive + opts.isSdrucciola choose stress for the infinitive.
  function pronounceForm(form, person, opts) {
    opts = opts || {};
    const sylls = syllabify(form);
    const n = sylls.length;
    if (n === 0) return form;

    let stressIdx;
    if (opts.isInfinitive) {
      stressIdx = (opts.isSdrucciola && n >= 3) ? n - 3 : Math.max(0, n - 2);
    } else if (person === 'loro' && n >= 3) {
      stressIdx = n - 3; // antepenultimate (sdrucciola pattern for 3rd plural)
    } else {
      stressIdx = Math.max(0, n - 2); // penultimate
    }

    sylls[stressIdx] = markStressInSyllable(sylls[stressIdx]);
    return sylls.join('·');
  }


  // Cards for the selected items. Every card has a unique `key` and the `noun`
  // (item key) it belongs to: a noun gives one card, a verb six (or one for its
  // infinitive). Stats, notes, associations and ranks all hang off the item key.
  function buildDeck() {
    const cards = [];
    const keys = playableKeys();
    for (const n of nounData) {
      if (!keys.has(n.noun)) continue;
      cards.push(...cardsForItem(n));
    }
    return cards;
  }

  function cardsForItem(n) {
    if (isPhraseSubject()) {
      const p = n.phrase;
      return [{ key: p.key, noun: p.key, english: p.en, italian: p.it, accepted: [p.it, ...p.itAlts],
                englishAll: [...p.en.split(' / '), ...p.enAlts], reg: p.reg, note: n.note || null, natural: n.natural || null, sentPerson: n.person || null, type: n.type || null,
                rule: n.rule || null, ownRule: n.ownRule || null, mech: !!n.mech, mechPrompt: n.mechPrompt || null }].flatMap(c => {
        if (!n.pl) return [c];
        const pl = { ...c, key: `${c.key}|pl`, english: n.pl.en, italian: n.pl.it, accepted: [n.pl.it, ...n.pl.itAlts], englishAll: [n.pl.en, ...n.pl.enAlts],
                     note: n.pl.note, mechPrompt: n.pl.mechPrompt, sentPerson: n.pl.person, number: 'pl' };
        const on = activeNumbers();
        return [...(on.includes('sg') ? [{ ...c, number: 'sg' }] : []), ...(on.includes('pl') ? [pl] : [])];
      });
    // (A sentence's subject is sentPerson, never person: a card with a person is a verb card everywhere else —
    //  the missed list, the pronoun hint, answer checking)
    }
    if (isAdjSubject()) {
      const a = n.adj;
      if (adjMode === 'dictionary') {
        return [{ key: `${a.it}|dict`, noun: a.it, english: a.en, italian: a.it, type: a.type,
                  accepted: acceptedForms(a), cue: null, note: n.note || null }];
      }
      const slots = a.type === 'inv' ? ['all'] : a.type === '2' ? ['sg', 'pl'] : ['msg', 'fsg', 'mpl', 'fpl'];
      return slots.map((slot, i) => ({
        key: `${a.it}|${slot}`, noun: a.it, english: a.en, italian: ADJ_FORMS[a.it][i], type: a.type,
        accepted: [ADJ_FORMS[a.it][i], ...(ADJ_ALT_FORMS[`${a.it}|${slot}`] || [])], cue: ADJ_CUES[slot], note: n.note || null
      }));
    }
    if (!isVerbSubject()) {
      return [{ key: n.noun, english: n.en, italian: n.it, noun: n.noun, gender: n.g, note: n.note || null }];
    }
    const v = n.verb;
    if (verbMode === 'infinitives') {
      const isEre = v.it.endsWith('ere');
      const pron = (v.pronMap && v.pronMap.it) || pronounceForm(v.it, null, { isInfinitive: true, isSdrucciola: isEre && !v.piana });
      return [{ key: `${v.it}|inf`, noun: v.it, english: v.en, italian: v.it, person: null,
                pronounLabel: '', verbMeaning: v.en, pron, note: n.note || null }];
    }
    return activePersons().map(p => ({
      key: `${v.it}|${p}`, noun: v.it, english: v.prompts[p], italian: v.conj[p], person: p,
      pronounLabel: personLabel[p], verbMeaning: v.en,
      pron: (v.pronMap && v.pronMap[p]) || pronounceForm(v.conj[p], p),
      note: n.note || null
    }));
  }

  // How many cards each selected item contributes
  function cardsPerItem() {
    return isVerbSubject() && verbMode === 'conjugations' ? activePersons().length : 1;
  }

  // ===== State =====
  let selectedNouns = new Set();
  let deck = [];
  let index = 0;
  let score = 0;
  let streak = 0;
  let bestStreak = 0;
  let answered = false;
  // Session layers (all cleared when returning to setup):
  //   sessionPool    — every card from the setup selection. Fixed for the session;
  //                    it's the universe the Focus list and Deck size dropdown draw from.
  //   sessionMaxDeck — the priority set: the setup-capped shuffle at first, or the
  //                    last mid-game Focus pick. Growing the deck pulls from here first.
  //   deck           — the cards actually in play right now.
  // Play again & Reshuffle replay the current deck in a new order.
  let sessionPool = null;
  let sessionMaxDeck = null;
  let sessionFocused = false; // true once a mid-game Focus has been applied
  // Cards missed (wrong or skipped) in the current round, by card key. An "I was
  // right" override takes a card back out. Drives "Practise the ones I missed".
  let roundMissed = new Map();
  let sessionIsReview = false;  // true while replaying a round's missed cards
  // Ripasso del giorno: a mixed review of everything due today, across sections
  let reviewMode = false;
  let reviewReturn = null;      // the section to go back to afterwards
  // How the setup subset is chosen: 'random' or 'frequent' (the N most common).
  // capMode is the setup choice (kept while the page is open); sessionPickMode
  // records what this session actually used, so Deck size grows the same way.
  let capMode = 'random';
  let capValue = '';      // the subset number, kept when returning to setup
  let sessionPickMode = 'random';
  let verbMode = 'conjugations';
  let adjMode = 'dictionary';     // adjectives: 'dictionary' (1 card) | 'forms' (every gender and number)  // verbs: 'conjugations' (6 cards per verb) | 'infinitives' (1)

  // Paint-selection state for the setup screen (null = not dragging)
  let dragMode = null;
  document.addEventListener('mouseup', () => { dragMode = null; });
  document.addEventListener('mouseleave', () => { dragMode = null; });

  // ===== Per-noun progress, persisted to localStorage =====
  // Shape: { [nounKey]: { seen: n, wrong: n } }
  // Practice direction: 'en-it' (English prompt, type the Italian with its
  // article) or 'it-en' (Italian prompt, type the English meaning). Lasts for
  // the page session. Each direction keeps its own progress, so easier
  // recognition practice doesn't dilute the article/gender stats.
  let direction = 'en-it';
  // The three directions: type the Italian, type the English, or hear the Italian
  // and type it ('listen'). Each keeps its own progress.
  const DIR_LABELS = {
    'en-it': { short: 'EN → IT', long: 'English → Italian' },
    'it-en': { short: 'IT → EN', long: 'Italian → English' },
    listen: { short: '🔊 Listening', long: 'Listening' }
  };
  let stats = {};   // loaded for the current subject and direction by applySubject()

  // Keys live in SUBJECTS. Verbs keep the verb game's own format
  // ({ attempts, wrongs }) on disk; in memory everything is { seen, wrong }.
  function statsKey() { return SUBJECTS[subject].statsKeys[direction]; }

  function loadStats() {
    try {
      const raw = localStorage.getItem(statsKey());
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return {};
      if (SUBJECTS[subject].statsFormat === 'verb') {
        const out = {};
        for (const [k, s] of Object.entries(parsed)) out[k] = { seen: s.attempts || 0, wrong: s.wrongs || 0 };
        return out;
      }
      return parsed;
    } catch (e) {
      return {};
    }
  }

  function saveStats() {
    try {
      let data = stats;
      if (SUBJECTS[subject].statsFormat === 'verb') {
        data = {};
        for (const [k, s] of Object.entries(stats)) data[k] = { attempts: s.seen, wrongs: s.wrong };
      }
      localStorage.setItem(statsKey(), JSON.stringify(data));
      syncTouched();
    }
    catch (e) { /* quota full or disabled — silently ignore */ }
  }

  // ===== Spaced repetition: when each item is next due, per section and direction =====
  // One record per item: { b: box 1–7, d: the day it's next due, l: the day it last
  // changed }. Days are whole local days. A correct answer moves an item up a box
  // (at most once a day, so six right conjugations of one verb count once) and sends
  // it out 1, 2, 4, 8, 16, 32 or 64 days; a wrong answer drops it to box 1, due tomorrow.
  const SRS_INTERVALS = [0, 1, 2, 4, 8, 16, 32, 64];
  const SRS_MAX_BOX = 7;
  function today() {
    const now = Date.now();
    return Math.floor((now - new Date(now).getTimezoneOffset() * 60000) / 86400000);
  }
  function srsKey(subj, dir) { return `${SUBJECTS[subj].statsKeys[dir]}:srs`; }
  function loadSrs(subj, dir) {
    try { const o = JSON.parse(localStorage.getItem(srsKey(subj, dir)) || '{}'); return o && typeof o === 'object' ? o : {}; }
    catch (e) { return {}; }
  }
  function saveSrs(subj, dir, srs) {
    try { localStorage.setItem(srsKey(subj, dir), JSON.stringify(srs)); syncTouched(); } catch (e) { /* storage full */ }
  }
  // Any section's progress, in the common { seen, wrong } shape
  function readStats(subj, dir) {
    try {
      const parsed = JSON.parse(localStorage.getItem(SUBJECTS[subj].statsKeys[dir]) || '{}') || {};
      if (SUBJECTS[subj].statsFormat !== 'verb') return parsed;
      const out = {};
      for (const [k, s] of Object.entries(parsed)) out[k] = { seen: s.attempts || 0, wrong: s.wrongs || 0 };
      return out;
    } catch (e) { return {}; }
  }
  // History from before the schedule existed: weak items come due now, solid ones are
  // spread over the coming days (spread by name, so it's the same on every load)
  function spreadDays(key, span) {
    let h = 0;
    for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return span > 0 ? h % (span + 1) : 0;
  }
  function seedRecord(key, s, t) {
    const rate = s.wrong / s.seen;
    if (s.wrong > 0 && rate >= 0.25) return { b: 1, d: t, l: null };
    if (s.wrong > 0) return { b: 2, d: t + spreadDays(key, 2), l: null };
    const b = s.seen >= 3 ? 4 : 3;
    return { b, d: t + 1 + spreadDays(key, SRS_INTERVALS[b] - 1), l: null };
  }
  function seedSrs(subj, dir) {
    const srs = loadSrs(subj, dir), t = today();
    let added = false;
    for (const [k, s] of Object.entries(readStats(subj, dir))) {
      if (!srs[k] && s.seen > 0) { srs[k] = seedRecord(k, s, t); added = true; }
    }
    if (added) saveSrs(subj, dir, srs);
    return srs;
  }
  let lastSrsChange = null;   // so "I was right" can undo a demotion
  function srsAnswer(subj, dir, key, correct) {
    const srs = loadSrs(subj, dir), t = today();
    if (!srs[key]) {   // first time on the schedule: start from any earlier history
      const s = readStats(subj, dir)[key];
      if (s && s.seen > 0) srs[key] = seedRecord(key, s, t);
    }
    const prev = srs[key] ? { ...srs[key] } : null;
    const r = srs[key] ? { ...srs[key] } : { b: 0, d: t, l: null };
    if (correct) {
      if (r.l !== t) { r.b = Math.min(r.b + 1, SRS_MAX_BOX); r.d = t + SRS_INTERVALS[r.b]; }
    } else {
      r.b = 1;
      r.d = t + 1;
    }
    r.l = t;
    srs[key] = r;
    saveSrs(subj, dir, srs);
    lastSrsChange = { subj, dir, key, prev };
  }
  function srsUndoLast(subj, dir, key) {
    if (!lastSrsChange || lastSrsChange.subj !== subj || lastSrsChange.dir !== dir || lastSrsChange.key !== key) return false;
    const srs = loadSrs(subj, dir);
    if (lastSrsChange.prev) srs[key] = lastSrsChange.prev; else delete srs[key];
    saveSrs(subj, dir, srs);
    lastSrsChange = null;
    return true;
  }
  // Everything due today (or overdue) in one direction, across all sections,
  // most overdue first, then the shakiest
  const sentenceTypeOff = (subj, key, on) => SUBJECTS[subj].typeFilter && !on.includes(SENTENCE_TYPE_OF[key]);
  function dueList(dir) {
    const t = today(), out = [], on = activeSentenceTypes();
    for (const subj of Object.keys(SUBJECTS)) {
      const srs = seedSrs(subj, dir);
      for (const n of SUBJECTS[subj].items) {
        if (sentenceTypeOff(subj, n.noun, on)) continue;
        const r = srs[n.noun];
        if (r && r.d <= t) out.push({ subj, n, r });
      }
    }
    return out.sort((a, b) => (a.r.d - b.r.d) || (a.r.b - b.r.b) || a.n.noun.localeCompare(b.n.noun));
  }
  function dueOnDay(dir, day) {
    let n = 0;
    const on = activeSentenceTypes();
    for (const subj of Object.keys(SUBJECTS)) for (const [k, r] of Object.entries(seedSrs(subj, dir))) if (r.d === day && !sentenceTypeOff(subj, k, on)) n++;
    return n;
  }

  function recordAnswer(nounKey, isCorrect) {
    srsAnswer(subject, direction, nounKey, isCorrect);
    const s = stats[nounKey] || { seen: 0, wrong: 0 };
    s.seen += 1;
    if (!isCorrect) s.wrong += 1;
    stats[nounKey] = s;
    saveStats();
  }

  // ===== Personal word associations, persisted to localStorage =====
  // Shape: { [nounKey]: "free text" }. Shared by both directions. Shown only
  // after a card has been answered, never on the prompt side.
  let associations = {};   // loaded per subject by applySubject()

  function loadAssociations() {
    try {
      const raw = localStorage.getItem(SUBJECTS[subject].assocKey);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveAssociations() {
    try { localStorage.setItem(SUBJECTS[subject].assocKey, JSON.stringify(associations)); syncTouched(); }
    catch (e) { /* quota full or disabled — silently ignore */ }
  }

  // Associations are free text typed by the player, so escape before display
  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  // ===== Which persons to practise, per verb section =====
  // Saved per section and synced with progress, so every device drills the same ones.
  // Conjugation cards — in a round, in Ripasso del giorno, in chapter practice — come
  // only from these persons; at least one always stays selected.
  const VERB_PERSONS_KEY = 'mazzo-verb-persons-v1';
  const PERSON_SETS = { all: personOrder, sing: ['io', 'tu', 'lui'], plur: ['noi', 'voi', 'loro'] };
  function verbPersonsSaved() {
    try { const o = JSON.parse(localStorage.getItem(VERB_PERSONS_KEY) || '{}'); return o && typeof o === 'object' && !Array.isArray(o) ? o : {}; }
    catch (e) { return {}; }
  }
  function activePersons(subj = subject) {
    const saved = verbPersonsSaved()[subj];
    const list = Array.isArray(saved) ? personOrder.filter(p => saved.includes(p)) : personOrder;
    return list.length ? list : personOrder;
  }
  function saveVerbPersons(subj, list) {
    const all = verbPersonsSaved();
    all[subj] = personOrder.filter(p => list.includes(p));
    try { localStorage.setItem(VERB_PERSONS_KEY, JSON.stringify(all)); syncTouched(); } catch (e) { /* storage full */ }
  }

  // History & etymology notes for every verb, shown after every answer (like the nouns')
  const VERB_NOTES = {
    parlare: "From Late Latin <em>parabolare</em>, 'to speak in parables', built on <em>parabola</em> (comparison, parable). Church Latin made it the everyday word for speaking, and it also gave <em>la parola</em> (word). French <em>parler</em> is the same verb, which is why English has 'parley' and 'parliament', a place for talking.",
    pensare: "Latin <em>pensare</em> meant 'to weigh carefully', from <em>pendere</em> (to weigh). Thinking was pictured as weighing ideas on a balance, the same image as English 'ponder', from <em>ponderare</em> (to weigh). It's a cousin of <em>lo stipendio</em>, pay that was once weighed out.",
    trovare: "Nobody is quite sure. One theory is Vulgar Latin <em>tropare</em>, 'to compose a melody', which would explain the <em>trovatori</em>, the medieval poet-musicians who 'found' their songs. Another is Latin <em>turbare</em>, 'to stir up', as fishermen stirred the water to find fish. French <em>trouver</em> shares the mystery.",
    lavorare: "Latin <em>laborare</em>, 'to toil, to suffer', from <em>labor</em> (hard work, hardship). Work was first of all effort and pain. English 'labour', 'laboratory' (a place of work) and 'elaborate' (worked out) come from the same root, as does <em>il lavoro</em>.",
    arrivare: "From Vulgar Latin <em>arripare</em>, 'to reach the shore', from <em>ad</em> (to) + <em>ripa</em> (bank). It was a sailors' word: you arrived when your boat touched land. English 'arrive' is the same word, and <em>la riva</em> (shore) is the bank itself.",
    comprare: "From Latin <em>comparare</em>, 'to procure, to obtain'. Latin happened to have a twin verb spelt the same way, <em>comparare</em> 'to pair up' (from <em>par</em>, equal), which gave English 'compare'. Two different words that looked identical, one leading to shopping and one to comparison.",
    mangiare: "Borrowed from Old French <em>mangier</em>, from Latin <em>manducare</em>, 'to chew, to munch'. <em>Manducus</em> was a stock character in Roman farce with huge, chomping jaws. The everyday Latin <em>edere</em> (to eat) faded, and the comic 'chomp' word won.",
    abitare: "Latin <em>habitare</em>, 'to keep having', a frequent form of <em>habere</em> (to have, to hold). To live somewhere was to go on holding it. English 'inhabit' and 'habitat' share it, and so does 'habit', what you keep doing.",
    capire: "From Latin <em>capere</em>, 'to take, to seize'. Understanding is grasping, the same picture as English 'grasp' or 'apprehend'. Italian moved the verb into the <em>-isc-</em> pattern (<em>capisco</em>), while the root lives on in 'capture', 'capable' and 'capacity'.",
    cercare: "Late Latin <em>circare</em>, 'to go around', from <em>circa</em> (around). Searching meant circling about. French turned it into <em>chercher</em>, and English 'search' came from the Old French form, so 'search' and <em>cercare</em> are the same word.",
    aspettare: "Latin <em>exspectare</em>, 'to look out for', from <em>ex</em> (out) + <em>spectare</em> (to look). Waiting was watching the road. English 'expect' and 'spectator' share the root.",
    lasciare: "Latin <em>laxare</em>, 'to loosen, to release', from <em>laxus</em> (loose). To leave something is to let go of it, which also explains the second meaning, to let. English 'relax', 'lax' and 'release' are relatives.",
    guardare: "From a Germanic word, <em>wardōn</em>, 'to watch over', brought into Italy by the Germanic peoples of late antiquity. The same word gave English 'ward', 'warden' and 'regard', and, through French, 'guard'. Italian kept the 'watching' sense for everyday looking.",
    ricordare: "Latin <em>recordari</em>, from <em>re-</em> (back) + <em>cor</em>, <em>cordis</em> (heart). The Romans placed memory in the heart, so remembering was 'bringing back to the heart'. English still says 'learn by heart', and 'record' comes from the same verb.",
    dimenticare: "Built from <em>di-</em> (away) + <em>mente</em> (mind): to forget is to let something drop out of the mind. Compare <em>la mente</em>, and English 'demented', literally 'out of one's mind'.",
    salutare: "Latin <em>salutare</em>, 'to wish good health', from <em>salus</em> (health, safety). A greeting was a wish for someone's health, which is why Italians also say <em>Salute!</em> when raising a glass or when someone sneezes. English 'salute' is the same word.",
    viaggiare: "From <em>il viaggio</em>, borrowed from Old Provençal <em>viatge</em>, from Latin <em>viaticum</em>, the provisions you took for a journey (<em>via</em>, road). English 'voyage' comes from the same word through French.",
    giocare: "Latin <em>iocari</em>, 'to joke, to jest', from <em>iocus</em> (a joke). Play and jokes were one idea. English 'joke' and 'jocular' share the root, and so does 'juggler', from Latin <em>ioculator</em>, an entertainer.",
    credere: "Latin <em>credere</em>, 'to trust, to believe', which also meant to lend money. That's where English 'credit', 'creed' and 'credible' come from. Italian <em>la credenza</em> (a sideboard) comes from it too, from the custom of tasting food there to prove it was safe, so that guests could trust it.",
    partire: "Latin <em>partiri</em>, 'to divide, to share out', from <em>pars</em> (part). To leave was to separate yourself from others, to 'part' from them. It's a cousin of <em>la parte</em>, and English 'depart' and 'part company' keep the same idea.",
    servire: "Latin <em>servire</em>, from <em>servus</em> (slave, servant). Serving was a servant's work. The second meaning, 'to be needed', comes from the idea of something being of service: <em>mi serve una penna</em>, 'a pen would serve me', means 'I need a pen'.",
    ascoltare: "Latin <em>auscultare</em>, 'to listen attentively'. Doctors still use the word: listening to the chest with a stethoscope is 'auscultation'. Everyday Italian wore the word down to <em>ascoltare</em>.",
    tornare: "Latin <em>tornare</em>, 'to turn on a lathe', from <em>tornus</em> (a lathe), itself from Greek. A turning movement became a turning back, a return. English 'turn', 'return', 'tour' and 'tournament' all spin out of the same root, and Italian still calls a lathe <em>il tornio</em>.",
    spiegare: "Latin <em>explicare</em>, 'to unfold', from <em>ex</em> (out) + <em>plicare</em> (to fold). To explain is to unfold something so it lies flat and can be seen. English 'explain' and 'explicit' share the image, and Italian <em>piegare</em> still means to fold.",
    chiamare: "Latin <em>clamare</em>, 'to cry out, to shout'. Calling someone was shouting their name. English 'claim', 'clamour', 'exclaim' and 'proclaim' all come from the same verb.",
    pagare: "Latin <em>pacare</em>, 'to pacify, to appease', from <em>pax</em> (peace). To pay was to satisfy a creditor and make peace with them. English 'pay' comes from the same word through French, and it's a cousin of <em>la pace</em>.",
    baciare: "Latin <em>basiare</em>, from <em>basium</em> (a kiss), a word the poet Catullus made famous in the 1st century BC: <em>da mi basia mille</em>, 'give me a thousand kisses'. It pushed aside the older Latin words for kissing.",
    cadere: "Latin <em>cadere</em>, 'to fall'. Its family is large: 'cadence' (a falling of the voice), 'decadent', 'accident' (what befalls you) and 'occasion' (circumstances falling together), which is why it's a cousin of <em>l'occasione</em>.",
    contare: "Latin <em>computare</em>, 'to reckon', from <em>com-</em> + <em>putare</em> (to think, to prune). The same word gave English 'count', 'compute' and 'account'. Telling a story is <em>raccontare</em>, literally 're-counting' events.",
    pulire: "Latin <em>polire</em>, 'to smooth, to polish'. Cleaning was polishing. English 'polish' comes from it, and so does 'polite': a polite person has polished manners.",
    correre: "Latin <em>currere</em>, 'to run'. English took 'current' (running water), 'course', 'courier' (Italian <em>il corriere</em>, a runner) and 'corridor' (Italian <em>il corridoio</em>, a passage for running through).",
    cantare: "Latin <em>cantare</em>, a frequent form of <em>canere</em> (to sing). English 'chant', 'enchant' and 'incantation' come from it: spells were sung. Italian also gives music <em>il canto</em> and the <em>cantata</em>.",

    // ----- Notes for the remaining verbs -----
    portare: "Latin <em>portare</em>, 'to carry'. English borrowed a whole family: 'porter', 'portable', 'import', 'export', 'transport', 'support' and 'report', carrying news back. Italian builds everyday compounds with it, like <em>il portachiavi</em> ('carries-keys') and <em>il portafoglio</em> ('carries-sheets', a wallet). Wearing clothes is simply carrying them on you.",
    provare: "Latin <em>probare</em>, 'to test, to find good', from <em>probus</em> (honest, upright). Testing something showed whether it was good, so English got both 'prove' and 'approve', plus 'probe' and 'probable'. Italian keeps the testing sense: to try, to try on clothes, and even to feel (<em>provare paura</em>, to feel fear). Compare <em>la prova</em>.",
    amare: "Latin <em>amare</em>, the Romans' everyday verb for love. Its family reached English through French: 'amorous', 'enamoured', 'amiable', and 'amateur', someone who does something for love rather than money. <em>L'amico</em> (friend) probably shares the root: a friend is someone you love.",
    usare: "From <em>usus</em>, the past participle of Latin <em>uti</em> (to use). English took 'use', 'usual' (what's in regular use) and 'abuse' (misuse). The bare verb <em>uti</em> gave 'utility' and 'utensil', and Italian <em>utilizzare</em>, a longer, more formal cousin.",
    cambiare: "Late Latin <em>cambiare</em>, 'to exchange', a word the Romans picked up from Gaulish, the Celtic language of France. Swapping goods came first, which is why <em>il cambio</em> is also currency exchange. French turned it into <em>changer</em>, the source of English 'change' and 'exchange'.",
    studiare: "From Latin <em>studium</em>, 'eagerness, devotion', from <em>studere</em> (to be keen on something). To study was to throw yourself into something. English 'study' and 'student' come from it, and so does 'studio': Italian <em>lo studio</em>, a room for study or work, went into English as an artist's workshop.",
    domandare: "Latin <em>demandare</em> meant 'to entrust, to hand over', from <em>de-</em> + <em>mandare</em> (to send, to commit). In Italian and French (<em>demander</em>) it softened into asking, while English 'demand' kept a firmer tone — a false friend: <em>domandare</em> is just to ask. <em>La domanda</em> is the question itself.",
    preparare: "Latin <em>praeparare</em>, 'to make ready beforehand', from <em>prae</em> (before) + <em>parare</em> (to make ready, to ward off). <em>Parare</em> turns up all over English: 'repair', 'apparatus', 'separate'. Italian keeps its 'ward off' sense in <em>il parabrezza</em> (windscreen, 'parries-breeze') and <em>il paracadute</em>, which French borrowed as 'parachute'.",
    iniziare: "From Latin <em>initium</em>, 'a beginning', literally 'a going in', from <em>in-</em> + <em>ire</em> (to go). Beginning something is stepping into it. English 'initial', 'initiate' and 'initiative' share it, and <em>cominciare</em> is built on the same word.",
    mostrare: "Latin <em>monstrare</em>, 'to point out', from <em>monstrum</em>: an omen, a strange sign the gods showed as a warning (from <em>monere</em>, to warn). That's also the origin of English 'monster'. 'Demonstrate' and 'muster' (troops shown for inspection) come from the same verb, and so does <em>dimostrare</em>.",
    cominciare: "Vulgar Latin <em>cominitiare</em>: <em>cum</em> + <em>initiare</em>, built on <em>initium</em> (beginning), like <em>iniziare</em>. French made it <em>commencer</em>, which English borrowed as 'commence', the formal twin of 'begin'. Watch the spelling: one <em>m</em> in <em>cominciare</em>, two in 'commence'.",
    mandare: "Latin <em>mandare</em>, 'to entrust, to order', traditionally explained as <em>manus</em> (hand) + <em>dare</em> (to give): putting something into someone's hands. English 'mandate', 'command', 'recommend' and 'demand' grew from it. In Italian it settled on sending: <em>mandare una lettera</em>.",
    continuare: "From Latin <em>continuus</em>, 'unbroken', from <em>continere</em>, 'to hold together' (<em>con-</em> + <em>tenere</em>, to hold). Something continuous holds together without a gap. The same verb gave English 'contain' and 'continent', the 'continuous land' as opposed to islands.",
    entrare: "Latin <em>intrare</em>, from <em>intra</em> (within): to go inside. French made it <em>entrer</em>, which gave English 'enter', 'entry' and 'entrance'. The bare Latin word survives in English compounds like 'intravenous', within the vein.",
    imparare: "From Vulgar Latin <em>imparare</em>, 'to get for oneself', from <em>in-</em> + <em>parare</em> (to prepare, to obtain). Learning was acquiring something and making it your own. It's built on the same <em>parare</em> as <em>preparare</em>; Spanish chose a different picture, <em>aprender</em>, from <em>apprehendere</em>, to grasp.",
    aiutare: "Latin <em>adiutare</em>, a frequent form of <em>adiuvare</em>, 'to help' (<em>ad-</em> + <em>iuvare</em>, to assist). French wore it down to <em>aider</em>, which English borrowed as 'aid'. An army 'adjutant' is literally a helper. Compare <em>l'aiuto</em>.",
    ricevere: "Latin <em>recipere</em>, 'to take back', from <em>re-</em> + <em>capere</em> (to take), the verb behind <em>capire</em>. English took 'receive', 'receipt' and 'recipient'. 'Recipe' is the Latin command 'take!': old prescriptions began <em>Recipe…</em>, 'take two parts of…'.",
    vendere: "Latin <em>vendere</em>, squeezed together from <em>venum dare</em>, 'to give for sale'. English took 'vendor', 'vend' and the 'vending machine'. Italian <em>la vendita</em> is a sale, and <em>in vendita</em> means 'for sale'.",
    ripetere: "Latin <em>repetere</em>, 'to seek again, to go back to', from <em>re-</em> + <em>petere</em> (to aim at, to seek). Saying something again was going back for it. <em>Petere</em> is a prolific root: 'petition', 'compete' (seeking together) and 'appetite' (seeking towards) all come from it.",
    temere: "Latin <em>timere</em>, 'to fear'. Its adjective <em>timidus</em> gave English 'timid', and its noun <em>timor</em> gave 'timorous'. Italian uses <em>temere</em> in careful speech; day to day people often say <em>avere paura</em>, 'to have fear'. Note the stress on the ending: <em>te·mè·re</em>.",
    sentire: "Latin <em>sentire</em>, 'to perceive' with any sense at all, which is why Italian uses it for hearing, feeling and even smelling. English took 'sense', 'sentiment', 'consent', 'resent' and 'sentence', first an opinion and then a judge's verdict. 'Scent' comes from it too, through French <em>sentir</em> (to smell).",
    dormire: "Latin <em>dormire</em>, practically unchanged for two thousand years. English took 'dormitory', a room for sleeping, and 'dormant', asleep or inactive. The 'dormer' window began as the window of a sleeping room.",
    seguire: "Latin <em>sequi</em>, 'to follow'. English is full of it: 'sequence', 'sequel', 'consequence', 'pursue' and 'suit'. Even 'second' is from <em>sequi</em>: <em>secundus</em> was 'the following one', the one after the first, which is why <em>secondo</em> also means 'according to', following someone's view.",
    finire: "Latin <em>finire</em>, from <em>finis</em> (boundary, end). Its family marks limits: 'final', 'finite', 'infinite', and 'define', setting boundaries around a meaning. A 'fine' you pay was originally the final settlement of a dispute. Compare <em>la fine</em>.",
    preferire: "Latin <em>praeferre</em>, 'to carry in front', from <em>prae</em> (before) + <em>ferre</em> (to carry). What you prefer, you put ahead of the rest. <em>Ferre</em> also gives 'transfer', 'refer' and 'confer', and it's hiding in <em>offrire</em> and <em>soffrire</em>.",
    costruire: "Latin <em>construere</em>, 'to pile together', from <em>con-</em> + <em>struere</em> (to stack, to arrange). English 'construct' and 'structure' are the obvious relatives; less obvious are 'instruct', building knowledge into someone, and 'destroy', literally 'un-build'. Mind the stress: <em>co·stru·ì·sco</em>.",
    diventare: "From Latin <em>devenire</em>, 'to come to, to arrive at', built on <em>venire</em> (to come). Becoming is arriving at a new state, and English uses exactly the same picture: 'be-come'.",
    passare: "Vulgar Latin <em>passare</em>, from <em>passus</em> (a step), the same word as <em>il passo</em>. To pass was to step through or by. English has 'pass', 'passage', 'passenger', 'trespass' and 'passport', first permission to pass through a port.",
    sperare: "Latin <em>sperare</em>, from <em>spes</em> (hope). English never borrowed the plain verb, only its opposite: 'despair' and 'desperate', from <em>desperare</em>, 'to stop hoping'. Italian has both sides: <em>la speranza</em> (hope) and <em>disperato</em> (desperate).",
    presentare: "From Latin <em>praesens</em>, 'being in front of', from <em>prae</em> (before) + <em>esse</em> (to be). To present is to put something in front of someone, which is how English 'present' came to mean both 'now' and a gift. Compare <em>rappresentare</em>, to present again.",
    considerare: "Often traced to <em>sidus</em>, <em>sideris</em> (star): to examine closely, the way augurs and astronomers studied the sky. The link isn't certain, but it pairs neatly with <em>desiderare</em>. English 'consider' is the same word. Mind the stress, which falls early: <em>con·sì·de·ro</em>.",
    accettare: "Latin <em>acceptare</em>, a frequent form of <em>accipere</em>, 'to take to oneself', from <em>ad-</em> + <em>capere</em> (to take). It's another member of the <em>capere</em> family, with <em>capire</em> and <em>ricevere</em>: accepting is taking what's offered. English 'accept' is the same word.",
    desiderare: "Latin <em>desiderare</em>, 'to long for, to miss'. A popular explanation links it to <em>sidus</em> (star): <em>de-sidus</em>, 'away from the stars', missing what you once watched for. Scholars aren't certain, but the image has stuck. English 'desire' came through French. Stress: <em>de·sì·de·ro</em>.",
    incontrare: "Built on Late Latin <em>incontra</em>, 'towards, facing', from <em>in-</em> + <em>contra</em> (against). Meeting someone is coming face to face. French made it <em>encontrer</em>, the source of English 'encounter'; <em>contra</em> also gives 'contrary' and 'counter'.",
    tirare: "Of uncertain origin, possibly Germanic, but shared across the Romance languages: French <em>tirer</em> means both 'to pull' and 'to shoot', just like Italian. English got 'tirade' from it: Italian <em>tirata</em> was a volley, and in French it became a long angry speech.",
    mancare: "From Latin <em>mancus</em>, 'maimed, crippled', and so incomplete. To be lacking is <em>mancare</em>, and <em>mi manchi</em>, 'you're lacking to me', is how Italians say 'I miss you'. The same word gave <em>mancino</em>, left-handed, once thought of as the 'lesser' hand.",
    accompagnare: "Built on <em>compagno</em>, the one you share bread with (<em>cum</em> + <em>panis</em>). To accompany someone is to be their companion along the way. French <em>accompagner</em> gave English 'accompany', and a musical accompaniment is music keeping someone company.",
    guidare: "Borrowed from Old Provençal <em>guidar</em>, of Germanic origin, from a root meaning 'to show the way'. English 'guide' came the same way through French. Italian kept the leading sense for driving: <em>guidare la macchina</em>, steering a car where it should go.",
    immaginare: "Latin <em>imaginari</em>, 'to picture to oneself', from <em>imago</em>, an image or likeness — and the wax portrait masks of ancestors that Roman families kept at home. English 'imagine' and 'image' are the same family, as is <em>l'immagine</em>. Stress: <em>im·mà·gi·no</em>.",
    indicare: "Latin <em>indicare</em>, 'to point out', related to <em>dicere</em> (to say). The pointing finger is the <em>index</em>, which is why Italian calls it <em>l'indice</em> and why a book's index points you to pages. English 'indicate' is the same verb. Stress: <em>ìn·di·co</em>.",
    saltare: "Latin <em>saltare</em>, 'to keep leaping, to dance', a frequent form of <em>salire</em> (to leap), which in Italian now means 'to go up'. English took 'salient' (leaping out), 'assault' (leaping at) and 'insult' (leaping on someone). Skipping a meal, <em>saltare un pasto</em>, is jumping over it.",
    camminare: "From <em>il cammino</em>, 'way, path', from Late Latin <em>camminus</em>, one of the words Latin borrowed from the Celtic language of Gaul, like <em>cambiare</em>. Spanish <em>camino</em> and French <em>chemin</em> are the same word. Walking is simply going along the way.",
    suonare: "Latin <em>sonare</em>, 'to make a sound', from <em>sonus</em>. It covers playing an instrument and a bell or phone ringing: anything that sounds. English 'sound', 'resonate' and 'unison' share it, and 'sonnet' is Italian <em>sonetto</em>, 'a little sound', a poem form invented in 13th-century Sicily and made famous by Petrarch.",
    lavare: "Latin <em>lavare</em>, 'to wash'. English has 'lavatory' (a washroom), 'lotion' and 'laundry', from Latin <em>lavandaria</em>, things to be washed. It's the root of <em>la lavatrice</em>, <em>la lavastoviglie</em> and even <em>la lava</em>.",
    toccare: "From Vulgar Latin <em>toccare</em>, probably imitating the sound of a knock, <em>toc</em>. French made it <em>toucher</em>, the source of English 'touch'. Music borrowed the Italian directly: a <em>toccata</em> shows off a keyboard player's touch. <em>Tocca a te</em> means 'it's your turn': the turn has touched you.",
    controllare: "From French <em>contrôler</em>, originally <em>contre-rôle</em>, 'counter-roll': a duplicate register kept to check the original accounts. Checking against a copy became checking in general, and English 'control' drifted towards commanding, while <em>controllare</em> mostly keeps the checking sense. Compare <em>il ruolo</em>, from the same 'roll'.",
    utilizzare: "Borrowed from French <em>utiliser</em>, from <em>utile</em> (useful), Latin <em>utilis</em>, from <em>uti</em> (to use), the verb behind <em>usare</em> too. Like English 'utilize', it's the longer, more formal way of saying 'use'.",
    dichiarare: "Latin <em>declarare</em>, 'to make clear', from <em>de-</em> + <em>clarus</em> (clear, bright). Declaring is making something plainly visible. English 'declare' is the same word, and <em>clarus</em> also gives 'clear', 'clarify' and Italian <em>chiaro</em>.",
    celebrare: "Latin <em>celebrare</em>, 'to fill a place in crowds', from <em>celeber</em>, which meant crowded, much-visited, and so famous. A celebration was a well-attended event, and 'celebrity' comes from the same adjective: someone everyone flocks to.",
    dimostrare: "Latin <em>demonstrare</em>, 'to point out fully', <em>de-</em> + <em>monstrare</em> (to show), the verb behind <em>mostrare</em>. English 'demonstrate' is the same word. A political demonstration, though, is <em>una manifestazione</em> in Italian.",
    osservare: "Latin <em>observare</em>, 'to watch, to heed', from <em>ob-</em> + <em>servare</em> (to keep, to guard). Watching and keeping went together: you observe a rule by keeping it. <em>Servare</em> also gives 'preserve', 'conserve' and 'reserve', but it's a different word from <em>servire</em> (to serve).",
    rappresentare: "Latin <em>repraesentare</em>, 'to make present again', from <em>re-</em> + <em>praesentare</em> (see <em>presentare</em>). A picture, an actor or an elected member makes present someone who isn't there. English 'represent' is the same word, and Italian theatre still calls a performance <em>una rappresentazione</em>.",
    costare: "Latin <em>constare</em>, 'to stand firm', from <em>con-</em> + <em>stare</em> (to stand). A price that 'stands at' ten coins costs ten coins. French made it <em>coûter</em>, giving English 'cost', and the same verb gave 'constant', something that stands firm.",
    cucinare: "From <em>la cucina</em>, Latin <em>coquina</em>, from <em>coquere</em> (to cook), the same Latin behind English 'kitchen' and 'cook'. Italian <em>il biscotto</em> and English 'biscuit' belong to the family too: <em>bis coctus</em>, 'twice-cooked'.",
    affermare: "Latin <em>affirmare</em>, 'to make firm', from <em>ad-</em> + <em>firmus</em> (firm, steady). To state something is to make it solid. English 'affirm' and 'confirm' are the same family, and Italian <em>la firma</em>, the signature that makes a document binding, comes from <em>firmus</em> too.",
    vivere: "Latin <em>vivere</em>, 'to live'. English took 'vivid', 'vivacious' and 'survive', to live beyond. <em>Viva!</em>, 'long live!', is its subjunctive, shouted for teams and heroes. Unlike <em>abitare</em> (to reside somewhere), <em>vivere</em> is being alive.",
    perdere: "Latin <em>perdere</em>, from <em>per-</em> (through, away) + <em>dare</em> (to give): to give away completely, and so to lose or ruin. English kept the grim side in 'perdition', being lost for ever. Italian also uses it for missing a train: <em>perdere il treno</em>.",
    ridere: "Latin <em>ridere</em>, 'to laugh'. English took 'ridiculous' (worth laughing at), 'ridicule' and 'deride', laughing down at someone. Italian <em>il sorriso</em> (smile) is a small laugh: <em>sub</em> + <em>ridere</em>, 'laughing under'.",
    godere: "Latin <em>gaudere</em>, 'to rejoice'. Its plural noun <em>gaudia</em> (joys) became French <em>joie</em>, giving English 'joy' and 'enjoy'. The old student song <em>Gaudeamus igitur</em> means 'so let us rejoice'. Note the stress on the ending: <em>go·dè·re</em>.",
    battere: "Late Latin <em>battere</em>, from <em>battuere</em>, 'to beat'. English took 'battle', 'combat' and 'debate', a beating-out of arguments. 'Battery' first meant a beating, then a group of cannon firing together, and finally a set of electric cells.",
    offrire: "Latin <em>offerre</em>, 'to bring before', from <em>ob-</em> (towards) + <em>ferre</em> (to carry). An offering was carried to the altar. English 'offer' is the same word, and <em>ferre</em> links it to <em>preferire</em> and <em>soffrire</em>. Italians say <em>offro io</em>, 'I'm offering', to pick up the bill.",
    aprire: "Latin <em>aperire</em>, 'to open'. English 'aperture' is an opening, and the 'aperitif', Italian <em>l'aperitivo</em>, is the drink that opens your appetite before dinner.",
    coprire: "Latin <em>cooperire</em>, 'to cover completely'. French made it <em>couvrir</em>, the source of English 'cover', and of two hidden relatives: 'curfew', from <em>couvre-feu</em> (cover the fire) at night, and 'kerchief', from <em>couvre-chef</em> (cover the head).",
    soffrire: "Latin <em>sufferre</em>, 'to carry from below, to bear', from <em>sub</em> (under) + <em>ferre</em> (to carry). Suffering is bearing a weight. English 'suffer' is the same word, and it's a sibling of <em>offrire</em> and <em>preferire</em>.",
    vestire: "Latin <em>vestire</em>, from <em>vestis</em> (clothing). English 'vest' and 'vestment' are the obvious relatives. 'Invest' first meant to clothe someone in the robes of office, and 'travesty' comes from Italian <em>travestire</em>, to disguise, literally to dress across.",
    garantire: "From French <em>garantir</em>, from <em>garant</em>, a word of Germanic origin. Germanic <em>w</em> often became <em>gu</em> or <em>g</em> in French and Italian, so English has the same word twice: 'guarantee', through French, and 'warrant', from the northern dialect that kept the <em>w</em>. Compare <em>guardare</em> and English 'ward'.",
    suggerire: "Latin <em>suggerere</em>, 'to bring up from below', from <em>sub</em> (under) + <em>gerere</em> (to carry). In Italian theatre the prompter is <em>il suggeritore</em>, whispering lines from a box at the foot of the stage, a perfect picture of the word. English 'suggest' is the same verb.",
    sostituire: "Latin <em>substituere</em>, 'to put in place of', from <em>sub</em> (under) + <em>statuere</em> (to set up, to place). A substitute is set up in someone's place. <em>Statuere</em> also built 'statute', 'institute' and 'constitute'. Mind the stress and the separate vowels: <em>so·sti·tu·ì·sco</em>.",
    vedere: "Latin <em>videre</em>, 'to see'. English took 'video' (Latin for 'I see'), 'vision', 'evident', 'provide' (to see ahead) and, through French, 'view'. <em>Ci vediamo!</em> means 'see you!'.",
    sembrare: "From Latin <em>similare</em>, 'to be like', through Old French; <em>similis</em> also gave English 'similar', 'semblance' and 'resemble'. <em>Mi sembra</em>: it seems to me, I think.",
    prendere: "Latin <em>prehendere</em>, 'to seize, to grasp'. English 'apprehend', 'comprehend' (to grasp fully) and 'prison', a place where you're held. Italians <em>prendono</em> a coffee, a train and a decision.",
    mettere: "Latin <em>mittere</em> meant 'to send, to let go' before Italian narrowed it to 'to put'. Its English family is huge: 'mission', 'message', 'admit', 'permit', 'promise', 'submit' — and <em>permettere</em> and <em>smettere</em> in this deck.",
    conoscere: "Latin <em>cognoscere</em>, 'to get to know', the source of English 'recognise', 'cognition' and 'connoisseur', one who knows. It's for knowing people and places; facts and skills are <em>sapere</em>.",
    chiedere: "Latin <em>quaerere</em>, 'to seek, to ask'. English 'query', 'inquire', 'request' and 'question' come from the same verb. It's the everyday word for asking, whether for things or answers; <em>domandare</em> is close to it and a touch more formal.",
    restare: "Latin <em>restare</em>, 'to stay behind', from <em>re-</em> + <em>stare</em> (to stand). English 'rest', what remains, and 'arrest', to make something stop. <em>Restare</em> and <em>rimanere</em> are near-synonyms.",
    scusare: "From Latin <em>excusare</em>, 'to free from blame' (<em>ex</em> + <em>causa</em>, a charge). English 'excuse' is the same word. <em>Scusa!</em> and the polite <em>mi scusi!</em> are how you say 'excuse me' or 'sorry'.",
    trattare: "Latin <em>tractare</em>, 'to handle, to drag about', from <em>trahere</em> (to pull). English 'treat', 'treaty' and 'tractable'. <em>Si tratta di…</em> means 'it's about…'.",
    pregare: "Latin <em>precari</em>, 'to pray, to entreat'. English 'pray' and 'precarious', first 'obtained by asking', so uncertain. <em>Prego</em>, 'I pray you', is the all-purpose 'please', 'you're welcome' and 'go ahead'.",
    significare: "Latin <em>significare</em>, 'to make a sign', from <em>signum</em> + <em>facere</em>. English 'signify' and 'significant'. <em>Cosa significa?</em> — what does it mean? Stress: <em>si·gnì·fi·co</em>.",
    rendere: "From Latin <em>reddere</em>, 'to give back', reshaped in spoken Latin to rhyme with <em>prendere</em>. English 'render' and 'rent', what you pay back, come from it. <em>Rendere felice</em>: to make happy.",
    scrivere: "Latin <em>scribere</em>. English 'scribe', 'script', 'describe' and 'scribble' share it. <em>Lo scrittore</em> is a writer.",
    rispondere: "Latin <em>respondere</em>, 'to pledge in return', from <em>spondere</em> (to pledge). English 'respond' and 'responsible', answerable. <em>Spondere</em> also gave 'sponsor' and 'spouse' — someone pledged.",
    esistere: "Latin <em>existere</em>, 'to stand out, to emerge', from <em>ex</em> + <em>sistere</em> (to stand): to exist is to stand out into being. English 'exist' and 'existence'.",
    intendere: "Latin <em>intendere</em>, 'to stretch towards': to intend is to stretch your mind towards something. English 'intend', 'intention' and 'intense'. <em>Cosa intendi?</em> means 'what do you mean?'.",
    funzionare: "From <em>la funzione</em>, Latin <em>functio</em>, 'a performance'. English 'function'. <em>Non funziona!</em> — it doesn't work — is one of the most useful sentences in Italian.",
    leggere: "Latin <em>legere</em>, 'to gather, to pick', and so to read, picking out letters. English 'legend' (things to be read), 'lecture' and 'legible'; <em>intelligente</em> comes from <em>inter</em> + <em>legere</em>.",
    odiare: "From <em>l'odio</em>, Latin <em>odium</em>, 'hatred', a word English still uses. The phrase <em>in odio</em> also gave Italian <em>noia</em> and English 'annoy'.",
    uccidere: "Latin <em>occidere</em>, 'to strike down', from <em>ob</em> + <em>caedere</em> (to cut). <em>Caedere</em> hides in English '-cide' words like 'homicide' and 'pesticide', and in 'decide', literally 'to cut off' (see <em>decidere</em>).",
    chiudere: "Latin <em>claudere</em>, 'to shut'. English 'close', 'closet', 'clause', 'conclude' and 'exclude'. Compare <em>chiuso</em>.",
    vincere: "Latin <em>vincere</em>, 'to conquer'. English 'victory', 'invincible' and 'convince', to win an argument over. Caesar's <em>veni, vidi, vici</em>: I came, I saw, I conquered.",
    scoprire: "<em>S-</em> (undo) + <em>coprire</em> (to cover): to uncover, and so to discover. English 'discover' is built the same way. It doesn't take <em>-isc-</em>: <em>scopro</em>.",
    creare: "Latin <em>creare</em>, 'to bring forth, to make grow'. English 'create', 'creature' and 'recreation'. Mind the forms: <em>creo, crei, crea, creiamo</em>.",
    permettere: "Latin <em>permittere</em>, 'to let go through', from <em>per</em> + <em>mittere</em>. English 'permit' and 'permission'. <em>Permesso?</em> — may I? — is what you say entering someone's home.",
    fermare: "From Latin <em>firmare</em>, 'to make firm, to fix in place', the root of English 'firm' and 'confirm'. A bus stop is <em>la fermata</em>.",
    girare: "From <em>il giro</em>, Latin <em>gyrus</em>, from Greek <em>gyros</em>, a circle; English 'gyroscope' shares it. Italians also <em>girano</em> a film: they shoot it, from the days of turning a camera's crank.",
    raccontare: "<em>Ri-</em> + <em>accontare</em>, to count out: telling a story was going through events one by one. English 'recount' and 'account' use the same image. <em>Il racconto</em> is a short story.",
    decidere: "Latin <em>decidere</em>, 'to cut off' (<em>de</em> + <em>caedere</em>): deciding cuts off the other options. English 'decide', 'decision' and 'decisive'.",
    sparare: "Of debated origin, perhaps <em>s-</em> + <em>parare</em>. Besides firing a gun, it's used for saying something outrageous: <em>spararle grosse</em>, to tell whoppers.",
    ballare: "Late Latin <em>ballare</em>, 'to dance', from Greek. English 'ball' (a dance), 'ballet' and 'ballad', first a song to dance to, share it.",
    interessare: "From Latin <em>interesse</em>, 'to be between, to matter' (see <em>interessante</em>). Like <em>piacere</em>, it's often turned round: <em>mi interessa</em>, it interests me.",
    sposare: "Latin <em>sponsare</em>, 'to betroth', from <em>spondere</em>, to pledge — the root of <em>rispondere</em> too. English 'spouse' and 'sponsor'. <em>Gli sposi</em> are the bride and groom.",
    evitare: "Latin <em>evitare</em>, 'to shun'. English 'inevitable' is what can't be avoided. Mind the stress: <em>è·vi·to</em>, not <em>e·vì·to</em>.",
    sbagliare: "Of uncertain origin; one theory links it to <em>abbagliare</em>, to dazzle. <em>Sbagliando s'impara</em>: you learn by making mistakes. Compare <em>sbagliato</em>.",

  // History notes for every irregular verb, including why it's irregular
  const IRREG_NOTES = {
    essere: "Latin <em>esse</em>, irregular in nearly every European language. Its forms come from two ancient roots: <em>es-</em> (<em>è</em>, <em>siamo</em>, <em>era</em>) and <em>fu-</em> (<em>fui</em>). English 'essence' and 'essential' come from <em>esse</em>, and 'future' from the <em>fu-</em> root (<em>futurus</em>, 'about to be'). Note that io and loro share <em>sono</em>: context tells them apart.",
    avere: "Latin <em>habere</em>, 'to hold, to have'. The <em>h</em> in <em>ho, hai, ha, hanno</em> is never pronounced; it's there only to tell them from <em>o</em> (or), <em>ai</em> (to the), <em>a</em> (to) and <em>anno</em> (year). English 'habit' and 'inhabit' share the root, and 'able' comes from <em>habilis</em>, 'easy to hold'.",
    fare: "Latin <em>facere</em>, worn down in speech to <em>fare</em>; the old stem <em>fac-</em> returns in <em>faccio</em> and <em>facciamo</em>. English took 'fact', 'factory', 'fashion' (French <em>façon</em>) and 'affair' (<em>à faire</em>, 'to do'). Voi <em>fate</em> is one of only three voi forms that break the pattern, with <em>siete</em> and <em>dite</em>.",
    potere: "From Vulgar Latin <em>potere</em>, a regularised form of Latin <em>posse</em>, 'to be able'. Its family is about power: English 'potent', 'potential', 'possible', and 'power' itself, through French. The stressed <em>o</em> splits into <em>uo</em> in <em>puoi</em> and <em>può</em>, the same change that turned Latin <em>ovum</em> into <em>uovo</em>.",
    stare: "Latin <em>stare</em>, 'to stand'. Italian uses it for how you are (<em>sto bene</em>), where you stay, and with <em>-ando/-endo</em> for what you're doing right now (<em>sto leggendo</em>). English 'state', 'station' and 'stable' come from it, and 'stand' is a Germanic cousin.",
    dire: "Latin <em>dicere</em>, shortened to <em>dire</em>; the full stem <em>dic-</em> comes back in <em>dico</em>, <em>diciamo</em> and <em>dicono</em>. English took 'dictionary', 'diction', 'predict' and 'contradict'. Voi <em>dite</em> is one of the three irregular voi forms.",
    andare: "A patchwork verb. <em>Vado, vai, va, vanno</em> come from Latin <em>vadere</em> (to go), while <em>andiamo</em> and <em>andate</em> come from <em>andare</em> itself, whose origin is uncertain; one theory is Latin <em>ambulare</em>, to walk. French does the same: <em>je vais</em> but <em>nous allons</em>.",
    volere: "From Vulgar Latin <em>volere</em>, Latin <em>velle</em>, 'to want'. English 'voluntary', 'volunteer' and 'benevolent' (wishing well) share it. Like <em>potere</em>, the stressed <em>o</em> splits into <em>uo</em>: <em>vuoi</em>, <em>vuole</em>.",
    sapere: "Latin <em>sapere</em> first meant 'to taste, to have flavour', and so 'to be wise': a wise person had good taste. <em>Homo sapiens</em> is 'the wise human', and English 'savour' and 'savvy' come from it. <em>Sapere</em> is knowing facts and how to do things; knowing people and places is <em>conoscere</em>.",
    dovere: "Latin <em>debere</em>, 'to owe', which is why <em>devo</em> means both 'I have to' and 'I owe'. English 'debt', 'debit' and 'due' come from the same verb. The old <em>b</em> survives in <em>dobbiamo</em>, and you may meet the older forms <em>debbo</em> and <em>debbono</em>.",
    venire: "Latin <em>venire</em>, 'to come'. English took 'venue', 'event', 'convention', 'adventure' and 'souvenir' (French, 'to come to mind'). It has both classic irregularities: io and loro add a <em>g</em> (<em>vengo</em>, <em>vengono</em>), and the stressed <em>e</em> splits into <em>ie</em> (<em>vieni</em>, <em>viene</em>).",
    dare: "Latin <em>dare</em>, 'to give', which reached Italian almost untouched. <em>Dà</em> carries an accent only to tell it apart from <em>da</em> (from). English 'date' comes from it, from letters headed <em>data Romae</em>, 'given at Rome', and so does 'data', things given.",
    piacere: "Latin <em>placere</em>, 'to please'. Italian turns English round: <em>mi piace il caffè</em> is literally 'coffee pleases me', so the thing you like is the subject. English 'please', 'pleasant' and 'placid' are relatives. The <em>c</em> doubles in <em>piaccio</em>, <em>piacciamo</em> and <em>piacciono</em>.",
    riuscire: "<em>Ri-</em> + <em>uscire</em>: literally 'to go out again', and so to come out well at the end. <em>Riuscire a</em> means to manage to: <em>riesco a capire</em>, 'I manage to understand'. It keeps <em>uscire</em>'s switch from <em>u</em> to <em>e</em> when stressed: <em>riesco</em>, <em>riesce</em>.",
    uscire: "From Latin <em>exire</em>, 'to go out', reshaped by <em>uscio</em> (doorway). English 'exit' comes from <em>exire</em>. When the stem is stressed it becomes <em>e</em> (<em>esco, esci, esce, escono</em>); unstressed it keeps <em>u</em> (<em>usciamo, uscite</em>).",
    tenere: "Latin <em>tenere</em>, 'to hold'. English got 'tenant' (a holder), 'tenacious' and 'tenor', the voice that held the melody. It shows both irregular patterns at once: a <em>g</em> in <em>tengo/tengono</em> and <em>ie</em> in <em>tieni/tiene</em>.",
    rimanere: "Latin <em>remanere</em>, from <em>re-</em> + <em>manere</em> (to stay). English 'remain' is the same verb, and <em>manere</em> also gives 'mansion' (a dwelling) and 'permanent'. Like the <em>-go</em> verbs it adds a <em>g</em>: <em>rimango</em>, <em>rimangono</em>. <em>Stare</em> is staying put; <em>rimanere</em> is remaining, being left.",
    parere: "Latin <em>parere</em>, 'to appear', the source of English 'appear' and 'apparent'. It's mostly used impersonally: <em>mi pare</em>, 'it seems to me'. <em>Il parere</em> is also a noun, an opinion, literally how things appear to someone.",
    morire: "Latin <em>mori</em>, 'to die'. English 'mortal' and 'mortgage' (French, a 'death pledge') are relatives. The stressed <em>o</em> splits into <em>uo</em>: <em>muoio, muori, muore, muoiono</em>; unstressed it stays: <em>moriamo, morite</em>.",
    ottenere: "Latin <em>obtinere</em>, 'to hold on to, to obtain', from <em>ob-</em> + <em>tenere</em>. English 'obtain' is the same verb. It follows <em>tenere</em> exactly: <em>ottengo, ottieni, ottiene, ottengono</em>.",
    valere: "Latin <em>valere</em>, 'to be strong, to be worth'. English 'value', 'valid', 'valiant' and 'available' come from it, and Romans said <em>vale!</em>, 'be well', for goodbye. It adds a <em>g</em> in <em>valgo</em> and <em>valgono</em>. <em>Vale la pena</em>: it's worth it.",
    scegliere: "From Vulgar Latin <em>exeligere</em>, 'to pick out', built on the <em>eligere</em> behind English 'elect' and 'elegant' (well-chosen). Io and loro swap the <em>l</em> and <em>g</em> around: <em>scelgo</em>, <em>scelgono</em>.",
    sostenere: "Latin <em>sustinere</em>, 'to hold up from below' (<em>sub</em> + <em>tenere</em>). English 'sustain' is the same verb. Italian also uses it for holding an opinion: <em>sostengo che…</em>, 'I maintain that…'. Conjugated like <em>tenere</em>.",
    mantenere: "From <em>manu tenere</em>, 'to hold in the hand'. English 'maintain' is the same word, through French. <em>Mantenere una promessa</em> is to keep a promise. Conjugated like <em>tenere</em>: <em>mantengo, mantieni</em>.",
    salire: "Latin <em>salire</em> meant 'to leap'; in Italian it settled on going up: <em>salire le scale</em>, <em>salire sul treno</em> (to get on the train). The leap survives in <em>saltare</em> and English 'salient'. It adds a <em>g</em>: <em>salgo</em>, <em>salgono</em>.",
    apparire: "Latin <em>apparere</em>, 'to come into view', from <em>ad-</em> + <em>parere</em>. English 'appear', 'apparent' and 'apparition'. It slips an <em>i</em> into io and loro, <em>appaio</em> and <em>appaiono</em>, just like <em>parere</em> (<em>paio</em>, <em>paiono</em>).",
    proporre: "Latin <em>proponere</em>, 'to put forward'. English 'propose' and 'proposition'. Like every verb built on <em>porre</em>, its present comes from the older Latin stem <em>pon-</em>: <em>propongo, proponi, propone</em>.",
    produrre: "Latin <em>producere</em>, 'to lead forward, to bring forth'. English 'produce', 'product' and 'production'. All the <em>-durre</em> verbs run on the Latin stem <em>duc-</em>: <em>produco, produci, produciamo</em>.",
    contenere: "Latin <em>continere</em>, 'to hold together', the source of English 'contain', 'content' and 'continent'. Conjugated exactly like <em>tenere</em>: <em>contengo, contieni, contiene</em>.",
    bere: "A squeezed form of Latin <em>bibere</em>, 'to drink'; the present runs on the fuller stem <em>bev-</em>: <em>bevo, bevi, beviamo</em>. English 'beverage' and 'imbibe' share it.",
    porre: "A shortened Latin <em>ponere</em>, 'to place'; the present uses the full stem <em>pon-</em>: <em>pongo, poni, poniamo</em>. English took 'position', 'post', 'compose', 'expose' and 'opponent'. <em>Porre una domanda</em> is to ask a question.",
    togliere: "From Latin <em>tollere</em>, 'to lift, to take away'. It's how Italians take clothes off or remove things: <em>togliersi le scarpe</em>. Io and loro swap <em>l</em> and <em>g</em>: <em>tolgo</em>, <em>tolgono</em>.",
    raccogliere: "<em>Ri-</em> + <em>accogliere</em>, from Latin <em>colligere</em>, 'to gather', the source of English 'collect'. <em>La raccolta</em> is a harvest or a collection. Like <em>cogliere</em>: <em>raccolgo</em>, <em>raccolgono</em>.",
    ridurre: "Latin <em>reducere</em>, 'to lead back'. English 'reduce' first meant to bring back; shrinking came later. On the Latin stem <em>duc-</em>: <em>riduco, riduci, riduciamo</em>.",
    appartenere: "From Late Latin <em>appertinere</em>, 'to belong to', from <em>ad</em> + <em>pertinere</em> (to reach, to concern). English 'appertain' and 'pertinent' are cousins. Conjugated like <em>tenere</em>: <em>appartengo, appartieni</em>.",
    dispiacere: "<em>Dis-</em> + <em>piacere</em>: to displease. Its everyday use is <em>mi dispiace</em>, 'it displeases me', which is how Italians say 'I'm sorry'. Conjugated like <em>piacere</em>, with the doubled <em>c</em>: <em>dispiaccio</em>, <em>dispiacciono</em>.",
    possedere: "Latin <em>possidere</em>, 'to occupy, to own', probably from <em>potis</em> (able) + <em>sedere</em> (to sit): to own is to sit firmly on something. English 'possess' is the same verb. Like <em>sedere</em>, the stressed <em>e</em> splits: <em>possiedo</em>, <em>possiede</em>.",
    condurre: "Latin <em>conducere</em>, 'to lead together'. English 'conduct' and 'conductor' come from it, and 'duke' from <em>dux</em>, a leader, from the same root. On the Latin stem <em>duc-</em>: <em>conduco, conduci</em>.",
    intervenire: "Latin <em>intervenire</em>, 'to come between'. English 'intervene' and 'intervention'. It's <em>venire</em> with a prefix, so it has both of <em>venire</em>'s quirks: <em>intervengo</em>, <em>intervieni</em>.",
    imporre: "Latin <em>imponere</em>, 'to place upon'. English 'impose', 'imposition' and 'impostor'. On the stem <em>pon-</em>: <em>impongo, imponi</em>.",
    disporre: "Latin <em>disponere</em>, 'to set out in order'. English 'dispose' and 'disposition'. <em>Disporre di</em> means to have something available: <em>disponiamo di poco tempo</em>, 'we have little time'. On the stem <em>pon-</em>: <em>dispongo, disponi</em>.",
    provenire: "Latin <em>provenire</em>, 'to come forth'. English 'provenance' is where something comes from. <em>Provengo da Milano</em>, 'I come from Milan'. Conjugated like <em>venire</em>: <em>provengo, provieni</em>.",
    convenire: "Latin <em>convenire</em>, 'to come together', hence 'to agree'. English 'convene', 'convent' (a coming-together) and 'convenient'. It's most often impersonal: <em>conviene</em>, 'it's worth it, it suits'. Conjugated like <em>venire</em>.",
    accogliere: "From Latin <em>ad</em> + <em>colligere</em>, 'to gather to oneself', and so to welcome. <em>L'accoglienza</em> is a welcome. It follows <em>cogliere</em>: <em>accolgo</em>, <em>accolgono</em>.",
    sedere: "Latin <em>sedere</em>, 'to sit'. English 'sedentary', 'session', 'president' (one who sits in front) and 'residence'. Everyday Italian mostly uses <em>sedersi</em>: <em>mi siedo</em>, 'I sit down'. The stressed <em>e</em> splits: <em>siedo, siedi, siede, siedono</em>.",
    tradurre: "Latin <em>traducere</em>, 'to lead across': translating carries meaning across from one language to another. English 'translate' uses the same image from a different verb (<em>translatus</em>, 'carried across'). On the stem <em>duc-</em>: <em>traduco, traduci</em>.",
    introdurre: "Latin <em>introducere</em>, 'to lead inside'. Careful: <em>introdurre</em> is to insert or bring something in; introducing people is <em>presentare</em>. On the stem <em>duc-</em>: <em>introduco, introduci</em>.",
    divenire: "Latin <em>devenire</em>, 'to come to', the older and more formal twin of <em>diventare</em>. English uses the same picture: 'be-come'. Conjugated like <em>venire</em>: <em>divengo, divieni</em>.",
    supporre: "Latin <em>supponere</em>, 'to put under', and so to assume as a basis. English 'suppose' and 'supposition'. On the stem <em>pon-</em>: <em>suppongo, supponi</em>.",
    cogliere: "From Latin <em>colligere</em>, 'to gather', the same verb as English 'collect'. <em>Cogliere</em> is picking flowers or fruit, and figuratively seizing: <em>cogliere l'occasione</em>, to seize the chance. Io and loro swap <em>l</em> and <em>g</em>: <em>colgo</em>, <em>colgono</em>."

  // Helpers ported verbatim (normalize renamed so it doesn't clash with the nouns')
  function normalizeAdj(s) {
    return s
      .toLowerCase()
      .trim()
      .replace(/[\u2018\u2019\u02BC\u02B9´`']/g, '')
      .replace(/[àáâã]/g, 'a')
      .replace(/[èéêë]/g, 'e')
      .replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o')
      .replace(/[ùúûü]/g, 'u')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function typeLabel(t) {
    if (t === '4')   return '4-form · -o,-a,-i,-e';
    if (t === '2')   return '2-form · -e,-i';
    if (t === 'inv') return 'invariable';
    return '';
  }

  // For 4-form adjectives ending in -o, the feminine singular is the same
  // stem with -a. 2-form and invariable adjectives have only one singular
  // form, so no alternate to add.
  function acceptedForms(a) {
    const accepted = [a.it];
    if (a.type === '4' && a.it.endsWith('o')) {
      accepted.push(a.it.slice(0, -1) + 'a');
    }
    return accepted;
  }

  const ADJ_NEW_NOTES = {
    "altro": "From Latin <em>alter</em>, 'the other (of two)' — English 'alter', 'alternative'. In a shop, <em>Altro?</em> means 'Anything else?'",
    "stesso": "From spoken Latin <em>istum ipsum</em>, 'that very one'. <em>Lo stesso</em>: the same; after a pronoun it means '-self': <em>io stesso</em>, I myself.",
