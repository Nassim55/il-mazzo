    "migliore": "From Latin <em>melior</em> — English 'ameliorate'. It is <em>buono</em>'s comparative: <em>migliore</em> is 'better', and with the article 'the best': <em>il migliore</em>.",
    "unico": "From Latin <em>unicus</em>, from <em>unus</em> 'one' — English 'unique'. <em>Figlio unico</em>: only child. Stressed on <em>U</em>, so the plural is <em>unici</em> (but <em>uniche</em>).",
    "secondo": "From Latin <em>secundus</em>, 'following', from <em>sequi</em> 'to follow' — English 'sequence'. Also a preposition: <em>secondo me</em>, in my opinion.",
    "pronto": "From Latin <em>promptus</em>, 'brought forward, at hand' — English 'prompt'. Italians answer the phone with <em>Pronto?</em> — 'ready (to listen)'.",
    "possibile": "From Latin <em>possibilis</em>, from <em>posse</em> 'to be able' — the root of <em>potere</em>. Two forms: <em>possibile</em>, <em>possibili</em>.",
    "terzo": "From Latin <em>tertius</em>, from <em>tres</em> 'three' — English 'tertiary'.",
    "diverso": "From Latin <em>diversus</em>, 'turned different ways' — English 'diverse', 'divert'. <em>Diverso da</em>: different from. Before a plural noun it means 'several': <em>diversi giorni</em>.",
    "maggiore": "From Latin <em>maior</em>, 'greater' — English 'major', 'mayor'. <em>Fratello maggiore</em>: older brother; <em>la maggior parte</em>: most of.",
    "bravo": "Origin uncertain, perhaps Latin <em>barbarus</em>, 'wild'. It first meant bold — English 'brave' comes from it through French. Now it means good at something: <em>è brava in cucina</em>.",
    "umano": "From Latin <em>humanus</em> — English 'human', 'humane'. <em>L'essere umano</em>: the human being.",
    "perfetto": "From Latin <em>perfectus</em>, 'completely made' (<em>per</em> + <em>facere</em>). <em>Perfetto!</em> is an everyday reply: 'Great, that works.'",
    "ottimo": "From Latin <em>optimus</em>, 'best' — English 'optimal', 'optimist'. It completes <em>buono</em>: <em>buono</em>, <em>migliore</em>, <em>ottimo</em>.",
    "pubblico": "From Latin <em>publicus</em>, 'of the people' — English 'public', 'publish'. As a noun, <em>il pubblico</em> is the audience. Plural <em>pubblici</em>, <em>pubbliche</em>.",
    "strano": "From Latin <em>extraneus</em>, 'from outside' — English 'strange' (through French) and 'extraneous'. <em>Straniero</em>, a foreigner, shares the root.",
    "semplice": "From Latin <em>simplex</em>, 'one-fold' — English 'simple'. Two forms: <em>semplice</em>, <em>semplici</em>.",
    "chiaro": "From Latin <em>clarus</em>, 'bright' — English 'clear', 'clarity'. Latin <em>cl-</em> becomes <em>chi-</em>, as in <em>chiave</em> from <em>clavis</em>. Of colours it means light: <em>blu chiaro</em>.",
    "speciale": "From Latin <em>specialis</em>, 'of a particular kind' (<em>species</em>) — English 'special', 'species'.",
    "fantastico": "From Greek <em>phantastikos</em>, 'able to imagine' — English 'fantastic', 'fantasy'. Plural <em>fantastici</em>, <em>fantastiche</em>.",
    "presente": "From Latin <em>praesens</em>, 'at hand' — English 'present'. <em>Presente!</em> is the answer to a roll call.",
    "necessario": "From Latin <em>necessarius</em>, from <em>necesse</em>, 'unavoidable' — English 'necessary'. The plural has a single <em>i</em>: <em>necessari</em>.",
    "generale": "From Latin <em>generalis</em>, 'of the whole kind' (<em>genus</em>) — English 'general', 'generic'. <em>In generale</em>: in general.",
    "simile": "From Latin <em>similis</em>, 'like' — English 'similar', 'simile'. <em>Simile a</em>: similar to.",
    "ufficiale": "From Late Latin <em>officialis</em>, from <em>officium</em>, 'duty' — English 'official', 'office'. As a noun, <em>un ufficiale</em> is an officer.",
    "scorso": "The past participle of <em>scorrere</em>, 'to run by': <em>la settimana scorsa</em> is the week that has run past. <em>Ultimo</em> is last of a series.",
    "stupido": "From Latin <em>stupidus</em>, 'stunned', from <em>stupere</em>, 'to be amazed' — English 'stupid', 'stupor', 'stupendous'.",
    "intero": "From Latin <em>integer</em>, 'untouched' — English 'integer', 'integral', and 'entire' through French. <em>Il mondo intero</em>: the whole world.",
    "sociale": "From Latin <em>socialis</em>, from <em>socius</em>, 'companion' — English 'social', 'society', 'associate'.",
    "vicino": "From Latin <em>vicinus</em>, from <em>vicus</em>, 'village' — English 'vicinity'. <em>Vicino a</em>: near; as a noun, <em>il vicino</em> is the neighbour.",
    "reale": "Two Latin words met here: <em>realis</em>, 'real' (from <em>res</em>, thing), and <em>regalis</em>, 'royal' (from <em>rex</em>, king). <em>Il palazzo reale</em> is the royal palace.",
    "precedente": "From Latin <em>praecedens</em>, 'going before' — English 'precedent', 'preceding'. <em>Il giorno precedente</em>: the day before.",
    "superiore": "From Latin <em>superior</em>, 'higher' — English 'superior'. <em>La scuola superiore</em> is secondary school.",
    "normale": "From Latin <em>normalis</em>, 'made with a carpenter's square' (<em>norma</em>) — English 'normal', 'norm'.",
    "tranquillo": "From Latin <em>tranquillus</em>, 'still' — English 'tranquil'. <em>Tranquillo!</em> means 'Relax, don't worry.'",
    "principale": "From Latin <em>principalis</em>, 'first, chief' (<em>princeps</em>) — English 'principal', 'prince'. <em>La via principale</em>: the main street.",
    "nazionale": "From <em>nazione</em> — Latin <em>natio</em>, 'birth, people', from <em>nasci</em>, 'to be born' — English 'national', 'native'.",
    "locale": "From Latin <em>localis</em>, from <em>locus</em>, 'place' — English 'local', 'location'. As a noun, <em>un locale</em> is a bar or venue.",
    "esatto": "From Latin <em>exactus</em>, 'precisely measured' — English 'exact'. <em>Esatto!</em> is how Italians say 'Exactly!'",
    "salvo": "From Latin <em>salvus</em>, 'whole, safe' — English 'safe' through French, and 'salvation'. <em>Sano e salvo</em>: safe and sound. <em>Sicuro</em> is safe as in secure.",
    "lontano": "From spoken Latin <em>longitanus</em>, from <em>longe</em>, 'far' — a relative of <em>lungo</em>. <em>Lontano da</em>: far from.",
    "segreto": "From Latin <em>secretus</em>, 'set apart' — English 'secret'. Also a noun: <em>un segreto</em>.",
    "pazzo": "Origin uncertain. <em>Andare pazzo per</em>: to be crazy about something.",
    "politico": "From Greek <em>politikos</em>, 'of citizens' (<em>polis</em>, city) — English 'political'. <em>Il politico</em> is the politician; <em>la politica</em>, politics.",
    "fermo": "From Latin <em>firmus</em>, 'firm, steady' — English 'firm', 'confirm'. <em>Stai fermo!</em>: keep still. <em>La fermata</em>, the bus stop, comes from it.",
    "attento": "From Latin <em>attentus</em>, 'stretched towards' (<em>ad</em> + <em>tendere</em>) — English 'attentive'. <em>Attento!</em> means 'Watch out!'",
    "privato": "From Latin <em>privatus</em>, 'set apart, not public' — English 'private', 'deprive'.",
    "personale": "From Latin <em>personalis</em>, from <em>persona</em> — English 'personal'. As a noun, <em>il personale</em> is the staff.",
    "breve": "From Latin <em>brevis</em>, 'short' — English 'brief', 'abbreviate'. <em>In breve</em>: in short. <em>Corto</em> is short in length.",
    grande: "Latin <em>grandis</em>, 'full-grown, large'. English 'grand' and 'grandeur'. Before a noun it can shorten to <em>gran</em> (<em>un gran giorno</em>), and position changes the meaning: <em>un uomo grande</em> is a big man, <em>un grande uomo</em> a great one.",
    piccolo: "Of uncertain origin, perhaps an expressive root <em>pikk-</em> for something tiny. English borrowed it for the little flute, the piccolo, from Italian <em>flauto piccolo</em>, 'small flute' — though Italians usually call it <em>l'ottavino</em>.",
    alto: "Latin <em>altus</em>, which meant both 'high' and 'deep', measured from either end. English 'altitude' comes from it, and so does the alto voice, originally a high male part. For people, <em>alto</em> means tall.",
    basso: "Late Latin <em>bassus</em>, 'low, thickset'. Music took it for the bass, the lowest voice, and English 'base' (low, mean) is related through French. For people, <em>basso</em> means short.",
    lungo: "Latin <em>longus</em>; English 'long' is its Germanic cousin, while 'longitude' and 'prolong' come from the Latin. It keeps its hard <em>g</em> in the plural by adding an <em>h</em>: <em>lunghi</em>, <em>lunghe</em>.",
    corto: "Latin <em>curtus</em>, 'shortened, cut off', the source of English 'curt', short in manner. <em>Corto</em> is short in length (<em>un viaggio corto</em>); a short person is <em>basso</em>.",
    grosso: "Late Latin <em>grossus</em>, 'thick, coarse'. English 'gross' comes from it, and so does 'grocer', first a merchant who sold in bulk. Italian <em>all'ingrosso</em> still means wholesale.",
    largo: "A false friend: <em>largo</em> means wide, not large (that's <em>grande</em>). Latin <em>largus</em> meant 'abundant, generous', which explains English 'largesse'. In music, <em>largo</em> is a broad, slow tempo.",
    stretto: "Latin <em>strictus</em>, 'drawn tight', from <em>stringere</em> (to bind). English got 'strict' and 'strait', a narrow sea passage, which in Italian is <em>lo stretto</em>, as in the Stretto di Messina.",
    profondo: "Latin <em>profundus</em>, from <em>pro-</em> + <em>fundus</em> (bottom): reaching far down. English 'profound' is the same word, and <em>fundus</em> is behind <em>il fondo</em> too.",
    leggero: "From Vulgar Latin <em>leviarius</em>, from <em>levis</em> (light), reaching Italian through Old French. English 'levity', 'lever' and 'relieve', lightening a burden, share the root. <em>Musica leggera</em> is pop music.",
    pesante: "From <em>pesare</em> (to weigh), from Latin <em>pensare</em>, the same verb behind <em>pensare</em>: thinking as weighing ideas. English 'poise' (balance, weight) and 'pensive' are distant cousins.",
    cattivo: "Latin <em>captivus</em>, 'a prisoner'. Christian writers called the sinner <em>captivus diaboli</em>, captive of the devil, and 'captive' slid into 'wicked'. English kept the original sense in 'captive'.",
    brutto: "Latin <em>brutus</em>, 'heavy, dull, stupid'. English 'brute' and 'brutal' come from the same word, as does the name Brutus. Italian also uses it for bad things: <em>brutto tempo</em>, bad weather.",
    vero: "Latin <em>verus</em>, 'true'. English 'verify', 'verdict' (a true saying) and 'very', which first meant 'truly'. <em>Davvero?</em> means 'really?'.",
    giusto: "Latin <em>iustus</em>, 'lawful, fair', from <em>ius</em> (law). English 'just', 'justice' and 'justify'. Italian also uses it for 'right, correct': <em>la risposta giusta</em>, the right answer.",
    sbagliato: "From <em>sbagliare</em> (to make a mistake), whose origin is uncertain; one theory links it to <em>abbagliare</em>, to dazzle. Bartenders know it from the <em>Negroni sbagliato</em>, the 'mistaken' Negroni made with prosecco instead of gin.",
    sicuro: "Latin <em>securus</em>, 'free from care', from <em>se-</em> (without) + <em>cura</em> (care). English 'secure' and 'sure' both come from it, which is why <em>sicuro</em> means sure and safe. Compare <em>la cura</em> and <em>la sicurezza</em>.",
    certo: "Latin <em>certus</em>, 'decided, settled', from <em>cernere</em> (to sift, to decide). English 'certain' and 'ascertain'. On its own, <em>certo!</em> means 'of course!'.",
    nuovo: "Latin <em>novus</em>. English 'novel' (a new kind of story), 'novice' and 'innovate'. The <em>uo</em> is the stressed-<em>o</em> split you've met in <em>uovo</em> and <em>può</em>.",
    vecchio: "From Latin <em>vetulus</em>, 'little old one', a fond diminutive of <em>vetus</em> (old), which gave English 'veteran'. Position matters: <em>un vecchio amico</em> is a long-standing friend, <em>un amico vecchio</em> an elderly one.",
    primo: "Latin <em>primus</em>, 'first'. English 'prime', 'primary' and 'prince', from <em>princeps</em>, 'first in rank'. Italian meals start with <em>il primo</em>, the pasta course, before <em>il secondo</em>.",
    ultimo: "Latin <em>ultimus</em>, 'farthest, last', from <em>ultra</em> (beyond). English 'ultimate' and 'ultimatum', the last word. <em>L'Ultima Cena</em> is the Last Supper.",
    giovane: "Latin <em>iuvenis</em>, 'young'. English 'juvenile' and 'junior' (<em>iunior</em>, 'younger') come from it. It's also a noun: <em>i giovani</em>, young people.",
    prossimo: "Latin <em>proximus</em>, 'nearest'. English 'proximity' and 'approximate', coming near. It usually goes before the noun (<em>la prossima volta</em>, next time), and <em>il prossimo</em> is one's neighbour: <em>ama il prossimo tuo</em>.",
    moderno: "Late Latin <em>modernus</em>, from <em>modo</em>, 'just now': modern is literally 'of just now'. English 'modern' is the same word.",
    antico: "Latin <em>antiquus</em>, from <em>ante</em> (before). English 'antique' and 'antiquity'. It's stressed <em>an·tì·co</em>, so its plural keeps the hard c with an h: <em>antichi</em>.",
    caldo: "Latin <em>calidus</em>, 'warm'. English 'cauldron' and 'scald' come from the same root. A trap for visitors: the tap marked <em>C</em> in Italy is <em>caldo</em>, hot.",
    freddo: "Latin <em>frigidus</em>, worn down to <em>freddo</em>. English 'frigid' shares it, as does Italian <em>il frigorifero</em>, the fridge, literally 'cold-maker'. The tap marked <em>F</em> is <em>freddo</em>.",
    veloce: "Latin <em>velox</em>, 'swift'. English 'velocity', and 'velocipede', the early bicycle, 'swift foot'. Two forms: <em>veloce</em>, <em>veloci</em>.",
    lento: "Latin <em>lentus</em>, 'pliant, slow'. Music uses <em>lento</em> for a slow tempo, and road signs say <em>rallentare</em>, slow down, built on the same word.",
    dolce: "Latin <em>dulcis</em>, the source of English 'dulcet', sweet-sounding. <em>Il dolce</em> is dessert, and <em>la dolce vita</em>, 'the sweet life', became famous through Fellini's 1960 film.",
    amaro: "Latin <em>amarus</em>, 'bitter'. <em>Un amaro</em> is a bitter herbal liqueur drunk after dinner, and <em>amaretti</em> are named for their slightly bitter almonds. Despite the look, it's unrelated to <em>amare</em>.",
    salato: "From <em>sale</em> (salt). Greens dressed with salt, Latin <em>herba salata</em>, gave English 'salad', and salt's value shows in 'salary', from Latin <em>salarium</em>.",
    duro: "Latin <em>durus</em>, 'hard'. Hard things last, so English 'durable', 'endure' and even 'during' (while something lasts) share the root.",
    morbido: "A surprising shift: Latin <em>morbidus</em> meant 'sickly', from <em>morbus</em> (disease), the source of English 'morbid'. In Italian the idea of something weak and yielding became 'soft': <em>un cuscino morbido</em>.",
    fresco: "From a Germanic word, <em>frisk</em>, the root of English 'fresh'. <em>Al fresco</em> means 'in the cool', outdoors, and a fresco is painted on fresh, wet plaster. Plural with h: <em>freschi</em>.",
    forte: "Latin <em>fortis</em>, 'strong, brave'. English 'fort', 'effort' and 'fortitude'. In music <em>forte</em> means loud, and the piano is really the <em>pianoforte</em>, 'soft-loud', because it could play both.",
    debole: "Latin <em>debilis</em>, 'feeble'. English 'debility' and 'debilitate'. <em>Avere un debole per…</em> means to have a soft spot for something.",
    facile: "Latin <em>facilis</em>, 'doable', from <em>facere</em> (to do), the verb behind <em>fare</em>. English 'facility' and 'facilitate'; English 'facile' has drifted to mean too easy, superficial.",
    difficile: "Latin <em>difficilis</em>: <em>dis-</em> (not) + <em>facilis</em> (doable). English 'difficult' and 'difficulty'.",
    felice: "Latin <em>felix</em>, which first meant 'fertile, fruitful', then 'lucky' and 'happy'. English 'felicity' and the names Felix and Felicity come from it.",
    triste: "Latin <em>tristis</em>, 'sad, gloomy', unchanged in French and Spanish. English never adopted it, so it's one to learn without a cognate. Two forms: <em>triste</em>, <em>tristi</em>.",
    stanco: "Of uncertain origin, perhaps linked to <em>stagnare</em>, to stand still, like water that has stopped flowing. Its plural keeps the hard c: <em>stanchi</em>, <em>stanche</em>. <em>Stanco morto</em>: dead tired.",
    contento: "Latin <em>contentus</em>, 'held together, satisfied', from <em>continere</em>. Being content is wanting nothing beyond what you hold. Compare <em>contenere</em> and English 'content'.",
    arrabbiato: "From <em>la rabbia</em>, Latin <em>rabies</em>, 'fury, madness', the name English uses for the disease. <em>Arrabbiato</em> is literally 'made rabid', and <em>penne all'arrabbiata</em> are 'angry penne', for their fiery chilli.",
    calmo: "From <em>la calma</em>, Late Latin <em>cauma</em>, from Greek <em>kauma</em>: the burning midday heat, when everything stops and rests. English 'calm' came the same way, through French.",
    nervoso: "Latin <em>nervosus</em>, 'sinewy, vigorous', from <em>nervus</em> (sinew, nerve). The meaning moved inward, from strong sinews to jittery nerves, in English too.",
    preoccupato: "Latin <em>praeoccupare</em>, 'to seize beforehand': a worry takes hold of your mind first. English 'preoccupied' is the same word, but Italian <em>preoccupato</em> leans more to 'worried'.",
    innamorato: "<em>In-</em> + <em>amore</em>: 'put into love'. English 'enamoured' is the same idea, through French. <em>Sono innamorato di te</em>: I'm in love with you.",
    ricco: "From a Germanic word, <em>rīhhi</em>, 'powerful', related to Gothic <em>reiks</em>, a ruler. English 'rich' is its direct cousin. Plural with h: <em>ricchi</em>.",
    povero: "Latin <em>pauper</em>, 'poor'. English 'poor', 'poverty' and 'pauper' all come from it. Before a noun it means pitiable: <em>povero Marco!</em>",
    caro: "Latin <em>carus</em>, 'dear', in both senses, beloved and costly, just as in English. English 'caress' and 'charity' (<em>caritas</em>, dearness) share it. <em>Caro amico</em> opens a letter; <em>troppo caro</em> means too expensive.",
    pieno: "Latin <em>plenus</em>, 'full'. English 'plenty', 'plenary' and 'replenish'. <em>Il pieno</em> is a full tank: <em>fare il pieno</em>, to fill up.",
    vuoto: "From Vulgar Latin <em>vocitus</em>, related to <em>vacuus</em> (empty). English 'void', through French, and 'vacuum' are cousins. The <em>uo</em> is the familiar stressed-<em>o</em> split.",
    aperto: "From <em>aprire</em>, Latin <em>apertus</em>. <em>All'aperto</em> means outdoors, 'in the open'. English 'aperture' is an opening, and 'overt' comes from the same word through French.",
    chiuso: "Latin <em>clausus</em>, from <em>claudere</em> (to shut). English 'close', 'closet', 'clause' and 'cloister' all come from it. On shop doors: <em>chiuso</em>.",
    pulito: "From <em>pulire</em>, Latin <em>polire</em>, to polish: clean was polished. English 'polished' and 'polite', someone with polished manners, are relatives.",
    sporco: "Latin <em>spurcus</em>, 'filthy, foul', an old word with no common English cousin. Plural with h: <em>sporchi</em>, <em>sporche</em>.",
    libero: "Latin <em>liber</em>, 'free'. English 'liberty', 'liberal' and 'deliver', to set free. In football the <em>libero</em> is the sweeper, the free defender behind the back line; on a taxi or a toilet door it means vacant.",
    occupato: "Latin <em>occupare</em>, 'to seize, to take up'. A seat, a phone line or a toilet is <em>occupato</em> when someone has taken it, and a person is <em>occupato</em> when busy. English 'occupied' is the same word.",
    comodo: "Latin <em>commodus</em>, 'convenient, fitting'. English 'commodity', a useful thing, 'accommodate' and 'commode' come from it. <em>Fai con comodo</em>: take your time.",
    rotto: "From <em>rompere</em> (to break), Latin <em>ruptus</em>. English 'rupture', 'interrupt' and 'erupt', and 'bankrupt', from Italian <em>banca rotta</em>, a broken bench. Compare <em>la banca</em>.",
    sano: "Latin <em>sanus</em>, 'healthy, sound'. English 'sane', of sound mind, 'sanitary' and 'sanatorium'. <em>Sano e salvo</em>: safe and sound.",
    malato: "From Latin <em>male habitus</em>, 'in poor condition'. French made it <em>malade</em>, which gave English 'malady'. Italian <em>la malattia</em> is an illness.",
    vivo: "Latin <em>vivus</em>, 'alive'. English 'vivid' and 'revive'. <em>Dal vivo</em> means live, as in a concert. Compare <em>vivere</em>.",

    "buonanotte": "'Good night' — only for bedtime or the very end of the night. Leaving a dinner, say <em>buonasera</em> or <em>buona serata</em>.",
    "salve": "Latin <em>salve</em>, 'be well', the Romans' own greeting, from the root of <em>salute</em> and <em>salvo</em>. A handy neutral hello when <em>ciao</em> is too casual and <em>buongiorno</em> feels too formal.",
    "arrivederci": "<em>A</em> + <em>rivedere</em> + <em>ci</em>: 'till we see each other again'. To one person you call <em>Lei</em>, the extra-polite form is <em>ArrivederLa</em>.",
    "a-presto": "'(Until) soon' — when you'll meet again in days or weeks. For later the same day, Italians say <em>a dopo</em>.",
    "ci-vediamo": "'We'll see each other', from <em>vedere</em>: like 'see you'. Add a time: <em>ci vediamo domani</em>, <em>ci vediamo sabato</em>.",
    "buona-giornata": "'Have a good day'. <em>Giornata</em> is the day as you live through it, <em>giorno</em> the day as a unit. The same pattern gives <em>buona serata</em>, <em>buon lavoro</em>, <em>buon viaggio</em>.",

    "come-stai": "Literally 'how do you stand?', with <em>stare</em>, not <em>essere</em>. It's a real question: Italians expect an answer and an <em>e tu?</em> back. Formally: <em>come sta?</em>",
    "come-sta": "The formal 'how are you?', for someone you call <em>Lei</em>. Italian's polite form uses the third person, so it's literally 'how does she stand?'.",
    "come-va": "'How goes (it)?' — fine in formal and informal speech alike. Typical answers: <em>bene</em>, <em>tutto bene</em>, <em>non c'è male</em> (not bad).",
    "tutto-bene": "'All good?' — both question and answer: <em>Tutto bene? — Sì, tutto bene!</em> Native teachers note that the textbook <em>così così</em> (so-so) is rarely heard; Italians say <em>non c'è male</em> or <em>potrebbe andare meglio</em>.",
    "mi-chiamo": "Literally 'I call myself', from <em>chiamarsi</em>. <em>Il mio nome è…</em> is correct but stiff; everyone says <em>mi chiamo</em>.",

    "grazie": "From Latin <em>gratiae</em>, the plural of <em>gratia</em> (favour, gratitude): literally 'thanks'. Say all three syllables, <em>grà·zi·e</em> — dropping the final <em>e</em> is the classic foreigner's slip.",
    "grazie-mille": "'A thousand thanks' — and Italians use it constantly, far more than English 'thanks a lot'. <em>Mille grazie</em> works too.",
    "prego": "Literally 'I pray (you)', from <em>pregare</em>. The reply to <em>grazie</em>, but also 'please, go ahead', 'come in', 'here you are', and a shop's 'can I help you?'.",

    "figurati": "From <em>figurarsi</em>, to imagine: 'imagine (that I'd want thanks)!'. The warm, informal reply to thanks or an apology, often <em>ma figurati!</em>; formally, <em>si figuri</em>.",
    "per-favore": "'As a favour': <em>per</em> + <em>favore</em>. Use it for requests — <em>un caffè, per favore</em>. Don't confuse it with <em>prego</em>, which is 'please' only when offering or inviting.",
    "scusa": "The informal 'sorry' or 'excuse me', from <em>scusare</em>; <em>scusami</em> is a touch more personal. With someone you call <em>Lei</em>: <em>mi scusi</em>.",
    "mi-scusi": "The formal 'excuse me' — to catch a stranger's attention, squeeze past, or apologise. It's the polite imperative of <em>scusare</em>, addressed to <em>Lei</em>.",
    "mi-dispiace": "Literally 'it displeases me' (see <em>dispiacere</em>): 'I'm sorry', for apologies and for sympathy. <em>Mi dispiace tanto</em>: I'm so sorry.",

    "quanto-costa": "'How much does it cost?', from <em>costare</em>. At the counter you'll also hear <em>quant'è?</em> (how much is it?) and <em>quanto viene?</em> — both accepted here.",
    "dove-il-bagno": "<em>Dov'è</em> is <em>dove è</em> with the vowels run together. <em>Il bagno</em> is the toilet in a bar and the bathroom at home.",
    "il-conto": "In Italy the bill doesn't come until you ask — lingering over a meal is part of it. <em>Il conto</em> comes from <em>contare</em>, to count.",
    "un-attimo": "'A moment' — from Greek <em>atomos</em>, the indivisible: the smallest slice of time. Italians soften it further: <em>un attimino</em>.",
    "vorrei": "'I would like', the conditional of <em>volere</em>, and the polite way to ask: <em>vorrei un cappuccino</em>. Plain <em>voglio</em> (I want) sounds blunt.",
    "va-bene": "'(It) goes well' — OK, all right, fine. One of the most frequent expressions in spoken Italian, for agreeing or wrapping up; often clipped to <em>va be'</em>.",
    "d-accordo": "'In agreement', from <em>accordo</em> (agreement, and a musical chord). <em>Sono d'accordo</em>: I agree. On its own: 'OK, deal'.",
    "certo": "'Certain' — and so 'of course!', 'sure!'. <em>Sì, certo!</em> is the classic eager yes.",
    "boh": "The verbal shrug: 'dunno', 'who knows?'. Very informal and very common, usually with an actual shrug. Its cousin <em>mah</em> sounds more doubtful: 'well…'.",

    "magari": "From Greek <em>makarie</em>, 'O blessed one!'. It means 'if only!' or 'I wish!' — <em>Ti piacerebbe vivere in Italia? — Magari!</em> — and also 'maybe': <em>magari domani</em>.",

  function storyRng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  }
  function svgStones(x, y, w, h, seed, shades) {
    const r = storyRng(seed);
    let out = '', yy = y;
    while (yy < y + h - 2) {
      const rowH = 9 + r() * 7;
      let xx = x - r() * 14;
      while (xx < x + w) {
        const sw = 14 + r() * 22, x0 = Math.max(x, xx), x1 = Math.min(x + w, xx + sw);
        if (x1 - x0 > 3) out += `<rect x="${f1(x0 + 0.8)}" y="${f1(yy + 0.8)}" width="${f1(x1 - x0 - 1.6)}" height="${f1(Math.min(rowH, y + h - yy) - 1.6)}" rx="3" fill="${shades[Math.floor(r() * shades.length)]}"/>`;
        xx += sw;
      }
      yy += rowH;
    }
    return out;
  }

    const r = storyRng(seed);
    let out = '';
    for (let i = 0; i < n; i++) {
      const x = x0 + r() * (x1 - x0), h = hMin + r() * (hMax - hMin), lean = (r() - 0.5) * h * 0.5;

    }

  }

  // Where each chapter's pin sits on the map
  const STORY_PINS = { c1: [414, 262, true], c2: [556, 98, false], c3: [622, 136, true] };

  // ===== Dialoghi: the scenes, the player, the questions and the dictation =====
  // Progress is { read: {scene: date of the first full listen}, quiz: {scene: best score} },
  // the story's shape, so it syncs with the story's merge
  const DIALOGUE_PROGRESS_KEY = 'mazzo-dialoghi-v1';
  function loadDialogueProgress() {
    try {
      const o = JSON.parse(localStorage.getItem(DIALOGUE_PROGRESS_KEY) || '{}') || {};
      return { read: o.read && typeof o.read === 'object' ? o.read : {}, quiz: o.quiz && typeof o.quiz === 'object' ? o.quiz : {} };
    } catch (e) { return { read: {}, quiz: {} }; }
  }
  function saveDialogueProgress(p) {
    try { localStorage.setItem(DIALOGUE_PROGRESS_KEY, JSON.stringify(p)); syncTouched(); } catch (e) { /* storage full */ }
  }
  // Lines written right at least once from dictation
  function dialogueWritten(d) {
    let st = {};
    try { st = JSON.parse(localStorage.getItem(SUBJECTS.dialoghi.statsKeys.listen) || '{}') || {}; } catch (e) { /* none yet */ }
    return d.lines.filter((_, i) => { const s = st[`${d.id}-${i + 1}`]; return !!s && (+s.seen || 0) > (+s.wrong || 0); }).length;
  }
  // Two voices: the two best Italian voices (different people, not two versions of
  // one); with only one, the second speaker is the same voice pitched lower
  function dialogueVoices() {
    const a = chosenVoice();
    if (!a) return null;
    const base = v => String(v.name || '').replace(/\s*\(.*\)\s*$/, '').trim().toLowerCase();
    const b = italianVoices().slice().sort((x, y) => voiceScore(y) - voiceScore(x)).find(v => v.voiceURI !== a.voiceURI && base(v) !== base(a));
    return { A: { voice: a, pitch: 1 }, B: b ? { voice: b, pitch: 1 } : { voice: a, pitch: 0.75 } };
  }
  const DIALOGUE_RATE = { normal: 1, slow: 0.7 };

  let dialogueState = null, dialogueSpeech = null, dialogueResume = null;
  function renderDialogueHome() {
    if (dialogueResume) { const id = dialogueResume; dialogueResume = null; openDialogue(id); return; }
    const prog = loadDialogueProgress();
    const cards = DIALOGUES.map((d, i) => {
      const heard = prog.read[d.id], quiz = prog.quiz[d.id], written = dialogueWritten(d), n = d.lines.length;
      return `
        <article class="dlg-card${heard ? ' is-heard' : ''}" data-dlg="${d.id}">
          <div class="dlg-card-eyebrow">Scena ${i + 1} · ${storyEsc(d.place)}</div>
          <h3 class="dlg-card-title">${storyEsc(d.title)}</h3>
          <p class="dlg-card-en">${storyEsc(d.en)} — <span class="dlg-cast spk-a">${storyEsc(d.speakers.A)}</span> e <span class="dlg-cast spk-b">${storyEsc(d.speakers.B)}</span></p>
          <div class="dlg-card-steps">
            <span class="dlg-step${heard ? ' is-done' : ''}">${heard ? '✓ ' : ''}Ascoltato</span>
            <span class="dlg-step${quiz ? ' is-done' : ''}">Domande${quiz ? ` ${quiz.score}/${quiz.total}` : ''}</span>
            <span class="dlg-step${written === n ? ' is-done' : ''}">Dettato ${written}/${n}</span>
          </div>
          <button type="button" class="story-read-btn dlg-open" data-open="${d.id}">${heard ? 'Riapri' : 'Apri'} →</button>
        </article>`;
    }).join('');
    gameArea.innerHTML = `
      <div class="dlg-home">
        <div class="story-hero">
          <div class="setup-eyebrow">Dialoghi · Scene di vita</div>
          <h2 class="story-title">Scene di vita</h2>
          <p class="story-sub">Short everyday conversations in two voices, built from the words you're learning. Listen first with the text hidden, check what you understood, then write each line as you hear it.</p>
        </div>
        <div class="dlg-cards">${cards}</div>
      </div>`;
    gameArea.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openDialogue(b.dataset.open)));
  }

  function openDialogue(id) {
    const i = DIALOGUES.findIndex(d => d.id === id);
    if (i < 0) return;
    dialogueStopSpeaking();
    container.dataset.view = 'dialogue';
    const d = DIALOGUES[i], voiced = !!dialogueVoices();
    dialogueState = { d, i, answers: d.questions.map(() => null), showText: !voiced, showEnglish: false, slow: false };
    renderDialogueScene();
    try { window.scrollTo(0, 0); } catch (e) { /* jsdom */ }
  }
  function dialogueLinesHTML() {
    const { d, showText, showEnglish } = dialogueState;
    return d.lines.map(([spk, it, en, natural], k) => `
      <li class="dlg-line spk-${spk.toLowerCase()}" data-i="${k}" role="button" tabindex="0" aria-label="${showText ? storyEsc(it) : `Line ${k + 1}`} — listen">
        <span class="dlg-speaker">${storyEsc(d.speakers[spk])}</span>
        <span class="dlg-text">${showText
          ? `<span class="dlg-it">${storyEsc(it)}</span>${showEnglish ? `<span class="dlg-en">${storyEsc(natural || en)}</span>${natural ? `<span class="dlg-lit"><span class="literal-label">Word for word</span> ${storyEsc(en)}</span>` : ''}` : ''}`
          : `<span class="dlg-veil" style="width: ${Math.min(100, 16 + it.length * 1.5)}%"></span>`}</span>
      </li>`).join('');
  }
  function dialogueTogglesHTML() {
    const { showText, showEnglish } = dialogueState;
    return `<button type="button" class="ghost dlg-toggle" id="dlg-text" aria-pressed="${showText}">${showText ? 'Nascondi il testo' : 'Mostra il testo'}</button>
      ${showText ? `<button type="button" class="ghost dlg-toggle" id="dlg-en" aria-pressed="${showEnglish}">${showEnglish ? "Nascondi l'inglese" : "Mostra l'inglese"}</button>` : ''}`;
  }
  // The options in a fair seeded order (every order equally likely, the same on every load)
  function dialogueOptionOrder(n, seed) {
    const r = storyRng(seed), order = Array.from({ length: n }, (_, k) => k);
    for (let k = n - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
    return order;
  }
  function dialogueQuestionHTML(q, qi) {
    const order = dialogueOptionOrder(q.options.length, qi * 613 + dialogueState.i * 97 + 11);
    return `<div class="quiz-q" data-q="${qi}">
      <div class="quiz-num">${qi + 1}</div>
      <div class="quiz-main">
        <p class="quiz-text">${storyEsc(q.q)}</p>
        <div class="quiz-opts">${order.map(k => `<button type="button" class="quiz-opt" data-q="${qi}" data-k="${k}">${storyEsc(q.options[k])}</button>`).join('')}</div>
        <p class="quiz-fb" hidden></p>
      </div></div>`;
  }
  function renderDialogueScene() {
    const { d, i, slow } = dialogueState;
    const heard = loadDialogueProgress().read[d.id], written = dialogueWritten(d), voiced = !!dialogueVoices();
    gameArea.innerHTML = `
      <div class="dlg-scene">
        <button type="button" class="dlg-back" id="dlg-back">← Dialoghi</button>
        <div class="dlg-head">
          <div class="setup-eyebrow">Scena ${i + 1} · ${storyEsc(d.place)}</div>
          <h2 class="dlg-title">${storyEsc(d.title)}</h2>
          <p class="dlg-sub">${storyEsc(d.en)} — <span class="dlg-cast spk-a">${storyEsc(d.speakers.A)}</span> e <span class="dlg-cast spk-b">${storyEsc(d.speakers.B)}</span></p>
        </div>
        <section class="dlg-sec" id="dlg-listen">
          <h3 class="dlg-sec-title"><span class="dlg-num">1</span>Ascolta</h3>
          <p class="dlg-help">${voiced ? 'Listen to the whole scene before you read it. Tap any line to hear it again.' : "This browser has no Italian voice, so the scene can't be read aloud — here is the text."}</p>
          ${voiced ? `<div class="dlg-player">
            <button type="button" class="dlg-play" id="dlg-play" aria-pressed="false">▶ Ascolta il dialogo</button>
            <div class="mode-toggle dlg-speed" id="dlg-speed" role="group" aria-label="Speed">
              <button type="button" class="mode-option${slow ? '' : ' active'}" data-slow="0" aria-pressed="${!slow}">Normale</button>
              <button type="button" class="mode-option${slow ? ' active' : ''}" data-slow="1" aria-pressed="${slow}">Lento</button>
            </div>
            <span class="dlg-heard" id="dlg-heard"${heard ? '' : ' hidden'}>${heard ? `✓ Ascoltato · ${storyEsc(storyDateLabel(heard))}` : ''}</span>
          </div>` : ''}

          <ol class="dlg-lines${dialogueState.showText ? '' : ' is-veiled'}" id="dlg-lines">${dialogueLinesHTML()}</ol>
        </section>
        <section class="dlg-sec" id="dlg-quiz">
          <h3 class="dlg-sec-title"><span class="dlg-num">2</span>Capisci?</h3>
          <p class="dlg-help">Three questions about what was said — listen again whenever you like.</p>
          <div class="quiz">${d.questions.map(dialogueQuestionHTML).join('')}</div>
          <p class="dlg-quiz-score" id="dlg-quiz-score" hidden></p>
        </section>
        <section class="dlg-sec" id="dlg-dict">
          <h3 class="dlg-sec-title"><span class="dlg-num">3</span>Dettato</h3>
          <p class="dlg-help">${voiced ? "Hear each line and write it, in order — or say it. The comparison and <em>Why</em> show anything that's off, and the lines come back in Ripasso." : 'Write each line from its English — the comparison and <em>Why</em> show anything that\'s off, and the lines come back in Ripasso.'}</p>
          <div class="dlg-dict-actions">
            ${voiced ? '<button type="button" class="submit" id="dlg-dict-btn">Inizia il dettato →</button>' : ''}
            <button type="button" class="${voiced ? 'ghost' : 'submit'}" id="dlg-translate">Traduci dall'inglese →</button>
          </div>
          <p class="dlg-written" id="dlg-written">${written ? `Written right so far: ${written} of ${d.lines.length} lines.` : `${d.lines.length} lines.`}</p>
        </section>
      </div>`;
    document.getElementById('dlg-back').addEventListener('click', () => { dialogueStopSpeaking(); showSetup(); });
    const play = document.getElementById('dlg-play');
    if (play) play.addEventListener('click', () => { if (dialogueSpeech && dialogueSpeech.whole) dialogueStopSpeaking(); else dialogueSpeak(0, dialogueState.d.lines.length); });
    document.querySelectorAll('#dlg-speed .mode-option').forEach(b => b.addEventListener('click', () => {
      dialogueState.slow = b.dataset.slow === '1';
      document.querySelectorAll('#dlg-speed .mode-option').forEach(x => { const on = x === b; x.classList.toggle('active', on); x.setAttribute('aria-pressed', String(on)); });
      if (dialogueSpeech && dialogueSpeech.whole) dialogueSpeak(0, dialogueState.d.lines.length);   // playing: start again at the new speed
    }));
    wireDialogueLines();
    gameArea.querySelectorAll('#dlg-quiz .quiz-opt').forEach(b => b.addEventListener('click', () => dialogueAnswer(+b.dataset.q, +b.dataset.k)));
    const dict = document.getElementById('dlg-dict-btn');
    if (dict) dict.addEventListener('click', () => startDialogueRound('listen'));
    document.getElementById('dlg-translate').addEventListener('click', () => startDialogueRound('en-it'));
  }
  // The text and English toggles redraw only the lines, so answers to the questions stay
  function wireDialogueLines() {
    const t = document.getElementById('dlg-text');
    t.addEventListener('click', () => { dialogueState.showText = !dialogueState.showText; if (!dialogueState.showText) dialogueState.showEnglish = false; redrawDialogueLines(); });
    const e = document.getElementById('dlg-en');
    if (e) e.addEventListener('click', () => { dialogueState.showEnglish = !dialogueState.showEnglish; redrawDialogueLines(); });
    document.querySelectorAll('#dlg-lines .dlg-line').forEach(row => {
      const say = () => dialogueSpeak(+row.dataset.i, +row.dataset.i + 1);
      row.addEventListener('click', say);
      row.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); say(); } });
    });
  }
  function redrawDialogueLines() {
    const speaking = document.querySelector('.dlg-line.is-speaking');
    const k = speaking ? speaking.dataset.i : null;
    document.getElementById('dlg-toggles').innerHTML = dialogueTogglesHTML();
    const list = document.getElementById('dlg-lines');
    list.className = `dlg-lines${dialogueState.showText ? '' : ' is-veiled'}`;
    list.innerHTML = dialogueLinesHTML();
    if (k !== null) { const row = list.querySelector(`.dlg-line[data-i="${k}"]`); if (row) row.classList.add('is-speaking'); }
    wireDialogueLines();
  }

  // ----- Reading aloud, in two voices -----
  function dialogueStopSpeaking() {
    if (dialogueSpeech) {
      dialogueSpeech.cancelled = true;
      dialogueSpeech = null;
      try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ }
    }
    document.querySelectorAll('.dlg-line.is-speaking').forEach(e => e.classList.remove('is-speaking'));
    const b = document.getElementById('dlg-play');
    if (b) { b.textContent = '▶ Ascolta il dialogo'; b.setAttribute('aria-pressed', 'false'); b.classList.remove('active'); }
  }
  // Queue the lines together (so it also works where speech must start from a tap),
  // each in its speaker's voice, highlighting each as it's spoken
  function dialogueSpeak(from, to) {
    const voices = dialogueVoices();
    if (!voices || !dialogueState) return;
    dialogueStopSpeaking();
    const { d } = dialogueState, whole = from === 0 && to === d.lines.length;
    const run = { cancelled: false, whole };
    dialogueSpeech = run;
    const rate = dialogueState.slow ? DIALOGUE_RATE.slow : DIALOGUE_RATE.normal;
    try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ }
    for (let k = from; k < to; k++) {
      const [spk, it] = d.lines[k], v = voices[spk];
      const u = new window.SpeechSynthesisUtterance(it);
      u.voice = v.voice;
      u.lang = v.voice.lang;
      u.pitch = v.pitch;
      u.rate = rate;
      u.onstart = () => {
        if (run.cancelled) return;
        document.querySelectorAll('#dlg-lines .dlg-line').forEach(r => r.classList.toggle('is-speaking', +r.dataset.i === k));
      };
      u.onend = () => {
        if (run.cancelled) return;
        const row = document.querySelector(`#dlg-lines .dlg-line[data-i="${k}"]`);
        if (row) row.classList.remove('is-speaking');
        if (k === to - 1) { if (whole) dialogueHeard(); dialogueStopSpeaking(); }
      };
      window.speechSynthesis.speak(u);
    }
    if (whole) {
      const b = document.getElementById('dlg-play');
      if (b) { b.textContent = '■ Ferma'; b.setAttribute('aria-pressed', 'true'); b.classList.add('active'); }
    }
  }
  // Heard from start to end: Ascoltato, dated the first time
  function dialogueHeard() {
    const p = loadDialogueProgress(), id = dialogueState.d.id;
    if (!p.read[id]) { p.read[id] = storyTodayISO(); saveDialogueProgress(p); }
    const tag = document.getElementById('dlg-heard');
    if (tag) { tag.hidden = false; tag.textContent = `✓ Ascoltato · ${storyDateLabel(p.read[id])}`; }
  }

  // ----- The questions -----
  function dialogueAnswer(qi, k) {
    const st = dialogueState;
    if (st.answers[qi] !== null) return;
    const q = st.d.questions[qi], right = k === q.answer;
    st.answers[qi] = right;
    const box = document.querySelector(`#dlg-quiz .quiz-q[data-q="${qi}"]`);
    box.classList.add(right ? 'is-right' : 'is-wrong');
    box.querySelectorAll('.quiz-opt').forEach(b => {
      b.disabled = true;
      if (+b.dataset.k === q.answer) b.classList.add('is-correct');
      else if (+b.dataset.k === k) b.classList.add('is-chosen');
    });
    const [spk, it, en, natural] = st.d.lines[q.line];
    const fb = box.querySelector('.quiz-fb');
    fb.hidden = false;
    fb.innerHTML = `${right ? 'Esatto!' : `No — ${storyEsc(q.options[q.answer])}.`}<span class="dlg-quote"><span class="dlg-quote-who">${storyEsc(st.d.speakers[spk])}</span> «${storyEsc(it)}» <span class="dlg-quote-en">${storyEsc(natural || en)}</span></span>`;
    if (st.answers.every(x => x !== null)) {
      const score = st.answers.filter(Boolean).length, total = st.answers.length;
      const p = loadDialogueProgress(), prev = p.quiz[st.d.id];
      if (!prev || score > (+prev.score || 0)) { p.quiz[st.d.id] = { score, total }; saveDialogueProgress(p); }
      const out = document.getElementById('dlg-quiz-score');
      out.hidden = false;
      out.textContent = `${score} / ${total}${score === total ? ' — perfetto!' : ''}`;
    }
  }

  // ----- The dictation: the scene's lines, in order, as cards -----
  function startDialogueRound(dir) {
    const { d } = dialogueState;
    dialogueStopSpeaking();
    dialogueResume = d.id;   // the round's end leads back to this scene
    selectedNouns = new Set(d.lines.map((_, i) => `${d.id}-${i + 1}`));
    capValue = '';
    capMode = 'random';
    direction = dir;
    sessionPool = null;
    sessionMaxDeck = null;
    sessionIsReview = false;
    startGame();
  }

  // ===== Racconto: the map, the reader, the word cards and the questions =====
  const STORY_PROGRESS_KEY = 'mazzo-story-v1';
  function storyEsc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // Read fresh each time, so a restored backup shows straight away
  function loadStoryProgress() {
    try {
      const o = JSON.parse(localStorage.getItem(STORY_PROGRESS_KEY) || '{}') || {};
      return { read: o.read && typeof o.read === 'object' ? o.read : {}, quiz: o.quiz && typeof o.quiz === 'object' ? o.quiz : {} };
    } catch (e) { return { read: {}, quiz: {} }; }
  }
  function saveStoryProgress(p) {
    try { localStorage.setItem(STORY_PROGRESS_KEY, JSON.stringify(p)); syncTouched(); } catch (e) { /* storage full */ }
  }

  // ----- Words: which card (or meaning) each word of the text belongs to -----
  const STORY_WORD_RE = /[A-Za-zÀ-ÖØ-öø-ÿ]+'|[A-Za-zÀ-ÖØ-öø-ÿ]+|\d+/g;
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  let storyIndexCache = null;
  function storyIndex() {
    if (storyIndexCache) return storyIndexCache;
    const verb = new Map(), adj = new Map(), noun = new Map(), phrase1 = new Map(), phraseN = new Map();
    for (const [subj, list] of [['verbs', verbData], ['irregular', irregularVerbData]]) {
      for (const v of list) {
        if (!verb.has(v.it)) verb.set(v.it, { ref: `${subj}:${v.it}`, persons: null });
        for (const [p, f] of Object.entries(v.conj)) {
          const e = verb.get(f);
          if (!e) verb.set(f, { ref: `${subj}:${v.it}`, persons: [p] });
          else if (e.ref === `${subj}:${v.it}` && e.persons && !e.persons.includes(p)) e.persons.push(p);
        }
      }
    }
    for (const a of adjData) for (const f of ADJ_FORMS[a.it]) if (!adj.has(f)) adj.set(f, `adjectives:${a.it}`);
    for (const n of NOUN_ITEMS) if (!noun.has(n.noun)) noun.set(n.noun, `nouns:${n.noun}`);
    for (const p of phraseData) {
      for (const s of [p.it, ...p.itAlts]) {
        const t = (String(s).match(STORY_WORD_RE) || []).map(x => x.toLowerCase());
        if (t.length === 1 && !phrase1.has(t[0])) phrase1.set(t[0], `phrases:${p.key}`);
        else if (t.length > 1 && !phraseN.has(t.join(' '))) phraseN.set(t.join(' '), `phrases:${p.key}`);
      }
    }
    return (storyIndexCache = { verb, adj, noun, phrase1, phraseN });
  }
  function storyResolveWord(ch, w, prev, idx) {
    const n = w.toLowerCase();
    const withPersons = ref => {
      const e = idx.verb.get(n);
      return e && e.ref === ref && e.persons ? { ref, persons: e.persons } : { ref };
    };
    if (own(ch.senses, n)) return withPersons(ch.senses[n]);
    if (own(ch.glossary, n)) return { ref: `story:${ch.glossary[n]}` };
    if (/^[A-ZÀ-Ö]/.test(w) && own(STORY_NAMES, n)) return { ref: `name:${n}` };
    if (prev && STORY_DETERMINERS.has(prev) && idx.noun.has(n)) return { ref: idx.noun.get(n) };
    if (idx.phrase1.has(n)) return { ref: idx.phrase1.get(n) };
    if (idx.verb.has(n)) return withPersons(idx.verb.get(n).ref);
    if (idx.adj.has(n)) return { ref: idx.adj.get(n) };
    if (idx.noun.has(n)) return { ref: idx.noun.get(n) };
    if (own(STORY_FN, n)) return { ref: `fn:${n}` };
    if (own(STORY_NAMES, n)) return { ref: `name:${n}` };
    if (/^\d+$/.test(n)) return { ref: null, num: true };
    return { ref: null, unknown: true };
  }
  // A sentence as text and word segments; a phrase (from the chapter's glossary or
  // the Frasi deck) is one segment when its words are separated only by spaces
  function storySegments(ch, text) {
    const idx = storyIndex();
    const words = [...String(text).matchAll(STORY_WORD_RE)].map(m => ({ s: m[0], n: m[0].toLowerCase(), a: m.index, b: m.index + m[0].length }));
    const joined = k => /^\s*$/.test(text.slice(words[k].b, words[k + 1].a));
    const segs = [];
    let pos = 0;
    for (let i = 0; i < words.length;) {
      if (words[i].a > pos) segs.push({ text: text.slice(pos, words[i].a) });
      let hit = null;
      for (let L = Math.min(4, words.length - i); L >= 2 && !hit; L--) {
        let ok = true;
        for (let k = i; k < i + L - 1; k++) if (!joined(k)) { ok = false; break; }
        if (!ok) continue;
        const key = words.slice(i, i + L).map(w => w.n).join(' ');
        if (own(ch.glossary, key)) hit = { L, ref: `story:${ch.glossary[key]}` };
        else if (idx.phraseN.has(key)) hit = { L, ref: idx.phraseN.get(key) };
      }
      if (hit) {
        segs.push({ text: text.slice(words[i].a, words[i + hit.L - 1].b), ref: hit.ref });
        pos = words[i + hit.L - 1].b;
        i += hit.L;
        continue;
      }
      segs.push({ text: words[i].s, ...storyResolveWord(ch, words[i].s, i > 0 ? words[i - 1].n : null, idx) });
      pos = words[i].b;
      i++;
    }
    if (pos < text.length) segs.push({ text: text.slice(pos) });
    return segs;
  }
  const splitRef = ref => { const c = ref.indexOf(':'); return [ref.slice(0, c), ref.slice(c + 1)]; };
  let storyItemMaps = null;
  function storyItem(subj, key) {
    if (!storyItemMaps) {
      const src = { nouns: NOUN_ITEMS, verbs: VERB_ITEMS, irregular: IRREG_ITEMS, adjectives: ADJ_ITEMS, phrases: PHRASE_ITEMS, story: STORY_ITEMS };
      storyItemMaps = Object.fromEntries(Object.entries(src).map(([s, items]) => [s, new Map(items.map(n => [n.noun, n]))]));
    }
    return storyItemMaps[subj] ? storyItemMaps[subj].get(key) || null : null;

  // The chapter's learnable words: every deck item and story word, in order of appearance
  function storyChapterRefs(ch) {
    const refs = new Map();
    for (const para of ch.paragraphs) for (const [it] of para) for (const sg of storySegments(ch, it)) {
      if (!sg.ref) continue;
      const [kind] = splitRef(sg.ref);
      if (kind !== 'fn' && kind !== 'name' && !refs.has(sg.ref)) refs.set(sg.ref, sg.text);
    }

  }
  // Known: box 2 or more in either direction; learning: on the schedule or practised
  function storyStatusReader() {
    const cache = new Map();
    const get = (k, f) => { if (!cache.has(k)) cache.set(k, f()); return cache.get(k); };
    return (subj, key) => {
      let box = -1;
      for (const dir of ['en-it', 'it-en']) {
        const r = get(`srs|${subj}|${dir}`, () => seedSrs(subj, dir))[key];
        if (r) box = Math.max(box, r.b);
      }
      if (box >= 2) return 'known';
      if (box >= 0) return 'learning';
      for (const dir of ['en-it', 'it-en']) {
        const s = get(`st|${subj}|${dir}`, () => readStats(subj, dir))[key];
        if (s && s.seen) return 'learning';
      }
      return 'new';
    };
  }

  }

  // ----- The map and the chapters -----

  const STORY_MONTHS = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
  function storyDateLabel(iso) {

  // The chapter's words still to learn, with a one-tap route into the review

  function storyQuizDone() { return storyState.answers.every(a => a !== null); }

  // ----- Word cards -----
  const STORY_PERSON = { io: 'io', tu: 'tu', lui: 'lui / lei', noi: 'noi', voi: 'voi', loro: 'loro' };
  const STORY_SECTION = { nouns: 'Sostantivi', verbs: 'Verbi regolari', irregular: 'Verbi irregolari', adjectives: 'Aggettivi', phrases: 'Frasi', story: 'Dal racconto' };
  function storyWordInfo(ref, surface, persons) {
    const [kind, key] = splitRef(ref);
    const ctx = storyState && storyState.ch.context;
    const here = ctx && own(ctx, String(surface).toLowerCase()) ? ctx[String(surface).toLowerCase()] : null;
    const info = storyWordInfoBase(kind, key, surface, persons);
    return here ? { ...info, here } : info;
  }
  function storyWordInfoBase(kind, key, surface, persons) {
    if (kind === 'fn') return { head: surface, meaning: STORY_FN[key], badge: 'Small word', drill: false };
    if (kind === 'name') return { head: surface, meaning: STORY_NAMES[key], badge: 'Name', drill: false };
    if (kind === 'story') {
      const w = STORY_WORDS[key];
      const dict = w.lemma || w.it;
      return { head: surface, dict, lemma: dict.toLowerCase() !== surface.toLowerCase() ? dict : null, meaning: w.en, note: w.note,
               badge: STORY_SECTION.story, subj: 'story', key, drill: true };
    }
    const n = storyItem(kind, key);
    if (!n) return { head: surface, meaning: '', badge: '', drill: false };
    const base = { head: surface, meaning: n.en, note: n.note || null, badge: STORY_SECTION[kind], subj: kind, key, drill: true };
    if (kind === 'verbs' || kind === 'irregular') {
      const who = persons ? persons.map(p => STORY_PERSON[p]).join(' · ') : null;
      return { ...base, dict: n.it, lemma: n.it.toLowerCase() !== surface.toLowerCase() ? n.it : null, person: who };
    }
    if (kind === 'phrases') return { ...base, dict: n.it, lemma: null };

    return { ...base, dict, lemma: dict.toLowerCase() !== surface.toLowerCase() ? dict : null };
  }
  function storySchedule(subj, key) {
    const srs = loadSrs(subj, ripassoDir), t = today();
    if (!srs[key]) srs[key] = { b: 0, d: t, l: null };

    saveSrs(subj, ripassoDir, srs);
  }
  let storyPopFor = null;
  function storyShowWord(el) {
    let pop = document.getElementById('word-pop');

    const info = storyWordInfo(ref, surface, el.dataset.p ? el.dataset.p.split(',') : null);

    const added = storyState.added.has(ref);
    pop.innerHTML = `
      <button type="button" class="word-pop-close" aria-label="Close">×</button>

        <span class="word-pop-word">${storyEsc(info.head)}</span>
        ${chosenVoice() ? '<button type="button" class="word-pop-say" aria-label="Hear it" title="Hear it">🔊</button>' : ''}
      </div>
      ${info.lemma || info.person ? `<div class="word-pop-lemma">${info.lemma ? `→ <em>${storyEsc(info.lemma)}</em>` : ''}${info.person ? `<span class="word-pop-person">${storyEsc(info.person)}</span>` : ''}</div>` : ''}
      <div class="word-pop-meaning">${storyEsc(info.meaning)}</div>
      ${info.here ? `<div class="word-pop-here"><span>In questa frase</span>${storyEsc(info.here)}</div>` : ''}
      <div class="word-pop-meta">
        ${info.badge ? `<span class="word-pop-badge">${storyEsc(info.badge)}</span>` : ''}
        ${status ? `<span class="word-pop-status s-${status}">${STORY_STATUS_LABEL[status]}</span>` : ''}
      </div>
      ${info.note ? `<div class="word-pop-note">${info.note}</div>` : ''}
      ${info.drill ? `<button type="button" class="word-pop-add${added ? ' is-added' : ''}"${added ? ' disabled' : ''}>${added ? "✓ In today's Ripasso" : '+ Ripasso'}</button>` : ''}`;
    pop.hidden = false;
    storyPopFor = el;
    document.querySelectorAll('.w.is-open, .rw-chip.is-open').forEach(x => x.classList.remove('is-open'));

    if (window.matchMedia && window.matchMedia('(max-width: 600px)').matches) { pop.style.left = pop.style.top = ''; return; }
    const r = el.getBoundingClientRect(), pw = Math.min(340, window.innerWidth - 24);
    const left = Math.max(12, Math.min(r.left + window.scrollX + r.width / 2 - pw / 2, window.scrollX + window.innerWidth - pw - 12));
    pop.style.width = `${pw}px`;
    pop.style.left = `${left}px`;

  }
  function storyHideWord() {
    const pop = document.getElementById('word-pop');

  // ----- Reading aloud -----
  let storySpeech = null;
  function storyStopSpeaking() {
    if (storySpeech) {
      storySpeech.cancelled = true;
      storySpeech = null;
      try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ }
    }
    document.querySelectorAll('.rd-sent.is-speaking').forEach(e => e.classList.remove('is-speaking'));
    const b = document.getElementById('rd-listen');
    if (b) { b.textContent = '▶ Ascolta il capitolo'; b.setAttribute('aria-pressed', 'false'); b.classList.remove('active'); }
  }
  // Queue the sentences together (so it also works where speech must start from a
  // tap), highlighting each one as it is read
  function storySpeak(from, to) {
    const v = chosenVoice();
    if (!v || !storyState) return;
    storyStopSpeaking();
    const run = { cancelled: false, chapter: to - from > 1 };
    storySpeech = run;
    const rows = document.querySelectorAll('.rd-sent');
    try { window.speechSynthesis.cancel(); } catch (e) { /* no speech */ }
    for (let k = from; k < to; k++) {
      const u = new window.SpeechSynthesisUtterance(storyState.sentences[k][0].replace(/[«»]/g, '').replace(/…/g, '.'));
      u.voice = v;
      u.lang = v.lang;
      u.rate = audioPrefs.rate;
      u.onstart = () => {
        if (run.cancelled) return;
        rows.forEach(r => r.classList.toggle('is-speaking', +r.dataset.i === k));
        const row = rows[k];
        if (row && to - from > 1 && row.scrollIntoView) {
          const rr = row.getBoundingClientRect();
          if (rr.top < 80 || rr.bottom > window.innerHeight - 40) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      };
      u.onend = () => {
        if (run.cancelled) return;
        if (rows[k]) rows[k].classList.remove('is-speaking');
        if (k === to - 1) storyStopSpeaking();
      };

    }

      const b = document.getElementById('rd-listen');
      if (b) { b.textContent = '■ Ferma'; b.setAttribute('aria-pressed', 'true'); b.classList.add('active'); }
    }
  }

  // ----- Questions -----
  function storyAnswer(qi, k) {
    if (storyState.answers[qi] !== null) return;

    const box = document.querySelector(`.quiz-q[data-q="${qi}"]`);
    box.classList.add(right ? 'is-right' : 'is-wrong');
    box.querySelectorAll('.quiz-opt').forEach(b => {
      b.disabled = true;
      if (+b.dataset.k === q.answer) b.classList.add('is-correct');
      else if (+b.dataset.k === k) b.classList.add('is-chosen');
    });
    const fb = box.querySelector('.quiz-fb');
    fb.hidden = false;
    fb.textContent = right ? 'Esatto!' : `No — ${q.options[q.answer]}.`;
    renderStoryEnd();
  }
  function storyStartFind(qi) {
    storyState.find = qi;
    storyState.findTries = 0;
    storyHideWord();
    document.getElementById('reader-text').classList.add('is-finding');
    const banner = document.getElementById('find-banner');
    banner.hidden = false;
    banner.innerHTML = `<span class="find-q">${storyEsc(storyState.ch.questions[qi].q)}</span>
      <span class="find-actions"><button type="button" class="find-show" id="find-show">Mostrami</button><button type="button" class="find-cancel" id="find-cancel">Annulla</button></span>`;
    document.getElementById('find-cancel').addEventListener('click', storyEndFind);
    document.getElementById('find-show').addEventListener('click', () => storyFinishFind(false));
    const text = document.getElementById('reader-text');
    if (text.scrollIntoView) banner.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  function storyEndFind() {
    storyState.find = null;
    const text = document.getElementById('reader-text');
    if (text) text.classList.remove('is-finding');
    const banner = document.getElementById('find-banner');
    if (banner) { banner.hidden = true; banner.innerHTML = ''; }
  }
  function storyFinishFind(right) {
    const qi = storyState.find;
    const target = storyState.ch.questions[qi].find;
    document.querySelectorAll('#reader-text .w').forEach(w => { if (w.dataset.ref === target) w.classList.add('is-found'); });
    storyState.answers[qi] = right;
    storyEndFind();
    const box = document.querySelector(`.quiz-q[data-q="${qi}"]`);
    box.outerHTML = storyQuestionHTML(storyState.ch.questions[qi], qi);
    renderStoryEnd();
    const fresh = document.querySelector(`.quiz-q[data-q="${qi}"]`);
    if (fresh && fresh.scrollIntoView) setTimeout(() => fresh.scrollIntoView({ block: 'center', behavior: 'smooth' }), 700);
  }
  function storyTapWord(el) {
    if (storyState.find === null) { storyShowWord(el); return; }
    const target = storyState.ch.questions[storyState.find].find;
    if (el.dataset.ref === target) { storyFinishFind(storyState.findTries === 0); return; }
    storyState.findTries++;
    el.classList.remove('is-miss');
    void el.offsetWidth;
    el.classList.add('is-miss');
  }

  function wireStoryReader() {
    const back = () => { storyStopSpeaking(); storyHideWord(); showSetup(); };
    document.getElementById('reader-back').addEventListener('click', back);
    document.getElementById('reader-back-2').addEventListener('click', back);
    const next = document.getElementById('reader-next');
    if (next) next.addEventListener('click', () => openStoryChapter(STORY_CHAPTERS[storyState.i + 1].id));
    const text = document.getElementById('reader-text');
    text.addEventListener('click', e => {
      const w = e.target.closest('.w');
      if (w) { e.stopPropagation(); storyTapWord(w); return; }
      const play = e.target.closest('.rd-play');
      if (play) { storyHideWord(); storySpeak(+play.dataset.i, +play.dataset.i + 1); return; }
      const en = e.target.closest('.rd-en-btn');
      if (en) {
        const p = en.closest('.rd-sent').querySelector('.rd-en');
        p.hidden = !p.hidden;
        en.classList.toggle('active', !p.hidden);
      }
    });
    text.addEventListener('keydown', e => {
      const w = e.target.closest && e.target.closest('.w');
      if (w && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); storyTapWord(w); }
    });
    const listen = document.getElementById('rd-listen');
    // Stops the chapter if it's being read; otherwise reads it (over any single sentence)
    if (listen) listen.addEventListener('click', () => {
      if (storySpeech && storySpeech.chapter) storyStopSpeaking(); else storySpeak(0, storyState.sentences.length);
    });
    const enAll = document.getElementById('rd-en-all');
    enAll.addEventListener('click', () => {
      const on = enAll.getAttribute('aria-pressed') !== 'true';
      enAll.setAttribute('aria-pressed', String(on));
      enAll.classList.toggle('active', on);
      document.querySelectorAll('.rd-sent').forEach(row => {
        row.querySelector('.rd-en').hidden = !on;
        row.querySelector('.rd-en-btn').classList.toggle('active', on);
      });
    });
    document.getElementById('quiz-list').addEventListener('click', e => {
      const opt = e.target.closest('.quiz-opt');
      if (opt) { storyAnswer(+opt.dataset.q, +opt.dataset.k); return; }
      const find = e.target.closest('.quiz-find-btn');
      if (find) storyStartFind(+find.dataset.q);
    });
  }
  // Close the word card on a tap elsewhere or Escape
  document.addEventListener('click', e => {
    if (!storyPopFor) return;
    if (e.target.closest && (e.target.closest('#word-pop') || e.target.closest('.w') || e.target.closest('.rw-chip'))) return;
    storyHideWord();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && storyPopFor) storyHideWord();
  });

  // Every word of a chapter in one mixed session, then back to the chapter
  function startChapterPractice(ch) {
    const list = [];
    for (const ref of storyChapterRefs(ch).keys()) {
      const [subj, key] = splitRef(ref), n = storyItem(subj, key);
      if (n) list.push({ subj, n });
    }
    if (!list.length) return;
    storyStopSpeaking();
    storyHideWord();
    storyResume = ch.id;
    startMixedSession(list, { title: ch.title, subtitle: 'Il Mazzo · Parole del Racconto', doc: `Il Mazzo · ${ch.title}` });
  }

    phrases: { selected: new Set(), capValue: '', capMode: 'random', direction: 'en-it' },
    sentences: { selected: new Set(), capValue: '', capMode: 'random', direction: 'en-it' },
    dialoghi: { selected: new Set(), capValue: '', capMode: 'random', direction: 'listen' },
    story: { selected: new Set(), capValue: '', capMode: 'random', direction: 'en-it' }
  };

  function applySubject(s) {
    if (subject) {
      const keep = subjectState[subject].hidden || [];   // selected, but of a kind switched off
      Object.assign(subjectState[subject], { selected: keep.length ? new Set([...selectedNouns, ...keep]) : selectedNouns, capValue, capMode, direction });
    }
    subject = s;
    const cfg = SUBJECTS[s], st = subjectState[s];
    nounData = cfg.items;
    THEMES = cfg.themes;
    FREQUENCY_ORDER = cfg.frequency;
    selectedNouns = st.selected;
    st.hidden = [];
    if (cfg.typeFilter) {   // only the kinds of sentence chosen at the top of the setup
      const on = activeSentenceTypes();
      nounData = cfg.items.filter(n => on.includes(n.type));
      const pool = new Set(nounData.map(n => n.noun));
      THEMES = cfg.themes.filter(th => on.includes(th.type));
      FREQUENCY_ORDER = cfg.frequency.filter(k => pool.has(k));
      st.hidden = [...st.selected].filter(k => !pool.has(k));
      selectedNouns = new Set([...st.selected].filter(k => pool.has(k)));
    }
    frequencyRank = Object.fromEntries(FREQUENCY_ORDER.map((n, i) => [n, i + 1]));
    capValue = st.capValue;
    capMode = st.capMode;
    direction = st.direction;
    stats = loadStats();
    associations = loadAssociations();
    container.dataset.subject = s;
    container.dataset.kind = cfg.kind;
    container.dataset.side = cfg.panel ? '1' : '0';   // sections with a side panel get the wide setup

    totalEl.textContent = nounData.length;
    try { localStorage.setItem(SUBJECT_KEY, s); } catch (e) { /* storage unavailable */ }
  }

  // ===== Ripasso del giorno =====
  const RIPASSO_DIR_KEY = 'mazzo-ripasso-dir';
  const REVIEW_START = 30;   // cards in play at the start; Deck size reaches the rest
  const REVIEW_LABEL = { nouns: 'noun', verbs: 'regular verb', irregular: 'irregular verb', adjectives: 'adjective', prepositions: 'preposition', phrases: 'phrase', sentences: 'sentence', story: 'story word' };
  let ripassoDir = 'en-it';

  // Point the game at one section's items, progress and associations without
  // touching the setup screen — used card by card in the mixed review
  function setCardContext(subj) {
    if (subject === subj) return;
    subject = subj;
    const cfg = SUBJECTS[subj];
    nounData = cfg.items;
    THEMES = cfg.themes;
    FREQUENCY_ORDER = cfg.frequency;
    frequencyRank = Object.fromEntries(FREQUENCY_ORDER.map((n, i) => [n, i + 1]));

  function startRipasso() {

  }
  function startMixedSession(list, labels) {
    if (!list.length) return;
    // Remember the section we came from, with its setup, to return to afterwards
    Object.assign(subjectState[subject], { selected: selectedNouns, capValue, capMode, direction });
    reviewReturn = subject;
    reviewMode = true;
    direction = ripassoDir;
    // One card per due item: a noun, a phrase, an adjective's dictionary form, or one
    // conjugation of a verb (a different person each time)
    const keepVerbMode = verbMode, keepAdjMode = adjMode;
    verbMode = 'conjugations';
    adjMode = 'dictionary';
    const cards = list.flatMap(({ subj, n }) => {
      setCardContext(subj);
      const options = cardsForItem(n);
      const picked = SUBJECTS[subj].keepPairs ? options : [options[Math.floor(Math.random() * options.length)]];
      return picked.map(c => ({ ...c, key: `${subj}:${c.key}`, subject: subj }));
    });
    verbMode = keepVerbMode;
    adjMode = keepAdjMode;
    sessionPool = cards;                              // everything due
    sessionMaxDeck = cards.slice(0, REVIEW_START);    // most overdue first
    sessionPickMode = 'random';
    sessionFocused = false;
    sessionIsReview = false;
    deck = sessionMaxDeck.slice();
    document.getElementById('app-title').textContent = labels.title;
    document.getElementById('app-subtitle').textContent = labels.subtitle;
    document.title = labels.doc;
    startGame();   // the session is set, so this shuffles these cards and starts
  }

  function renderRipasso() {

    const parts = Object.keys(SUBJECTS).filter(s => counts[s]).map(s => `${counts[s]} ${REVIEW_LABEL[s]}${counts[s] === 1 ? '' : 's'}`);
    const anyHistory = Object.keys(SUBJECTS).some(s => Object.keys(loadSrs(s, ripassoDir)).length);

  }

  // Returns 'full' | 'partial' | 'empty' for a given theme based on current selection
  function themeState(theme) {
    let selected = 0;
    for (const n of theme.nouns) if (selectedNouns.has(n)) selected++;
    if (selected === 0) return 'empty';
    if (selected === theme.nouns.length) return 'full';
    return 'partial';
  }

  // Return up to `count` noun keys ordered weakest first.
  // Weakness = error rate (with seen-count tie-break). Cards with zero
  // wrong answers don't count as weak; if we don't have enough, we pad
  // with random unseen ones so the button always returns something useful.
  // Shared "weakest first" ordering for the Focus list (takes noun keys).
  // Ranks by error rate (wrong ÷ seen), highest first. Unseen cards count as
  // 100% — nothing learned yet — and land just after cards you've got wrong
  // every single time. Ties: more wrong answers first (stronger evidence), then A–Z.
  function compareWeakness(a, b) {
    const sa = stats[a] || { seen: 0, wrong: 0 };
    const sb = stats[b] || { seen: 0, wrong: 0 };
    const ra = sa.seen > 0 ? sa.wrong / sa.seen : 1;
    const rb = sb.seen > 0 ? sb.wrong / sb.seen : 1;
    if (ra !== rb) return rb - ra;
    if (sa.wrong !== sb.wrong) return sb.wrong - sa.wrong;
    return a.localeCompare(b);
  }

  function weakestNouns(count) {
    if (isVerbSubject()) {
      // Ported from the verb game: wrongs / (attempts + 2). The +2 smoothing damps
      // small samples so a 1/1 miss doesn't outrank a well-attested 15/20 struggle.
      const scored = nounData.map(n => {
        const s = stats[n.noun] || { seen: 0, wrong: 0 };
        return { noun: n.noun, score: s.wrong / (s.seen + 2), wrong: s.wrong };
      });
      scored.sort((a, b) => (b.score - a.score) || (b.wrong - a.wrong) || (Math.random() - 0.5));
      let chosen = scored.filter(s => s.wrong > 0).slice(0, count).map(s => s.noun);
      if (chosen.length < count) {
        const chosenSet = new Set(chosen);
        const rest = shuffle(nounData.map(n => n.noun).filter(k => !chosenSet.has(k)));
        chosen = chosen.concat(rest.slice(0, count - chosen.length));
      }
      return chosen;
    }
    const scored = nounData.map(n => {
      const s = stats[n.noun] || { seen: 0, wrong: 0 };
      const rate = s.seen > 0 ? s.wrong / s.seen : 0;
      return { noun: n.noun, rate, wrong: s.wrong, seen: s.seen };
    });
    scored.sort((a, b) => {
      if (b.rate !== a.rate) return b.rate - a.rate;
      return b.wrong - a.wrong;
    });
    const weak = scored.filter(s => s.wrong > 0).slice(0, count);
    if (weak.length < count) {
      const have = new Set(weak.map(w => w.noun));
      const padPool = shuffle(nounData.filter(n => !have.has(n.noun)));
      for (const n of padPool) {
        if (weak.length >= count) break;
        weak.push({ noun: n.noun });
      }
    }
    return weak.map(w => w.noun);
  }
